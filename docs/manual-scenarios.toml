wait = { en = "applied the view settings", ja = "ビューの設定を反映した" }
text = { en = "The Display section turns on row numbers, zebra stripes and column lines for this view.", ja = "「表示」の節で、このビューの行番号・一行おきの色・列の区切り線を切り替える。" }

[[shot]]
id = "native-view-save"
title = { en = "Save as an mdgrid view", ja = "mdgrid のビューとして保存" }

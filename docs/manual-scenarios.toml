wait = { en = "file name", ja = "ファイルの名前" }
text = { en = "Writes the view to a new .base under a name you choose; existing .base files are never overwritten.", ja = "名前を決めて新しい .base に書く。既存の .base は書き換えない。" }

[[shot]]

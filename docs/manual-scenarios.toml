# Screenshot manual scenes for the app-manual skill. The cursor starts on the first key column (status).
# Output: manual/<lang>/ (git-ignored). Regenerate:
#   python3 <app-manual>/scripts/tui_shot.py docs/manual-scenarios.toml --lang ja --env LANG=ja_JP.UTF-8
#   python3 <app-manual>/scripts/tui_shot.py docs/manual-scenarios.toml --lang en --env LANG=en_US.UTF-8
# Build first: cargo build --release. Only the sample vault (examples/vault) is shown.
# Each shot runs on a fresh copy of examples/ in /tmp/mdgrid-demo (stage), so shots may save; the real samples are never written.

[app]
command = ["./target/release/mdgrid", "examples/vault"]
stage = ["examples"]
stage_dir = "/tmp/mdgrid-demo"
cols = 100
rows = 28
ready = "タスク/"
env = { MDGRID_TODAY = "2026-10-03" }
timeout = 10
title = { ja = "mdgrid の使い方", en = "Using mdgrid" }
intro = { ja = "フロントマター付きの Markdown のノートを、ターミナルの表で見て直す。画面は見本の保管庫(examples/vault)。", en = "View and edit Markdown notes with frontmatter as a table in the terminal. The screens show the sample vault (examples/vault)." }

[[shot]]
id = "table"
title = { ja = "フォルダを開く", en = "Open a folder" }
text = { ja = "ノートが行に、フロントマターのキーが列に並ぶ。上に検索の欄、下に今押せるキーが出る。", en = "Notes become rows and frontmatter keys become columns. The search bar is on top; the keys you can press now are at the bottom." }

[[shot]]
id = "edit-list"
title = { ja = "値を選んで直す", en = "Pick a value" }
keys = ["Enter"]
text = { ja = "status のセルで Enter。同じ列のほかのノートの値から選べる。打てば今の値を置き換えて自由入力になる。", en = "Press Enter on a status cell. Choose from the values other notes use, or just type a new one." }

[[shot]]
id = "list-narrow"
title = { ja = "打って候補を絞る", en = "Type to narrow the candidates" }
keys = ["Enter", "d", "o"]
text = { ja = "リストで打つと、打った文字を含む候補だけが残る(まだ何も選んでいない)。↓・↑ で候補を選び、そのまま Enter なら打った文字を書く。", en = "Typing in the list keeps only the candidates that contain what you typed (nothing is selected yet). Pick one with Down or Up, or press Enter to write what you typed." }

[[shot]]
id = "edit-date"
title = { ja = "日付をカレンダーで入れる", en = "Enter a date with the calendar" }
keys = ["l", "Enter"]
text = { ja = "日付の列ではカレンダーが開く。矢印で日を動かし、Enter で決める。", en = "Date columns open a calendar. Move with the arrow keys and press Enter." }

[[shot]]
id = "edit-tags"
title = { ja = "タグを付け外しする", en = "Add and remove tags" }
keys = ["l", "l", "l", "l", "Enter"]
text = { ja = "リストの列では、保管庫にある値の一覧から付け外しする。", en = "List columns let you toggle values found across the vault." }

[[shot]]
id = "save"
title = { ja = "差分を見てから保存する", en = "Review the diff, then save" }
keys = ["Enter", "Down", "Enter", "C-s"]
text = { ja = "直した値はすぐには書かない。Ctrl+S でファイルごとの差分を見て、確かめてから書く。直したキーの値の外は1バイトも変えない。", en = "Edits are kept until you save. Ctrl+S shows the diff per file; confirm to write. Nothing outside the edited value changes." }

[[shot]]
id = "save-done"
title = { ja = "保存したあと", en = "After saving" }
keys = ["Enter", "Down", "Enter", "C-s", "Enter"]
wait = { ja = "保存した 1件", en = "saved 1 file" }
text = { ja = "保存の確認で Enter を押すと書く。未保存は 0 に戻り、書いたファイルの数が出る。", en = "Press Enter in the save review to write. Unsaved goes back to 0 and the number of files written is shown." }

[[shot]]
id = "help"
title = { ja = "ヘルプ", en = "Help" }
keys = ["?"]
wait = { ja = "ヘルプ", en = "Help" }
text = { ja = "? で全部のキーの一覧。設定で割り当て直せる(docs/keys.md)。", en = "? lists every key. Keys can be rebound in the config (docs/keys.md)." }

[[shot]]
id = "palette"
title = { ja = "コマンドのパレット", en = "Command palette" }
keys = [":"]
text = { ja = ": で、名前で探して動作を選べる。", en = "Press : to find an action by name." }

[[shot]]
id = "view-settings"
title = { ja = "ビューの設定", en = "View settings" }
keys = ["o"]
text = { ja = "o で列・フィルター・並べ替え・グループを決め、mdgrid のビューとして保存できる。", en = "Press o to choose columns, filters, sorting and grouping, and save them as a mdgrid view." }

[[shot]]
id = "new-note"
title = { ja = "新しいノートを作る", en = "Create a note" }
keys = ["a"]
text = { ja = "a か右上の「+ 新規」で、新しいノートの窓が開く。名前と、表の列ごとの欄が並び、前もって入る値には出どころが付く。", en = "Press a, or click \"+ New\" at the top right: the new note form lists the name and a field for each column, and preset values show where they come from." }

[[shot]]
id = "new-note-done"
title = { ja = "作ったノート", en = "The new note" }
keys = ["a", "text:電話をかける", "C-s"]
wait = { ja = "作った", en = "created" }
text = { ja = "名前を打って Ctrl+S で、すぐにファイルができる(Enter は次の欄へ)。作った行が選ばれる。", en = "Type a name and press Ctrl+S: the file is created at once (Enter moves to the next field), and its row is selected." }

[[shot]]
id = "palette-search"
title = { en = "Find a command by name", ja = "コマンドを名前で探す" }
keys = [":", "text:save"]
text = { en = "Type part of a name; each command shows its key next to it.", ja = "名前の一部を打つと候補が絞られ、横に割り当てキーが出る。" }

[[shot]]
id = "action-menu"
title = { en = "Actions for the selected cell", ja = "その場の操作の一覧" }
keys = ["x"]
wait = { en = "Action menu", ja = "操作の一覧" }
text = { en = "x or a right click lists what you can do on the selected cell, grouped by cell, column, row, and view and file, each with its key. Pick one with ↑↓ and Enter, or press its key; Esc closes.", ja = "x か右クリックで、選んでいるセルで今できる操作が、セル・列・行・ビューとファイルの節に分かれ、キーを添えて並ぶ。↑↓ と Enter か、添えたキーで実行する。Esc で閉じる。" }

[[shot]]
id = "prefix-hint"
title = { en = "Keys that follow a prefix", ja = "前置きのキーの続き" }
keys = ["g"]
wait = "g →"
text = { en = "After a prefix key such as g, the bottom band lists the keys you can press next. Esc cancels the prefix.", ja = "g のような前置きのキーを押すと、下の帯に続けて押せるキーが出る。Esc で前置きを取り消す。" }

[[shot]]
id = "base-tabs"
title = { en = "Open a .base file", ja = ".base を開く" }
command = ["./target/release/mdgrid", "examples/vault/タスク.base"]
ready = "進行中"
text = { en = "Each table view of the .base becomes a tab; the first one opens. Column titles come from displayName.", ja = ".base の table ビューがタブに並び、先頭が開く。列の見出しは displayName。" }

[[shot]]
id = "base-group"
title = { en = "Switch views; grouped rows", ja = "ビューを切り替える(グループ)" }
command = ["./target/release/mdgrid", "examples/vault/タスク.base"]
ready = "進行中"
keys = ["]"]
wait = "▾"
text = { en = "] and [ switch views. This view groups the notes by status with heading rows.", ja = "] と [ でビューを切り替える。このビューは status ごとに見出しの行で分かれる。" }

[[shot]]
id = "base-group-folded"
title = { en = "Fold a group", ja = "まとまりを畳む" }
command = ["./target/release/mdgrid", "examples/vault/タスク.base"]
ready = "進行中"
keys = ["]", "Enter"]
wait = "▸"
text = { en = "Enter on a heading row folds or unfolds its group.", ja = "見出しの行で Enter を押すと、そのまとまりを畳む・開く。" }

[[shot]]
id = "base-unsupported-formula"
title = { en = "Formulas mdgrid cannot evaluate", ja = "評価できない式" }
command = ["./target/release/mdgrid", "examples/vault/タスク.base", "--view", "未対応の式"]
ready = "未対応の式"
keys = ["l", "l"]
wait = { en = "unsupported formula", ja = "未対応の式(値を出さない)" }
text = { en = "A column whose formula is not supported shows a dim ? instead of guessing. Select it to see which expression.", ja = "評価できない式の列は推測せず薄い ? を出す。選ぶと下にどの式かが出る。" }

[[shot]]
id = "base-cards"
title = { en = "Views other than table", ja = "table 以外のビュー" }
command = ["./target/release/mdgrid", "examples/vault/タスク.base", "--view", "カード"]
ready = "カード"
wait = { en = "cannot be opened", ja = "開けない" }
text = { en = "Only table views are supported; other view types are not opened and the reason is shown.", ja = "mdgrid は table のビューだけ。ほかの型は開かずに理由を出す。" }

[[shot]]
id = "sync-conflict"
title = { en = "Sync conflict files", ja = "同期の競合ファイル" }
keys = [":", "text:14", "Enter"]
wait = { en = "sync conflict", ja = "同期の競合" }
text = { en = "Conflict copies made by sync tools are marked with ! so you can resolve them by hand.", ja = "同期の道具が作った競合ファイルには ! が付く。手で片付ける。" }

[[shot]]
id = "cell-marks"
title = { en = "Empty, null, missing and mismatched values", ja = "空・null・キーなし・型の不一致" }
keys = ["j", "j", "j", "l"]
text = { en = "∅ is null, \"\" is an empty string, a blank cell has no key, and ! marks a value that does not fit the column type (someday in a date column).", ja = "∅ は null、\"\" は空の文字列、空欄はキーなし。! は列の型に合わない値(日付の列の someday)。" }

[[shot]]
id = "detail"
title = { en = "Details of one note", ja = "1つのノートの詳細" }
keys = ["K"]
wait = { en = "Details", ja = "詳細" }
text = { en = "K lists every property of the note; long values wrap in full. Enter edits the selected one.", ja = "K で全部のプロパティを縦に並べる。長い値も折り返して全文。Enter で編集。" }

[[shot]]
id = "no-color"
title = { en = "Without colors", ja = "色なしで" }
env = { NO_COLOR = "1" }
keys = ["Backspace"]
wait = { en = "Unsaved 1", ja = "未保存 1" }
text = { en = "With NO_COLOR or --no-color, pending changes and other states are still shown by marks such as *.", ja = "NO_COLOR や --no-color でも、ためた変更などは * のような印で見分けられる。" }

[[shot]]
id = "goto-line"
title = { en = "Go to a row number", ja = "行番号へ移動" }
keys = [":", "text:14"]
wait = { en = "Go to line 14", ja = "14 行目へ移動" }
text = { en = "Type a number in the palette and press Enter to jump to that row.", ja = "パレットで番号を打って Enter で、その行へ移る。" }

[[shot]]
id = "search"
title = { en = "Search", ja = "検索" }
keys = ["/", "text:doing", "Enter"]
text = { en = "/ highlights every match; n and N move between them. Lowercase terms ignore case.", ja = "/ で一致をすべて強調し、n・N で移る。小文字だけの語は大文字小文字を区別しない。" }

[[shot]]
id = "quick-filter"
title = { en = "Quick filter", ja = "簡易の絞り込み" }
keys = ["\\", "text:家"]
wait = { en = "/16 rows", ja = "/16行" }
text = { en = "\\ moves into the search bar; rows narrow as you type, and the bar shows the count. Esc clears it.", ja = "\\ で上の欄に入り、打つたびに行が絞られ件数が出る。Esc で解除。" }

[[shot]]
id = "filter-same"
title = { en = "Only rows with the same value", ja = "同じ値の行だけ" }
keys = [","]
wait = { en = "same value", ja = "同じ値" }
text = { en = ", keeps the rows whose value equals the selected cell; * only highlights them.", ja = ", で選んだセルと同じ値の行だけにする。* は強調だけ。" }

[[shot]]
id = "sort-column"
title = { en = "Sort by a column", ja = "列で並べ替える" }
keys = ["l", "s"]
wait = { en = "ascending", ja = "昇順" }
text = { en = "s sorts by the column: ascending, descending, then off. The view remembers it; the .base file is not changed.", ja = "s で 昇順 → 降順 → 解除。並べ替えはビューに覚える。.base は変えない。" }

[[shot]]
id = "hide-column"
title = { en = "Hide a column", ja = "列を隠す" }
keys = ["l", "-"]
wait = { en = "hid column", ja = "列を隠した" }
text = { en = "- hides the column and + brings it back. H and L move columns; < and > change the width.", ja = "- で隠し、+ で戻す。H・L で列を動かし、<・> で幅を変える。" }

[[shot]]
id = "add-column"
title = { en = "Add a column", ja = "列を足す" }
keys = ["A", "r", "e", "v", "i", "e", "w", "e", "r", "Enter"]
wait = { en = "added column", ja = "列 reviewer を足した" }
text = { en = "A adds a column for a key no note has yet. Only the notes you fill in get the key when you save.", ja = "A で、まだどのノートにも無いキーの列を足す。保存では、値を入れたノートにだけキーを書く。" }

[[shot]]
id = "edit-datetime-time"
title = { en = "Set the time of a date and time", ja = "日時の時刻を選ぶ" }
command = ["./target/release/mdgrid", "examples/schedule"]
ready = "start"
keys = ["l", "Enter", "C-o", "Up"]
wait = { en = "14:45", ja = "14:45" }
text = { en = "Date and time columns show a time field under the calendar. Ctrl+O switches to it; Up and Down move 15 minutes, Shift+Up and Shift+Down one hour.", ja = "日時の列では、カレンダーの下に時刻の欄が出る。Ctrl+O で時刻の欄に移り、↑↓ で15分、Shift+↑↓ で1時間動かす。" }

[[shot]]
id = "export-table"
title = { en = "Export the table to a file", ja = "表をファイルに書き出す" }
keys = [":", "text:export_table", "Enter", "text:tasks.csv", "Enter"]
wait = { en = "wrote", ja = "書いた" }
text = { en = "The command palette exports the table as shown (filters, sorting and hidden columns applied). The extension picks the format: .csv, .tsv, .json or .md. The first column is each note's path, so a CSV or JSON can come back with --apply.", ja = "パレットから、今見えている表(絞り込み・並べ替え・隠した列を当てたもの)を書き出す。形は拡張子(.csv・.tsv・.json・.md)で決まる。先頭の列は各ノートのパスなので、CSV と JSON は --apply で戻せる。" }

[[shot]]
id = "open-place"
title = { en = "Open a registered table", ja = "登録した表を開く" }
env = { XDG_CONFIG_HOME = "/tmp/mdgrid-demo/examples/places" }
keys = [":", "text:open_place", "Enter"]
text = { en = "Tables registered in places.toml (from the palette's register this table, or by hand) are listed by group. Type to narrow, Enter to open. Plain mdgrid with no arguments shows the same list.", ja = "places.toml に登録した表(パレットの「この表を登録」か手で書く)が分類ごとに並ぶ。打って絞り、Enter で開く。引数なしの mdgrid でも同じ一覧が出る。" }

[[shot]]
id = "freeze-columns"
title = { en = "Freeze columns", ja = "列を固定する" }
keys = ["l", "F", "End"]
text = { en = "F keeps the columns up to the selected one visible while you scroll right.", ja = "F で選んだ列までを固定し、右へ流しても見えたままにする。" }

[[shot]]
id = "mark-rows"
title = { en = "Mark rows", ja = "行に印を付ける" }
keys = ["Space", "Space", "Space"]
wait = { en = "selected 3", ja = "選択 3" }
text = { en = "Space marks a row and moves down; v selects a range, Ctrl+A selects all, Esc clears.", ja = "Space で印を付けて下へ。v で範囲、Ctrl+A で全部、Esc で解く。" }

[[shot]]
id = "edit-free-text"
title = { en = "Type a new value", ja = "新しい値を打つ" }
keys = ["Enter", "text:waiting"]
wait = "waiting"
text = { en = "Typing in the list replaces the value with what you type (← or Backspace first to edit the current value instead). Enter confirms, Esc cancels, Tab confirms and moves right.", ja = "リストで打つと、今の値を置き換えて自由入力になる(今の値を直すには先に ← か BS)。Enter で確定、Esc で取り消し、Tab で確定して右へ。" }

[[shot]]
id = "checkbox-toggle"
title = { en = "Toggle a checkbox", ja = "チェックボックスを切り替える" }
keys = ["l", "l", "l", "Enter"]
wait = { en = "Unsaved 1", ja = "未保存 1" }
text = { en = "Enter switches between true and false (an empty cell becomes true; Backspace empties it). The change is pending until you save.", ja = "Enter で true と false を切り替える(空のセルは true に。空にするのは BS)。保存までは書かない。" }

[[shot]]
id = "edit-date-invalid"
title = { en = "Dates are checked", ja = "日付は確かめられる" }
keys = ["l", "Enter", "Backspace", "Backspace", "Backspace", "Backspace", "Backspace", "Backspace", "Backspace", "Backspace", "Backspace", "Backspace", "text:2026-02-30", "Enter"]
wait = { en = "no such date", ja = "実在しない日付" }
text = { en = "A date that does not exist is refused and the input stays open. +3 means three days from today.", ja = "実在しない日付は受け付けず、入力は開いたまま。+3 は今日から3日後。" }

[[shot]]
id = "edit-number-invalid"
title = { en = "Numbers only in number columns", ja = "数の列は数だけ" }
keys = ["l", "l", "Enter", "text:a", "Enter"]
wait = { en = "not a number", ja = "数として読めない" }
text = { en = "A number column accepts only values that read as a number.", ja = "数の列は数として読める値だけを受け付ける。" }

[[shot]]
id = "clear-cell"
title = { en = "Empty a cell", ja = "セルを空にする" }
keys = ["Backspace"]
wait = { en = "Unsaved 1", ja = "未保存 1" }
text = { en = "Backspace or Delete empties the value; it is saved as `key:` and the key stays.", ja = "Backspace か Delete で空にする。保存すると `key:` と書かれ、キーは残る。" }

[[shot]]
id = "type-mismatch"
title = { en = "A value of the wrong type", ja = "型の合わない値を直す" }
keys = ["j", "j", "j", "l", "Enter"]
wait = { en = "does not fit the column type", ja = "型に合わない" }
text = { en = "A cell whose value does not fit the column opens the input for the column's type, showing this month.", ja = "型の合わない値のセルは列の型の入力で開き、カレンダーは今日の月を出す。" }

[[shot]]
id = "bulk-set"
title = { en = "Set a value on several rows", ja = "複数の行にまとめて入れる" }
keys = ["Space", "Space", "Space", "k", "Enter"]
wait = { en = "bulk 3 rows", ja = "一括 3行" }
text = { en = "With rows marked, the edit applies to all of them. Rows that cannot take the value are skipped and counted.", ja = "印を付けた行に同じ値を入れる。入れられない行は飛ばし、数と理由を出す。" }

[[shot]]
id = "bulk-tags"
title = { en = "Add or remove list items on several rows", ja = "複数の行のリストを付け外し" }
keys = ["l", "l", "l", "l", "Space", "Space", "Space", "k", "Enter"]
wait = { en = "some rows", ja = "一部の行" }
text = { en = "[x] means every marked row has the item, [-] some of them. Other items in each row are kept.", ja = "[x] は全部の行、[-] は一部の行が持つ。各行のほかの要素は残る。" }

[[shot]]
id = "held-row"
title = { en = "Edited rows stay in place", ja = "直した行はその場に残る" }
command = ["./target/release/mdgrid", "examples/vault/タスク.base"]
ready = "進行中"
keys = ["l", "Enter", "Backspace", "Backspace", "Backspace", "Backspace", "Backspace", "text:todo", "Enter"]
wait = { en = "would not be here", ja = "この位置に来ない" }
text = { en = "This view shows only doing; a row you change to todo stays until you save or move, so it does not vanish.", ja = "doing だけのビューで todo に直しても、保存か移動まで行は残る。" }

[[shot]]
id = "add-frontmatter"
title = { en = "Notes without frontmatter", ja = "フロントマターの無いノート" }
keys = ["G", "k", "Enter", "text:todo", "Enter", "C-s"]
wait = { en = "Save review", ja = "保存の確認" }
text = { en = "Writing to a note without frontmatter adds a --- block at the top; the body is unchanged.", ja = "フロントマターの無いノートに書くと、先頭に --- の区切りと行が足される。本文は変わらない。" }

[[shot]]
id = "readonly-cell-nested"
title = { en = "Cells you cannot edit", ja = "直せないセル" }
keys = ["j", "l", "l", "l", "l", "l", "l", "l", "Enter"]
wait = { en = "nested value", ja = "ネストした値" }
text = { en = "Nested maps, block scalars, file.* and formula.* columns and a few other forms are read-only; Enter shows the reason.", ja = "ネストした値・ブロックスカラー・file.* と formula.* の列などは読むだけで、Enter で理由が出る。" }

[[shot]]
id = "multiline-value"
title = { en = "Values with line breaks", ja = "改行を含む値" }
keys = ["l", "l", "l", "l", "l", "l", "Enter"]
wait = { en = "line breaks", ja = "改行を含む値" }
text = { en = "Values with line breaks cannot be edited in the one-line input; open the note with e.", ja = "改行を含む値は1行の入力では直せない。e でノートをエディタで開く。" }

[[shot]]
id = "showcase-calendar"
title = { en = "Date format and week start from the config", ja = "設定の日付の形と週の始まり" }
command = ["./target/release/mdgrid", "--config", "examples/showcase/config.toml", "examples/showcase/vault/プロジェクト.base"]
ready = "今週の作業"
env = { MDGRID_TODAY = "2026-10-02" }
keys = ["l", "l", "Enter"]
wait = { en = "year", ja = "年" }
text = { en = "examples/showcase sets date_format = \"YYYY/MM/DD (ddd)\" and week_start = \"mon\". Notes still get YYYY-MM-DD.", ja = "見本の設定は date_format = \"YYYY/MM/DD (ddd)\"・week_start = \"mon\"。ノートには YYYY-MM-DD で書く。" }

[[shot]]
id = "quit-confirm"
title = { en = "Quitting with unsaved changes", ja = "未保存のまま終わる" }
keys = ["Backspace", "q"]
wait = { en = "before quitting", ja = "終わる前に" }
text = { en = "s reviews and saves, d discards and quits, Esc goes back.", ja = "s で保存、d で捨てて終わる、Esc で戻る。" }

[[shot]]
id = "readonly-mode"
title = { en = "Open read-only", ja = "読むだけで開く" }

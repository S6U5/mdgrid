text ={ en = "Choose a column, then tick the values to keep or hide. Counts are shown; (empty) covers notes without the key.", ja = "列を選び、残す・隠す値にチェックを付ける。件数が添えられ、キーの無いノートは「(空)」。" }

[[shot]]
id = "chips"
title = { en = "The settings band", ja = "設定の帯" }

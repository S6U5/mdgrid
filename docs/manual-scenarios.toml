wait = { en = "except done", ja = "done を除く" }
text = { en = "Active filters, sorting and grouping appear above the table. f moves into the band; Backspace removes an item.", ja = "効いている条件が表の上に並ぶ。f で帯に入り、Backspace で外す。" }

[[shot]]
id = "display-row-numbers"
title = { en = "Row numbers and column lines", ja = "行番号と列の区切り線" }

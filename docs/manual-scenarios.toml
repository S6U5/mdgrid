wait = { en = "saved as the mdgrid view", ja = "として保存した" }
text = { en = "Save the current settings under a name; it becomes a tab next to All notes and is kept in views.toml.", ja = "今の見せ方に名前を付けて保存すると、「既定の表」の横のタブになり、views.toml に残る。" }

[[shot]]
id = "export-base"
title = { en = "Export to a new .base", ja = "新しい .base に書き出す" }

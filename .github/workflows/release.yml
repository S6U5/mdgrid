name: Release

# Push a tag such as v0.1.0 to build the binaries, record the feature tours (demos.yml), publish a GitHub Release
# with both attached, publish the crate to crates.io, and write the Homebrew formula to the tap.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-latest }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-24.04-arm }
          # macos-13 (Intel) runners are retired; build the Intel binary on Apple silicon.
          - { target: x86_64-apple-darwin, os: macos-latest }
          - { target: aarch64-apple-darwin, os: macos-latest }
          - { target: x86_64-pc-windows-msvc, os: windows-latest }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          name="mdgrid-${GITHUB_REF_NAME}-${{ matrix.target }}"
          bin="target/${{ matrix.target }}/release/mdgrid"
          [ -f "$bin.exe" ] && bin="$bin.exe"
          mkdir -p "dist/$name/completions"
          cp "$bin" README.md LICENSE-MIT LICENSE-APACHE "dist/$name/"
          for sh in bash zsh fish elvish powershell; do
            "$bin" --completions "$sh" > "dist/$name/completions/mdgrid.$sh"
          done
          "$bin" --man > "dist/$name/mdgrid.1"
          cd dist
          if [[ "${{ matrix.target }}" == *windows* ]]; then
            7z a -tzip "$name.zip" "$name" > /dev/null
            archive="$name.zip"
          else
            tar czf "$name.tar.gz" "$name"
            archive="$name.tar.gz"
          fi
          if command -v sha256sum > /dev/null; then
            sha256sum "$archive" > "$archive.sha256"
          else
            shasum -a 256 "$archive" > "$archive.sha256"
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256

  notes:
    # Third-party code runs here, with read-only permissions; the publishing job only uses GitHub's own tools.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: orhun/git-cliff-action@a9a95522b26fe6403f7bb24031f21fb573d0f5ff # v4.9.1
        with:
          config: cliff.toml
          args: --latest --strip header
        env:
          OUTPUT: NOTES.md
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: notes
          path: NOTES.md

  demos:
    # The feature tours as GIFs. Releases are immutable, so they are recorded before the release is created.
    uses: ./.github/workflows/demos.yml

  release:
    needs: [build, notes, demos]
    # A broken tape must not block a release: publish without the GIFs then.
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.notes.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mv dist/NOTES.md NOTES.md
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "mdgrid $GITHUB_REF_NAME" --notes-file NOTES.md

  homebrew:
    # Writes Formula/mdgrid.rb to the tap (S6U5/homebrew-tap) so `brew install s6u5/tap/mdgrid` gets this release.
    # Needs the secret HOMEBREW_TAP_TOKEN: a fine-grained token with Contents read/write on the tap only.
    # Without the secret, or on a pre-release tag (v1.2.3-rc1), the job does nothing.
    needs: [release]
    runs-on: ubuntu-latest
    steps:
      - name: Decide whether to publish
        id: check
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "::notice::HOMEBREW_TAP_TOKEN is not set; the tap is left as it is."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          elif ! printf '%s' "$GITHUB_REF_NAME" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::notice::$GITHUB_REF_NAME is a pre-release; the tap is left as it is."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        if: steps.check.outputs.skip == 'false'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: steps.check.outputs.skip == 'false'
        with:
          path: dist
          merge-multiple: true
      - name: Write the formula to the tap
        if: steps.check.outputs.skip == 'false'
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          set -euo pipefail
          git clone --depth 1 "https://x-access-token:${TAP_TOKEN}@github.com/S6U5/homebrew-tap.git" tap
          mkdir -p tap/Formula
          python3 scripts/homebrew_formula.py "$GITHUB_REF_NAME" dist > tap/Formula/mdgrid.rb
          cd tap
          git add Formula/mdgrid.rb
          if git diff --cached --quiet; then
            echo "The formula is already at $GITHUB_REF_NAME."
            exit 0
          fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "mdgrid ${GITHUB_REF_NAME#v}"
          git push origin HEAD

  crates:
    # crates.io Trusted Publishing: no long-lived token; the auth action gets one that lives only for this job.
    needs: [release]
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Skip if this version is already on crates.io
        id: check
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          code=$(curl -s -o /dev/null -w '%{http_code}' -A "mdgrid-release (github.com/S6U5/mdgrid)" \
            "https://crates.io/api/v1/crates/mdgrid/$version")
          if [ "$code" = 200 ]; then echo "skip=true" >> "$GITHUB_OUTPUT"; else echo "skip=false" >> "$GITHUB_OUTPUT"; fi
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        if: steps.check.outputs.skip == 'false'
        with:
          toolchain: stable
      - uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
        if: steps.check.outputs.skip == 'false'
        id: auth
      - run: cargo publish --locked
        if: steps.check.outputs.skip == 'false'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

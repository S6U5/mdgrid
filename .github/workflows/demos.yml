name: Demos

# Record the feature tours in demos/*.tape as GIFs with VHS. The release workflow calls this and attaches
# the GIFs to the release. It does not run on pull requests: a run takes about 45 minutes, tapes rarely
# change, and a broken tape shows up when the release records them. The GIFs are never committed.
on:
  workflow_call:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  VHS_VERSION: "0.12.1"
  VHS_SHA256: "eb33787a5b1cebf91fe0b18bd231e2d71d36c1ff4babd99ddac1a6ab411efd10"

jobs:
  record:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
      - name: Install VHS, ttyd, ffmpeg and the font
        run: |
          set -euo pipefail
          sudo apt-get update -q
          sudo apt-get install -y -q ttyd ffmpeg fonts-morisawa-bizud-gothic
          name="vhs_${VHS_VERSION}_Linux_x86_64"
          curl -fsSL -o vhs.tar.gz "https://github.com/charmbracelet/vhs/releases/download/v${VHS_VERSION}/${name}.tar.gz"
          echo "${VHS_SHA256}  vhs.tar.gz" | sha256sum -c -
          tar xzf vhs.tar.gz
          sudo install "${name}/vhs" /usr/local/bin/vhs
          vhs --version
      - name: Record
        run: sh demos/record.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: demos
          path: demos/out/*.gif
          if-no-files-found: error

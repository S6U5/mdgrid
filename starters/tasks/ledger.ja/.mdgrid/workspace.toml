# mdgrid のワークスペースの印(WS-7)。組み込みのスターター「タスク」から作った台帳。
# Tasks/ の下に1件1ノート。表「タスク」はこの印に書き([table.base]、WS-9)、このフォルダを開くと開く(open)。
# これは自分の写しなので、列の名前・ビュー・値の候補は好きに直してよい。
open = "タスク"

# 状態のまとまりの間に空きの行を1つ。ノートの欄はファイルの名前だけ。
[display]
group_gap = true
note_path = "name"

# 列の型。日付は日付として並び、直すときにカレンダーが開き、形の合わない値に印が付く。
[types]
due = "date"
created = "date"
done_at = "date"
tags = "list"

# 値の候補(CE-36)。セルを直すときに並び、ほかの値には印が付く。
[rules.status]
values = ["todo", "doing", "waiting", "done"]

[rules.priority]
values = ["p1", "p2", "p3"]

# 新しいノート(n): 期限と優先度を聞き、残りを埋め、本文を雛形から始める。
[new_note]
folder = "Tasks"
ask = ["due", "priority"]
hidden = ["created"]
body = ".mdgrid/templates/task.md"

[new_note.set]
status = "todo"
created = "{date}"

[[table]]
name = "タスク"

[table.base]
filters = { and = ['file.inFolder("Tasks")'] }

[table.base.properties]
"note.status" = { displayName = "状態" }
"note.due" = { displayName = "期限" }
"note.priority" = { displayName = "優先度" }
"note.tags" = { displayName = "タグ" }
"note.created" = { displayName = "作成" }
"note.done_at" = { displayName = "完了日" }

# 状態ごとのタブ([ と ] で切り替える)。
[[table.base.views]]
type = "table"
name = "未完了"
where = { status = ["todo", "doing", "waiting"] }
order = ["status", "due", "priority", "tags"]
groupBy = { property = "status", direction = "ASC" }
sort = [{ property = "priority", direction = "ASC" }, { property = "due", direction = "ASC" }]

[[table.base.views]]
type = "table"
name = "進行中"
where = { status = ["doing"] }
order = ["due", "priority", "tags"]
sort = [{ property = "due", direction = "ASC" }]

[[table.base.views]]
type = "table"
name = "待ち"
where = { status = ["waiting"] }
order = ["due", "priority", "tags"]
sort = [{ property = "due", direction = "ASC" }]

[[table.base.views]]
type = "table"
name = "完了"
where = { status = ["done"] }
order = ["done_at", "priority", "tags"]
sort = [{ property = "done_at", direction = "DESC" }]

# mdgrid のワークスペースの印(WS-7)。組み込みのスターター「タスク」から作った台帳。
# Tasks/ の下に1件1ノート。表「タスク」はこの印に書き([table.base]、WS-9)、このフォルダを開くと開く(open)。
# これは自分の写しなので、列の名前・ビュー・値の候補は好きに直してよい。
open = "タスク"

# 状態のまとまりの間に空きの行を1つ。ノートの欄はファイルの名前だけで、新しいノートの頭に付く日付(20261118_)は出さない。
[display]
group_gap = true
note_path = "name"
note_name = '^\d{8}_'

# 列の型。日付は日付として並び、直すときにカレンダーが開き、形の合わない値に印が付く。
[types]
start = "date"
due = "date"
created = "date"
done_at = "date"
tags = "list"

# 値の候補(CE-36)。セルを直すときに並び、ほかの値には印が付く。
[rules.status]
values = ["todo", "doing", "waiting", "done"]

# 状態を done にすると、完了日に今日が入る。
[rules.status.then]
done = { done_at = "{date}" }

[rules.priority]
values = ["p1", "p2", "p3"]

# 新しいノート(a): 名前は今日の日付(20261118_)で始め、期限と優先度を聞き、残りを埋め、本文を雛形から始める。
[new_note]
folder = "Tasks"
name = "{date:YYYYMMDD}_"
ask = ["due", "priority"]
hidden = ["created"]
body = ".mdgrid/templates/task.md"

[new_note.set]
status = "todo"
created = "{date}"

[[table]]
name = "タスク"
# ガントの画面(C。GA-1): 開始から期限までの棒。親子の行(ビューの設定)はその字下げのまま。
gantt = { start = "start", end = "due" }
# カンバンの画面(B。KB-1): 状態ごとのレーンに札を [rules.status] の順で並べる。H と L で札を動かすと状態を書き換える。
kanban = { column = "status" }
# グラフの画面(P。CH-1): 状態ごとの数、月ごとの期限、優先度と状態の組。[ と ] で移り、画面の Tab・x・y・b で種類と列を変える。
chart = [
  { name = "状態ごと", x = "status" },
  { name = "月ごとの期限", kind = "line", x = "due", unit = "month" },
  { name = "優先度と状態", kind = "heatmap", x = "priority", by = "status" },
]

[table.base]
filters = { and = ['file.inFolder("Tasks")'] }

[table.base.properties]
"note.status" = { displayName = "状態" }
"note.start" = { displayName = "開始" }
"note.due" = { displayName = "期限" }
"note.priority" = { displayName = "優先度" }
"note.tags" = { displayName = "タグ" }
"note.created" = { displayName = "作成" }
"note.done_at" = { displayName = "完了日" }

# 状態ごとのタブ([ と ] で切り替える)。
[[table.base.views]]
type = "table"
name = "未完了"
where = { status = ["todo", "doing", "waiting"] }
order = ["status", "due", "priority", "tags"]
groupBy = { property = "status", direction = "ASC" }
sort = [{ property = "priority", direction = "ASC" }, { property = "due", direction = "ASC" }]

[[table.base.views]]
type = "table"
name = "進行中"
where = { status = ["doing"] }
order = ["due", "priority", "tags"]
sort = [{ property = "due", direction = "ASC" }]

[[table.base.views]]
type = "table"
name = "待ち"
where = { status = ["waiting"] }
order = ["due", "priority", "tags"]
sort = [{ property = "due", direction = "ASC" }]

[[table.base.views]]
type = "table"
name = "完了"
where = { status = ["done"] }
order = ["done_at", "priority", "tags"]
sort = [{ property = "done_at", direction = "DESC" }]

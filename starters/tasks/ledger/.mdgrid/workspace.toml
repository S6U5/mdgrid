# The mdgrid workspace marker (WS-7) of a task ledger, made from the built-in starter "tasks".
# One note per task under Tasks/. The table "Tasks" below is written here ([table.base], WS-9) and opens
# when you open this folder (open). This is your copy: rename columns, add views, change the values.
open = "Tasks"

# A blank row between the status groups. The note column shows only the file name, without the date that new notes get in front (20261118_).
[display]
group_gap = true
note_path = "name"
note_name = '^\d{8}_'

# Column types: dates sort as dates, open a calendar when edited, and mark values of the wrong shape.
[types]
start = "date"
due = "date"
created = "date"
done_at = "date"
tags = "list"

# Allowed values (CE-36): offered when you edit the cell; other values are marked.
[rules.status]
values = ["todo", "doing", "waiting", "done"]

# Setting the status to done fills in the done date with today. Setting it to doing fills in the start date with today,
# only when it is empty (a start date you planned stays).
[rules.status.then]
done = { done_at = "{date}" }
doing = { start = { value = "{date}", if_empty = true } }

[rules.priority]
values = ["p1", "p2", "p3"]

# New note (a): the name starts with today's date (20261118_); it asks for the start date, the due date, the priority and a URL, fills in the rest, and starts the body from the template.
# name_head = "hide": that date is kept out of the name field and added before the name you type ("show" puts it in the field).
[new_note]
folder = "Tasks"
name = "{date:YYYYMMDD}_"
name_head = "hide"
ask = ["start", "due", "priority", "url"]
hidden = ["created"]
body = ".mdgrid/templates/task.md"

[new_note.set]
status = "todo"
created = "{date}"

[[table]]
name = "Tasks"
# The gantt screen (C, GA-1): bars from the start date to the due date. Parent/child rows (view settings) keep their indent.
gantt = { start = "start", end = "due" }
# The kanban screen (B, KB-1): one lane per status, in the order of [rules.status]. Each card shows its due date and priority
# under the name (card). H and L move a card and rewrite its status.
kanban = { column = "status", card = ["due", "priority"] }
# The chart screen (P, CH-1): tasks per status, due dates by month, and status per priority. [ and ] switch them;
# Tab, x, y and b change the kind and the columns on the screen.
chart = [
  { name = "By status", x = "status" },
  { name = "Due by month", kind = "line", x = "due", unit = "month" },
  { name = "Priority and status", kind = "heatmap", x = "priority", by = "status" },
]

[table.base]
filters = { and = ['file.inFolder("Tasks")'] }

# Time left: how far the due date is from today ("in 3 days", "5 days ago"), worked out each time and never written to the note.
[table.base.formulas]
left = 'due.relative()'

[table.base.properties]
"formula.left" = { displayName = "Time left" }
"note.status" = { displayName = "Status" }
"note.start" = { displayName = "Start" }
"note.due" = { displayName = "Due" }
"note.priority" = { displayName = "Priority" }
"note.tags" = { displayName = "Tags" }
"note.url" = { displayName = "URL" }
"note.created" = { displayName = "Created" }
"note.done_at" = { displayName = "Done" }

# Tabs ([ and ] switch them): one per status, plus Overdue for unfinished tasks past their due date. Open also shows notes that have no status yet.
[[table.base.views]]
type = "table"
name = "Open"
filters = 'status != "done"'
order = ["status", "start", "due", "formula.left", "priority", "tags", "url"]
groupBy = { property = "status", direction = "ASC" }
sort = [{ property = "priority", direction = "ASC" }, { property = "due", direction = "ASC" }]

[[table.base.views]]
type = "table"
name = "Overdue"
filters = { and = ['status != "done"', 'due < today()'] }
order = ["status", "start", "due", "formula.left", "priority", "tags"]
sort = [{ property = "due", direction = "ASC" }]

[[table.base.views]]
type = "table"
name = "Doing"
where = { status = ["doing"] }
order = ["start", "due", "priority", "tags", "url"]
sort = [{ property = "due", direction = "ASC" }]

[[table.base.views]]
type = "table"
name = "Waiting"
where = { status = ["waiting"] }
order = ["start", "due", "priority", "tags", "url"]
sort = [{ property = "due", direction = "ASC" }]

[[table.base.views]]
type = "table"
name = "Done"
where = { status = ["done"] }
order = ["done_at", "priority", "tags", "url"]
sort = [{ property = "done_at", direction = "DESC" }]

# Sample config for the theme dozy-pink (SR-26, SR-27). Run: mdgrid --config examples/themes/dozy-pink.toml examples/vault
# In your own config ($XDG_CONFIG_HOME/mdgrid/config.toml), these two lines are enough.
[look]
theme = "dozy-pink"

# The shaded rows are painted in the theme's colors too.
[display]
zebra = true

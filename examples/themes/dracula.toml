# Sample config for the theme dracula (SR-26, SR-27). Run: mdgrid --config examples/themes/dracula.toml examples/vault
# In your own config ($XDG_CONFIG_HOME/mdgrid/config.toml), these two lines are enough.
[look]
theme = "dracula"

# The shaded rows are painted in the theme's colors too.
[display]
zebra = true

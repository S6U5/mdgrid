# Sample config for the theme gruvbox (SR-26, SR-27). Run: mdgrid --config examples/themes/gruvbox.toml examples/vault
# In your own config ($XDG_CONFIG_HOME/mdgrid/config.toml), this one line is enough.
theme = "gruvbox"

# The shaded rows are painted in the theme's colors too.
[display]
zebra = true

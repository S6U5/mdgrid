# Sample config for the theme solarized-light (SR-26, SR-27). Run: mdgrid --config examples/themes/solarized-light.toml examples/vault
# In your own config ($XDG_CONFIG_HOME/mdgrid/config.toml), this one line is enough.
theme = "solarized-light"

# The shaded rows are painted in the theme's colors too.
[display]
zebra = true

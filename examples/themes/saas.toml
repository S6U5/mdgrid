# Sample config for the theme saas (SR-26, SR-37). Run: mdgrid --config examples/themes/saas.toml examples/vault
# In your own config ($XDG_CONFIG_HOME/mdgrid/config.toml), these two lines are enough.
[look]
theme = "saas"

# The shaded rows are painted in the theme's colors too.
[display]
zebra = true

# Sample config for the theme paper (SR-26, SR-37). Run: mdgrid --config examples/themes/paper.toml examples/vault
# In your own config ($XDG_CONFIG_HOME/mdgrid/config.toml), these two lines are enough.
[look]
theme = "paper"

# The shaded rows are painted in the theme's colors too.
[display]
zebra = true

# The config for the human and AI tasks sample (examples/ai-human).
# mdgrid --config examples/ai-human/config.toml examples/ai-human/Tasks.base

# A new task (a, or "+ New") asks the two columns that decide who does it.
# Leave actor empty and it is not written: the task counts as an agent task.
[new_note]
ask = ["actor", "human_gate", "due"]

[new_note.set]
status = "todo"
priority = "p3"

# Lines between columns and zebra rows, and one empty line above each group heading.
[display]
column_lines = true
zebra = true
group_gap = true

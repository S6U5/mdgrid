# A config with many features turned on, made for the studio sample (examples/studio).
# Try it from the repository root:
#   mdgrid --config examples/configs/studio.toml examples/studio/Tasks.base --readonly
# Your own config lives at $XDG_CONFIG_HOME/mdgrid/config.toml.

# The editor that opens a note (arguments are fine). Unset or empty: $VISUAL, $EDITOR, then vi.
# editor = "nvim"

# How dates are shown and typed in the table. Notes keep YYYY-MM-DD.
[dates]
format = "YYYY/MM/DD (ddd)"

# The first day of the week in the calendar ("sun" or "mon").
week_start = "mon"

[edit]
# The most candidates a text cell offers on Enter.
candidates = 30

# Show the search field above the table (\ moves into it), lines between columns and zebra rows.
[display]
search_bar = true
column_lines = true
zebra = true
group_gap = true

# A new task (a, or "+ New") asks for the project, the owner and the due date, and starts as todo.
[new_note]
ask = ["project", "owner", "due", "priority"]
required = ["due"]
hidden = ["created"]

[new_note.set]
status = "todo"
priority = 2
billable = true
created = "{now}"

# Rules: a task needs a status, and only these three. Other values get a ! mark,
# and `mdgrid --check` lists them.
[rules.status]
required = true
values = ["todo", "doing", "done"]

# Colors per value, used in every theme.
[look.colors.values]
todo = "gray"
doing = "blue"
done = "green"

# Rebind keys: [keys.<mode>] with key = action. "none" removes a key.
[keys.table]
"ctrl+f" = "search"

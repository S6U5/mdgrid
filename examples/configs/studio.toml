# A config with many features turned on, made for the studio sample (examples/studio).
# Try it from the repository root:
#   mdgrid --config examples/configs/studio.toml examples/studio/Tasks.base --readonly
# Your own config lives at $XDG_CONFIG_HOME/mdgrid/config.toml.

# The editor that opens a note (arguments are fine). Unset or empty: $VISUAL, $EDITOR, then vi.
# editor = "nvim"

# How dates are shown and typed in the table. Notes keep YYYY-MM-DD.
[dates]
format = "YYYY/MM/DD (ddd)"

# The first day of the week in the calendar ("sun" or "mon").
week_start = "mon"

[edit]
# The most candidates a text cell offers on Enter.
candidates = 30

# Show the search field above the table (\ moves into it), lines between columns and zebra rows.
[display]
search_bar = true
column_lines = true
zebra = true
group_gap = true

# A new task (a, or "+ New") asks for the project, the owner and the due date, and starts as todo.
[new_note]
ask = ["project", "owner", "due", "priority"]
required = ["due"]
hidden = ["created"]

[new_note.set]
status = "todo"
priority = 2
billable = true
created = "{now}"

# Rules: a task needs a status, and only these three. Other values get a ! mark,
# and `mdgrid --check` lists them.
[rules.status]
required = true
values = ["todo", "doing", "done"]

# Named conditions: write a condition once and use it by name. The digit key
# shows only the matching rows (press it again for all rows); cond("late") works
# in any expression, such as `mdgrid --count --filter 'cond("late")'`.
[conditions.week]
expr = 'due <= today() + "7d" && status != "done"'
label = "Due this week"
key = 1

[conditions.late]
expr = 'due < today() && status != "done"'
label = "Late"
key = 2

# The notice box above the header: how many tasks are late, in this table.
# `mdgrid --notices` prints the same line for a status bar.
[[notices]]
cond = "late"
text = "{count} late"

# Add "Search across the workspace" to the palette (:): a word is looked up in
# every table of the studio workspace, and the matching rows are listed per table.
[search]
across = true

# Colors per value, used in every theme.
[look.colors.values]
todo = "gray"
doing = "blue"
done = "green"

# Rebind keys: [keys.<mode>] with key = action. "none" removes a key.
[keys.table]
"ctrl+f" = "search"

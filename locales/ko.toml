CfgUse = "이 위치에 적은 값 아래에 템플릿 [templates.<이름>]을 깔아 둠."
## 設定の項目 `types` の説明(行の区切りは --print-config のコメントの行)。
CfgTypes = "열 하나하나의 형식. 루트 폴더의 형식 설정(.obsidian/types.json)과\n값으로 하는 추정보다 우선함. \"auto\"는 추정으로 되돌림(좁은 범위에서 넓은 범위의 형식을\n취소할 수 있음). 형식은 셀 입력, 맞지 않는 값의 ! 표시, 정렬, 열 머리글의 형식 표시에\n쓰임. 노트는 바꾸지 않음. 머리글의 형식 표시를 클릭하거나, 팔레트나 동작 메뉴의\ncolumn_type으로 형식을 고르면 views.toml의\n표에 적음."
## 設定の項目 `rules` の説明(行の区切りは --print-config のコメントの行)。
CfgRules = "열 하나하나의 규칙. 열 형식과 함께 검사함. required = true는 키가 없거나 null,\n빈 문자열, 빈 목록이면 문제로 봄. values는 허용하는 값의 목록\n(목록 값은 각 항목이 이 중 하나여야 하며, 대소문자를 구별함). 좁은 범위가 항목마다 우선함.\n문제에는 ! 표시가 붙고, 아래 표시줄에 개수가 나오며, !와 @로 문제 사이를 이동하고,\nmdgrid --check로 목록을 볼 수 있음. 규칙 검사는 노트를 바꾸거나 값 쓰기를 막지 않음.\nvalues가 있는 열은 셀 입력에서 그 값을 후보로 보여 줌. then은 그 열을 어떤 값으로 바꿀 때\n같은 행의 다른 열도 채움(값 = { 열 = 텍스트 }. {date} 같은 템플릿 변수를\n쓸 수 있고, 빈 텍스트는 그 열을 비움). 편집과 함께 보류되고 함께 실행 취소됨.\n계산 열(file.*, formula.*)에는 규칙을 둘 수 없음.\nvalues가 있는 열로 묶으면 묶음은 그 순서(내림차순이면 반대)로 놓임.\nicons와 labels(값 = 문자)는 묶음 제목과 칸반 레인 제목에 값의 기호와 이름을 보여 줌\n(셀·필터·검색·--print는 값 그대로)."
## 設定の項目 `format` の説明(行の区切りは --print-config のコメントの行)。
CfgFormat = "열 하나하나의 숫자 표시 방식. thousands = true는 정수 부분을 세 자리마다 구분함.\ndecimals는 소수 자릿수(0~10. 모자라면 0으로 채우고, 넘치는 자리는 반올림). prefix와\nsuffix는 숫자 앞뒤에 붙이는 글자(음수는 -를 prefix 앞에 둠). 구분 기호는 화면 언어의\n관례를 따름. 셀, 자세히 보기, 집계 행, 묶음 제목의 소계, 차트 값에 쓰이며, 개수를 세는\n집계와 개수 차트에는 쓰이지 않음. 표시만 바꿈: 노트, 정렬, 필터, 수식, 셀 입력,\n--print는 원래 숫자 그대로. 계산 열(formula.*)에도 쓸 수 있음. 좁은 범위가 항목마다 우선함."
## 設定の項目 `terminal.color` の説明(行の区切りは --print-config のコメントの行)。
CfgTerminalColor = "색을 씀. false면 색 없이 그림(NO_COLOR나 --no-color와 같음)."
## 設定の項目 `terminal.ambiguous_wide` の説明(行の区切りは --print-config のコメントの行)。
CfgTerminalAmbiguousWide = "East Asian Ambiguous 문자(○, ※ 등)를 너비 2로 취급함.\n터미널이 이 문자를 넓게 그리면 true로 설정. 이때 창 테두리는 항상 ASCII."
## 設定の項目 `terminal.nerd_font` の説明(行の区切りは --print-config のコメントの行)。
CfgTerminalNerdFont = "둥근 칩 끝(Nerd Font 글리프)을 그려도 되는지. true: 터미널 글꼴이 Nerd\nFont임. \"auto\": 이 글리프를 직접 그리는 터미널(Ghostty, WezTerm)에서만 그려서\n다른 곳에서 깨지지 않게 함. 둥근 끝이 없으면 \"pill\"은 \"soft\"로 그림."
## 設定の項目 `terminal.nerd_icons` の説明(行の区切りは --print-config のコメントの行)。
CfgTerminalNerdIcons = "설정 버튼, 화면 유형 버튼과 메뉴, 열 머리글과 관계도 상자의 형식 표시, 캘린더 제목에\nNerd Font의 아이콘 글리프를 씀. 터미널 글꼴이 Nerd Font일 때만 true로 설정.\n기본값은 일반 문자(⚙, ▦, ◇, #, ◷, ⋮, ◉, ✓, ↪). 이모지는 쓰지 않음."

## 設定の項目 `look.colors` の説明(行の区切りは --print-config のコメントの行)。
CfgLookColors = "테마의 색을 역할별로 덮어씀: background, text, header, selection, selection_text,\nband, band_text, accent, strong, zebra, zebra_text, mark, added, removed, pending,\nhighlight. [look.colors.values]는 값마다 색을 정하며(대소문자 무시), 모든 부품\n모양에 쓰임. 색은 \"#rrggbb\", \"#rgb\" 또는 이름(black, white, gray, red, orange,\nyellow, green, teal, cyan, blue, purple, magenta, pink, brown). theme = \"default\"에서는\naccent, selection, 값의 색만 씀. 좁은 위치에 적은 테마는\n넓은 위치에 적은 역할 색을 버림."

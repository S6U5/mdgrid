## 設定の項目 `look.style` の説明(行の区切りは --print-config のコメントの行)。
CfgLookStyle = "프리셋의 부품 모양을 하나씩 덮어씀: status(\"dot\", \"shape\", \"text\", \"pill\", \"tint\",\n\"solid\", \"soft\", \"chip\", \"plain\"), tags(\"dots\", \"hash\", \"brackets\", \"pill\", \"tint\",\n\"solid\", \"soft\", \"chip\", \"plain\"), check(\"box\", \"tick\", \"bracket\", \"text\"), select\n(\"bar\", \"cross\", \"tint\", \"outline\", \"fill\", \"reverse\"), rules(\"none\", \"header\",\n\"columns\", \"grid\"), tabs(\"underline\", \"pill\", \"segment\", \"brackets\", \"dim\"), frames\n(\"rounded\", \"square\", \"heavy\", \"ascii\", \"none\"), band(\"keys\", \"boxed\", \"quiet\"), links\n(\"accent\", \"plain\"), icons(true 또는 false). \"plain\"(check는 \"text\")은 그 부품을\n텍스트로 둠. docs/catalog/index.html에서 모든 선택지를 보고 이 테이블을 만들 수 있음."

## 設定の項目 `display.row_extra_lines` の説明(行の区切りは --print-config のコメントの行)。
CfgDisplayRowExtraLines = "표의 행이 더 늘어날 수 있는 줄 수: 긴 값이나 줄바꿈이 있는 값이 든 행은\n열 너비에서 줄을 바꾸고 최대 1 + 이 값만큼의 줄까지 늘어남(각 행은 필요한 만큼만\n높아짐). 다 들어가지 않으면 …로 끝남. 0이면 모든 행을 한 줄로 두고\n줄바꿈은 …⏎로 표시. 다른 값은 경고하고 기본값을 씀."

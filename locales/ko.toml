CfgGitWhen = "git.auto를 실행할 때: \"save\"는 저장할 때마다(저장 한 번에 커밋 하나), \"quit\"은 mdgrid를\n끝낼 때 한 번(실행 한 번에 커밋 하나). 종료할 때 남은 노트는 어느 쪽이든 그때 처리함."

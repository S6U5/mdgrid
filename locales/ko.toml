# mdgrid の画面と起動の文言の台帳: 英語(SR-23)。文言の名前と並びの正本。
# 1行に1つ `名前 = "文"`(TOML の基本の文字列)。`##` の行は次の文言の説明(コードの文書になる)、`#` の行は区切り。
# 差し込みは `{0}`・`{1}` の番号。ほかの言語の台帳は同じ名前を全部持ち、同じ番号を使う(欠け・余り・空・番号の
# 食い違いはビルドで落ちる。build.rs・src/ledger.rs)。


# ---- main: 使い方(CLI-2) ----
Usage = "사용법: mdgrid [<.base | 폴더 | .md | .csv> ...] [--view <이름>] [-w <이름>] [--page <이름>] [--table <이름>] [--raw] [--readonly] [--no-color] [--config <경로>]\n        mdgrid [<.base | 폴더 | .md> ...] --print [--format csv|tsv|json|md] [--with-path] [--view <이름>]\n                 [--filter <식>]... [--sort <열>[:desc]]...\n        mdgrid [<.base | 폴더 | .md> ...] --pick path|<열> [--view <이름>]\n        mdgrid [<.base | 폴더 | .md> ...] --check [--view <이름>]\n        mdgrid [<.base | 폴더 | .md> ...] --count [--view <이름>] [--filter <식>]...\n        mdgrid [<.base | 폴더> ...] --notices\n        mdgrid [<.base | 폴더> ...] --notify\n        mdgrid [<.base | 폴더> ...] --runs\n        mdgrid [<.base | 폴더> ...] --apply <경로> [--yes]\n        mdgrid [<폴더 | .base> ...] --add-to <이름> [--as <표 이름>] | --remove-from <이름>\n        mdgrid [<폴더> ...] --init-workspace [--starter <이름> [--with-samples]]\n        mdgrid [<폴더>] --new-note <이름> [--set <열>=<값>]...\n        mdgrid --continue [--readonly] [--no-color] [--config <경로>]\n        mdgrid -s <이름> [--readonly] [--no-color] [--config <경로>]\n        mdgrid --sessions\n        mdgrid --recent\n        mdgrid --starters\n        mdgrid --workspaces | --remove-workspace <이름>\n        mdgrid --print-config\n        mdgrid --completions <셸>\n        mdgrid --man\n\n  폴더 안의 Markdown 노트를 표로 연다. 노트 하나가 한 행, 프런트매터의 키 하나가\n  한 열이 된다. .base를 주면 그 table 뷰로 연다(노트는 루트 폴더 아래에서 찾는다).\n  .md 파일을 주면 그 폴더를 열고 그 노트를 선택한다.\n  .csv나 .tsv 파일을 주면 표로 연다. 한 줄이 한 행이고,\n  첫 줄이 열 이름이 된다.\n  인수가 없으면 현재 폴더를 연다(places.toml에 등록한 표가 있으면 그 목록을 위에\n  띄운다). 마커 .mdgrid/workspace.toml의 \"open\"에 표를 적은 폴더는\n  대신 그 표를 연다.\n\n  --view <이름>           .base의 그 뷰로 연다(생략하면 첫 뷰.\n                          --print는 mdgrid 뷰도 찾는다)\n  -w, --workspace <이름>  링크와 관계도의 범위로 그 워크스페이스(workspaces.toml)를 쓴다.\n                          경로가 없으면 그 첫 표를 연다\n  --page <이름>           워크스페이스의 그 페이지([[page]])를, 표를 세로로 쌓아 연다\n  --table <이름>          마커 .mdgrid/workspace.toml(-w가 있으면 그 워크스페이스)의 그 이름의 표를 open의 표\n                          대신 연다(--print·--check·--new-note 등도 그 표로 동작)\n  --raw                   마커의 \"open\"에 적힌 표가 아니라 폴더 자체를 연다\n  --readonly              읽기 전용으로 연다(편집도 저장도 하지 않는다)\n  --no-color              색 없이 그린다\n  --config <경로>         이 설정 파일을 읽는다\n                          (기본값: $XDG_CONFIG_HOME/mdgrid/config.toml)\n  --continue              이 폴더에서 마지막으로 보던 표와 뷰로 연다(없으면 인수 없이\n                          연 것과 같다. tmux 등에서 창을 되살릴 때 쓴다)\n  -s, --session <이름>    그 이름으로 저장한 세션(표, 뷰, 필터, 정렬, 열)으로 연다\n                          (팔레트의 \"세션 저장\"으로 저장한다)\n  --sessions              저장한 세션(sessions.toml)의 이름과 폴더를 한 줄에 하나씩 출력한다\n  --recent                화면에서 최근에 연 표를 최신순으로, 한 줄에 하나씩\n                          \"경로<TAB>뷰 이름<TAB>마지막으로 연 때\" 형식으로 출력한다(최대 20개)\n  --print                 화면 없이 뷰의 표를 표준 출력에 출력한다\n                          (노트는 바꾸지 않는다)\n  --format <형식>         --print의 형식(csv, tsv, json, md. 기본값 csv)\n  --with-path             --print의 첫 열에 각 행의 노트 경로 \"path\"를 더한다\n                          (--pick path와 같은 경로)\n  --filter <식>           .base 식이 참인 행만 남긴다\n                          (반복 가능. .base 뷰에서는 뷰의 필터와 함께 적용)\n  --sort <열>[:desc]      --print를 이 열로 정렬한다(반복 가능. 뷰의 정렬을\n                          대신한다)\n  --count                 화면 없이 뷰의 행 수(--filter 적용 후)를 출력한다\n  --show-hidden           --print, --pick, --count에서 hide = true인 조건([conditions])이\n                          숨긴 행도 남긴다\n  --notices               화면 없이 알림 칸([[notices]])의 항목을 한 줄에 하나씩 출력한다\n                          (tmux 상태 줄이나 셸 프롬프트용)\n  --notify                화면 없이 [[notify]] 항목을 한 번 확인하고, 새로 맞게 된 행을 알린다\n                          (정기 실행용. 보내지 못하면 종료 코드 1)\n  --runs                  화면 없이 온 루틴 회차(표식의 [[table]] runs)의 노트를 만들고, 만든 경로를 한 줄씩 출력한다\n                          (OS의 예약 실행에서 부른다. 만들지 못한 회차가 있으면 종료 코드 1)\n  --pick <path|열>        터미널에 화면을 읽기 전용으로 띄운다. Enter를 누르면\n                          표시한 행(없으면 선택한 행)의 경로나 열 값을\n                          한 줄에 하나씩 표준 출력에 내고 끝난다\n                          (q나 Esc로 취소하면 종료 코드 1)\n  --check                 열 형식이나 규칙([rules])에 맞지 않는 값을\n                          한 줄에 하나씩 출력한다(경로:줄: 열: 이유. 하나라도 있으면\n                          종료 코드 1)\n  --apply <경로>          --print --with-path 형식의 CSV나 JSON(-는 표준 입력)을 읽어\n                          값이 다른 셀을 바꾼다. 차이만 보여 준다\n  --yes                   --apply에서 변경을 실제로 쓴다\n  --workspaces            워크스페이스(workspaces.toml) 목록을 출력한다\n  --add-to <이름>         지정한 표(기본값: 이 폴더)를 그 워크스페이스에 더한다.\n                          없으면 만든다. --as <이름>으로 표 이름을 정한다\n  --remove-from <이름>    지정한 표(기본값: 이 폴더)를 그 워크스페이스에서 뺀다\n  --remove-workspace <이름>  그 워크스페이스를 지운다(노트는 건드리지 않는다)\n  --init-workspace        폴더에 워크스페이스 마커 .mdgrid/workspace.toml을 둔다\n                          (기본값: 이 폴더)\n  --starter <이름>        --init-workspace에서 그 스타터로 대장(마커, 노트 템플릿)을\n                          만든다. 내장 스타터나 설정 폴더의 starters/<이름>\n  --with-samples          --starter에서 스타터의 견본 노트도 더한다\n  --starters              스타터 목록(이름과 한 줄 설명)을 한 줄에 하나씩 출력한다\n  --new-note <이름>       화면 없이 폴더(기본값: 이 폴더)에 새 노트 <이름>.md를 만든다.\n                          [new_note](folder, set, template)를 쓰고, 만든 경로를 출력한다.\n                          덮어쓰지 않는다\n  --set <열>=<값>         --new-note에서 그 열에 값을 넣는다(반복 가능. 목록 항목은\n                          쉼표로 구분. 빈 값은 아무것도 쓰지 않는다)\n  --print-config          모든 설정 항목을 기본값과 설명을 붙인 TOML로 출력한다\n                          (docs/config.md)\n  --completions <셸>      셸 자동 완성을 출력한다(bash, zsh, fish, elvish, powershell)\n  --man                   man 페이지(roff)를 출력한다\n  --help                  이 도움말을 출력한다\n  --version               버전을 출력한다"


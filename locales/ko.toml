## 設定の項目 `display.tab_wrap_gap` の説明(行の区切りは --print-config のコメントの行)。
CfgDisplayTabWrapGap = "tab_wrap일 때 검색 창 줄과 그 아래 탭 줄 사이에 빈 줄 하나를 둠."
## 設定の項目 `display.note_name` の説明(行の区切りは --print-config のコメントの行)。
CfgDisplayNoteName = "노트 열의 이름에 적용하는 정규 표현식(note_path 다음에 적용. 폴더가 있으면 마지막\n부분에만). 일치하면 이름이 name인 그룹, 없으면 첫 번째 그룹, 그것도 없으면 일치한 부분을\n뺀 이름을 보여 줌. 일치하지 않거나 비게 되는 이름은 그대로 보여 줌. \"\"는\n아무것도 설정하지 않음. 읽을 수 없는 식은 경고하고 쓰지 않음."
## 設定の項目 `dates.format` の説明(行の区切りは --print-config のコメントの行)。
CfgDatesFormat = "표에서 날짜를 보여 주고 입력하는 형식. 부분: YYYY, YY, MM, M, DD, D, ddd\n(요일)와 영숫자가 아닌 구분 문자. 노트에는 항상 YYYY-MM-DD로 씀."
## 設定の項目 `dates.week_start` の説明(行の区切りは --print-config のコメントの行)。
CfgDatesWeekStart = "한 주의 첫날. 날짜 캘린더, 날짜 말(이번 주·다음 주), 그래프의 주 구간, 간트의 주 칸과 이번 주가 이 요일부터 시작한다."
## 設定の項目 `edit.candidates` の説明(行の区切りは --print-config のコメントの行)。
CfgEditCandidates = "텍스트 셀을 편집할 때 보여 줄 값 후보의 최대 개수.\n서로 다른 값이 이보다 많은 열은 후보를 보여 주지 않음."
## 設定の項目 `edit.add_frontmatter` の説明(行の区切りは --print-config のコメントの行)。
CfgEditAddFrontmatter = "프런트매터가 없거나 비어 있는 노트에도 쓰기를 허용함(프런트매터나 키\n줄을 추가함). false면 그런 노트는 읽기 전용."
## 設定の項目 `new_note` の説明(行の区切りは --print-config のコメントの行)。
CfgNewNote = "표에서 새 노트를 만드는 방법: mode(\"form\": 모든 입력란이 있는 입력 창, 또는\n\"editor\": 만들고 편집기로 열기), folder(연 폴더 기준 상대 경로), name(이름\n템플릿), ask(입력 창의 열. 기본값: 보이는 열), required(반드시 채워야 하는\n열), hidden(입력란 없이 적는 열), body(본문 템플릿 파일),\n[new_note.set](열 = 값). 템플릿에는 {date}, {date+7}, {date:YYYY/MM/DD},\n{time}, {now}, {weekday}, {name}, {folder}를 쓸 수 있음. 뷰 필터의 값이 먼저 들어감.\n이 테이블은 한 항목임: 더 좁은 위치에 적으면 통째로 바뀜. name_head(\"show\": 채운 틀을 이름 칸에 넣어 보여 줌, \"hide\": 칸에 보이지 않고 입력한 이름 앞에 붙임)."
## 設定の項目 `keys` の説明(行の区切りは --print-config のコメントの行)。
CfgKeys = "모드별 키 다시 할당: [keys.<모드>] 아래에 키 = 동작 이름을 적음.\n\"none\"은 그 키를 없앰. 모드: table, edit, review, quit, help, palette, search,\nfilter, detail, settings, settings_input, chips, list_select, menu, freq, sorts, relations, drawer, filter_window, filter_input, screen_menu, column_type, tree, gantt, kanban, chart, notice, switch,\ninput_normal(vim 모드). 동작 이름은 명령 팔레트(:)에 나옴."
## 設定の項目 `keys.vim` の説明(行の区切りは --print-config のコメントの行)。
CfgKeysVim = "vim 모드: 입력 상자가 삽입 모드로 시작하고 Esc로 노멀 모드로 바뀜(h l 0 $ w b e,\ni a I A, x X dw db d$ D dd, cw c$ C cc, u). 표에는 dd(노트 삭제), p(y나 Y로\n복사한 값 넣기), .(마지막 값 반복)이 추가됨. false면 모든 키를 그대로 둠."
## 設定の項目 `search.across` の説明(行の区切りは --print-config のコメントの行)。
CfgSearchAcross = "명령 팔레트에 \"워크스페이스 전체에서 검색\"을 추가함: 현재 워크스페이스(또는 등록한 표)의\n모든 표의 모든 행에서 말을 찾아, 맞는 행을 표별로 보여 줌.\nfalse(기본값)면 팔레트는 그대로."
## 設定の項目 `templates` の説明(行の区切りは --print-config のコメントの行)。
CfgTemplates = "이름을 붙인 프로필 조각([look], [display], [dates], [edit], [new_note]). 어느 위치에서든\nuse = \"<이름>\"으로 그 위치의 값 아래에 깔 수 있음. 같은 이름이면 ui.toml의 템플릿이\nconfig.toml의 것보다 우선함."
## 設定の項目 `conditions` の説明(行の区切りは --print-config のコメントの行)。
CfgConditions = "이름 붙은 조건: 한 번 적은 식(expr)을 이름으로 씀. 어느 식에서든 cond(\"<이름>\"),\n맞는 행만 보여 주는 숫자 키(key = 1-9), 뷰 설정의 필터 구역, 모든 표에서 맞는 행을 숨기는\nhide = true에 쓸 수 있음. label은 보여 줄 이름."
## 設定の項目 `notices` の説明(行の区切りは --print-config のコメントの行)。
CfgNotices = "헤더 위의 알림 칸. 항목을 적었을 때만 보임. 건수 항목은 이름 붙은 조건([conditions])에\n맞는 행을 현재 표, 워크스페이스, 이름을 든 표에서 셈. 노트 항목은 노트 본문의\n첫 줄들을 보여 줌. mdgrid --notices는 같은 줄을 출력함."
## 設定の項目 `notify` の説明(行の区切りは --print-config のコメントの行)。
CfgNotify = "이름 붙은 조건([conditions])에 새로 맞게 된 행을 한 행씩 터미널, OS 알림, 자신의 명령으로\n알림. 항목을 적을 때 이미 맞는 행은 조용히 기억하고, 한 번의 확인에서 새로 맞은 행이\ngroup_over를 넘으면 한 건으로 묶음. 열려 있는 동안 화면이 확인하고, mdgrid --notify는\n정기 실행에서 한 번 확인함."


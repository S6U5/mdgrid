CfgTerminalHerdr = "Herdr 창 안에서는 현재 표와 뷰를 다시 여는 명령을 Herdr에 알려,\nHerdr 서버가 다시 시작된 뒤 다시 열게 함. false면 Herdr를 부르지 않음."
## 設定の項目 `workspace.detect` の説明(行の区切りは --print-config のコメントの行)。
CfgWorkspaceDetect = "여는 표가 적어 둔 워크스페이스에 없으면, 그 위로 올라가며 다음 표시 폴더 중 하나를\n가진 가장 가까운 폴더를 워크스페이스(루트 폴더)로 봄: \".obsidian\"(.obsidian/이 있는\n폴더) 또는 \".git\"(git 저장소). 그 안의 노트가 있는 폴더가 관계도의 표가 됨.\n[]는 감지를 끔. 옛 값 \"vault\"와 \"git\"도 경고와 함께\n같은 뜻으로 읽음."
## 設定の項目 `git.auto` の説明(行の区切りは --print-config のコメントの行)。
CfgGitAuto = "git 저장소 안의 노트를 쓴 뒤 git을 어디까지 진행할지: \"off\"는 아무것도 안 함,\n\"add\"는 쓴 노트를 스테이징, \"commit\"은 커밋까지(그 노트만. 다른 변경 파일이나\n스테이징된 파일은 넣지 않음), \"push\"는 push까지. git 저장소가 아닌 폴더는\n건드리지 않음. git이 실패하면 한 줄로 알리고, 저장 자체는 끝난 그대로 둠."

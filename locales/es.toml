# mdgrid の画面と起動の文言の台帳: 英語(SR-23)。文言の名前と並びの正本。
# 1行に1つ `名前 = "文"`(TOML の基本の文字列)。`##` の行は次の文言の説明(コードの文書になる)、`#` の行は区切り。
# 差し込みは `{0}`・`{1}` の番号。ほかの言語の台帳は同じ名前を全部持ち、同じ番号を使う(欠け・余り・空・番号の
# 食い違いはビルドで落ちる。build.rs・src/ledger.rs)。


# ---- main: 使い方(CLI-2) ----
Usage = "Uso: mdgrid [<.base | carpeta | .md | .csv> ...] [--view <nombre>] [-w <nombre>] [--page <nombre>] [--raw] [--readonly] [--no-color] [--config <ruta>]\n        mdgrid [<.base | carpeta | .md> ...] --print [--format csv|tsv|json|md] [--with-path]\n                 [--view <nombre>] [--filter <expresión>]... [--sort <columna>[:desc]]...\n        mdgrid [<.base | carpeta | .md> ...] --pick path|<columna> [--view <nombre>]\n        mdgrid [<.base | carpeta | .md> ...] --check [--view <nombre>]\n        mdgrid [<.base | carpeta | .md> ...] --count [--view <nombre>] [--filter <expresión>]...\n        mdgrid [<.base | carpeta> ...] --notices\n        mdgrid [<.base | carpeta> ...] --notify\n        mdgrid [<.base | carpeta> ...] --apply <ruta> [--yes]\n        mdgrid [<carpeta | .base> ...] --add-to <nombre> [--as <nombre de tabla>]\n                 | --remove-from <nombre>\n        mdgrid [<carpeta> ...] --init-workspace [--starter <nombre> [--with-samples]]\n        mdgrid [<carpeta>] --new-note <nombre> [--set <columna>=<valor>]...\n        mdgrid --continue [--readonly] [--no-color] [--config <ruta>]\n        mdgrid -s <nombre> [--readonly] [--no-color] [--config <ruta>]\n        mdgrid --sessions\n        mdgrid --recent\n        mdgrid --starters\n        mdgrid --workspaces | --remove-workspace <nombre>\n        mdgrid --print-config\n        mdgrid --completions <shell>\n        mdgrid --man\n\n  Abre una tabla con las notas Markdown de una carpeta: una fila por nota y una columna por\n  clave del front matter. Con un .base, abre su vista de tabla (las notas se buscan bajo la\n  carpeta raíz). Con un archivo .md, abre su carpeta con esa nota seleccionada.\n  Con un archivo .csv o .tsv, lo abre como tabla: una fila por línea; la primera línea\n  da los nombres de las columnas.\n  Sin argumentos, abre la carpeta actual (con la lista de tablas registradas en places.toml\n  encima, si las hay). Una carpeta con un marcador .mdgrid/workspace.toml que nombra una\n  tabla en \"open\" abre esa tabla.\n\n  --view <nombre>         abre esa vista del .base (la primera si se omite;\n                          --print también busca vistas de mdgrid)\n  -w, --workspace <nombre>  usa ese espacio de trabajo (workspaces.toml) para los enlaces y el\n                          mapa de relaciones; sin ruta, abre su primera tabla\n  --page <nombre>         abre esa página ([[page]]) del espacio de trabajo, con sus tablas apiladas\n  --raw                   abre la propia carpeta, no la tabla indicada en \"open\" de su marcador\n  --readonly              abre en solo lectura (sin editar ni guardar)\n  --no-color              dibuja sin colores\n  --config <ruta>         lee este archivo de configuración\n                          (por defecto: $XDG_CONFIG_HOME/mdgrid/config.toml)\n  --continue              abre la tabla y la vista mostradas por última vez en esta carpeta (como\n                          sin argumentos si no las hay; para restaurar ventanas de tmux y similares)\n  -s, --session <nombre>  abre la sesión guardada con ese nombre (su tabla, vista, filtros, orden\n                          y columnas; se guarda con \"Guardar sesión\" en la paleta)\n  --sessions              lista las sesiones (sessions.toml): nombre y carpeta, una por línea\n  --recent                imprime las tablas abiertas hace poco en la pantalla, de la más reciente\n                          a la más antigua, una por línea como\n                          \"ruta<TAB>nombre de vista<TAB>última apertura\" (hasta 20)\n  --print                 imprime la tabla de la vista en la salida estándar, sin la pantalla\n                          (las notas no cambian)\n  --format <formato>      formato de --print (csv, tsv, json, md; por defecto csv)\n  --with-path             añade a --print una primera columna \"path\" con la ruta de la nota de\n                          cada fila (la misma ruta que --pick path)\n  --filter <expresión>    conserva solo las filas en las que la expresión de .base es verdadera\n                          (repetible; con una vista de .base, se combina con sus filtros)\n  --sort <columna>[:desc]  ordena --print por esta columna (repetible; sustituye el orden\n                          de la vista)\n  --count                 imprime el número de filas de la vista (tras --filter) sin la pantalla\n  --show-hidden           con --print, --pick o --count, conserva las filas ocultas por\n                          condiciones con hide = true ([conditions])\n  --notices               imprime los elementos del cuadro de avisos ([[notices]]), uno por línea,\n                          sin la pantalla (para la línea de estado de tmux o el prompt del shell)\n  --notify                comprueba una vez los elementos de [[notify]], sin la pantalla, y avisa de las\n                          filas que empiezan a cumplir (para una tarea programada; código 1 si un aviso falla)\n  --pick <path|columna>   muestra la pantalla en solo lectura en el terminal; Enter imprime la\n                          ruta o el valor de la columna de las filas marcadas (o de la fila\n                          seleccionada), uno por línea, en la salida estándar y termina\n                          (q o Esc cancela con código de salida 1)\n  --check                 imprime los valores que no encajan con el tipo de la columna o con una\n                          regla ([rules]), uno por línea (ruta:línea: columna: motivo; código de\n                          salida 1 si hay alguno)\n  --apply <ruta>          lee un CSV o JSON con la forma de --print --with-path (- para stdin)\n                          y cambia las celdas que difieren; solo muestra las diferencias\n  --yes                   con --apply, escribe los cambios\n  --workspaces            lista los espacios de trabajo (workspaces.toml)\n  --add-to <nombre>       añade las tablas dadas (por defecto: esta carpeta) a ese espacio de\n                          trabajo, y lo crea si hace falta; --as <nombre> da nombre a la tabla\n  --remove-from <nombre>  quita las tablas dadas (por defecto: esta carpeta) de ese espacio\n                          de trabajo\n  --remove-workspace <nombre>  borra ese espacio de trabajo (las notas no se tocan)\n  --init-workspace        pone un marcador de espacio de trabajo .mdgrid/workspace.toml en la\n                          carpeta (por defecto: esta carpeta)\n  --starter <nombre>      con --init-workspace, crea un registro (marcador, plantillas de notas)\n                          a partir de ese kit de inicio: uno incorporado, o starters/<nombre> en\n                          la carpeta de configuración\n  --with-samples          con --starter, añade también las notas de ejemplo del kit de inicio\n  --starters              lista los kits de inicio, uno por línea (nombre y una descripción breve)\n  --new-note <nombre>     crea una nota nueva <nombre>.md en la carpeta (por defecto: esta\n                          carpeta) sin la pantalla, con [new_note] (folder, set, template);\n                          imprime la ruta creada y nunca sobrescribe\n  --set <columna>=<valor>  con --new-note, pone ese valor en la columna (repetible; separe los\n                          elementos de una lista con comas; un valor vacío no escribe nada)\n  --print-config          imprime todos los elementos de la configuración como TOML con su valor\n                          por defecto y una descripción (docs/config.md)\n  --completions <shell>   imprime el autocompletado del shell (bash, zsh, fish, elvish, powershell)\n  --man                   imprime la página de manual (roff)\n  --help                  imprime esta ayuda\n  --version               imprime la versión"


# ---- schema: 設定の項目の説明(--print-config のコメント。screen.locales-all-in-ledger) ----
## --print-config の頭の説明(行ごとに "# " を付けて出す)。
CfgPrintHead = "Configuración de mdgrid con todos los elementos en su valor por defecto.\nUbicación: $XDG_CONFIG_HOME/mdgrid/config.toml (o ~/.config/mdgrid/config.toml;\nen Windows %APPDATA%\\mdgrid\\config.toml).\nLos elementos marcados \"solo global\" son de toda la aplicación; los demás forman el perfil de\ntabla y también se pueden escribir por espacio de trabajo, tabla y vista.\nOpciones: mdgrid --help. Referencia completa: docs/config.md en el repositorio de mdgrid."
## --print-config の書ける範囲の行。{0} は範囲の名前(CfgScopeGlobal・CfgScopeProfile)。
CfgScopeLine = "Ámbito: {0}."
CfgScopeGlobal = "solo global"
CfgScopeProfile = "global, espacio de trabajo, tabla, vista"
## --print-config の例の見出し。
CfgExampleLine = "Ejemplo:"
## 設定の項目 `language` の説明(行の区切りは --print-config のコメントの行)。
CfgLanguage = "Idioma de la pantalla, de los mensajes de inicio y de estas descripciones: \"auto\" o un código\nde idioma (en, ja, de, es, fr, ko, pt-BR, zh-CN, zh-TW). \"auto\" sigue a LC_ALL, LC_MESSAGES y LANG\n(el primero no vacío): el idioma y la región que coincidan; si no, el idioma; si no, inglés."
## 設定の項目 `editor` の説明(行の区切りは --print-config のコメントの行)。
CfgEditor = "Editor que abre la nota seleccionada (admite argumentos, p. ej. \"code -w\"; se ejecuta sin\nshell). Sin definir o en blanco: $VISUAL, luego $EDITOR, luego vi (notepad en Windows)."
## 設定の項目 `poll_ms` の説明(行の区切りは --print-config のコメントの行)。
CfgPollMs = "Intervalo en milisegundos para volver a leer las notas cambiadas fuera de mdgrid."
## 設定の項目 `use` の説明(行の区切りは --print-config のコメントの行)。
CfgUse = "Pone la plantilla [templates.<nombre>] debajo de los valores escritos en este lugar."
## 設定の項目 `types` の説明(行の区切りは --print-config のコメントの行)。
CfgTypes = "El tipo de columnas concretas. Prevalece sobre los ajustes de tipo de la carpeta raíz\n(.obsidian/types.json) y sobre lo que se deduce de los valores; \"auto\" vuelve a deducirlo (un\námbito más estrecho puede deshacer uno más amplio). El tipo determina la entrada de la celda, la\nmarca ! en los valores que no encajan, el orden y la marca de tipo del encabezado de la columna.\nLas notas no cambian. Al hacer clic en la marca de tipo de un encabezado, o con column_type en la\npaleta o en el menú de acciones, se elige un tipo y se escribe en la tabla de views.toml."
## 設定の項目 `rules` の説明(行の区切りは --print-config のコメントの行)。
CfgRules = "Reglas para columnas concretas, comprobadas junto con el tipo de la columna. required = true\nhace que una clave ausente, null, una cadena vacía o una lista vacía sea un problema; values lista\nlos valores permitidos (cada elemento de una lista debe ser uno de ellos; distingue mayúsculas y\nminúsculas). Un ámbito más estrecho prevalece elemento a elemento. Los problemas llevan la marca !,\nla franja inferior los cuenta, ! y @ saltan entre ellos y mdgrid --check los lista. Comprobar una\nregla nunca cambia una nota ni le impide escribir un valor; una columna con values los ofrece en\nla entrada de la celda. then rellena otras columnas de la misma fila cuando la columna toma un\nvalor (value = { column = text }; funcionan variables de plantilla como {date}, y un texto vacío\nvacía la columna); se prepara junto con su edición y se deshace con ella.\nLas columnas calculadas (file.*, formula.*) no pueden tener reglas."
## 設定の項目 `terminal.color` の説明(行の区切りは --print-config のコメントの行)。
CfgTerminalColor = "Usar colores. false dibuja sin colores (igual que NO_COLOR o --no-color)."
## 設定の項目 `terminal.ambiguous_wide` の説明(行の区切りは --print-config のコメントの行)。
CfgTerminalAmbiguousWide = "Tratar los caracteres ambiguos de Asia oriental (como ○ y ※) como de dos columnas de ancho.\nPonga true si su terminal los dibuja anchos. Los marcos de ventana son entonces siempre ASCII."
## 設定の項目 `terminal.nerd_font` の説明(行の区切りは --print-config のコメントの行)。
CfgTerminalNerdFont = "Si se pueden dibujar extremos redondeados (glifos de Nerd Font). true: la fuente del terminal es\nuna Nerd Font. \"auto\": solo en terminales que dibujan ellos mismos estos glifos (Ghostty, WezTerm),\npara que nada se rompa en otros. Sin extremos redondeados, \"pill\" se dibuja como \"soft\"."
## 設定の項目 `terminal.nerd_icons` の説明(行の区切りは --print-config のコメントの行)。
CfgTerminalNerdIcons = "Usar glifos de iconos de una Nerd Font para el botón de ajustes, el botón y el menú de tipo de\npantalla, las marcas de tipo de los encabezados de columna y el título del calendario. Ponga true\nsolo si la fuente de su terminal es una Nerd Font; por defecto se usan caracteres simples\n(⚙, ▦, ◇, #, ◷, ⋮, ◉, ✓). Nunca se usan emojis."
## 設定の項目 `terminal.herdr` の説明(行の区切りは --print-config のコメントの行)。
CfgTerminalHerdr = "Dentro de un panel de Herdr, indica a Herdr el comando que reabre la tabla y la vista actuales,\npara que Herdr la abra de nuevo cuando su servidor se reinicie. false nunca llama a Herdr."
## 設定の項目 `workspace.detect` の説明(行の区切りは --print-config のコメントの行)。
CfgWorkspaceDetect = "Cuando la tabla que abre no está en ningún espacio de trabajo escrito, trata como espacio de\ntrabajo (la carpeta raíz) la carpeta más cercana por encima que tenga una de estas carpetas\nmarcadoras: \".obsidian\" (una carpeta con .obsidian/) o \".git\" (un repositorio git). Sus carpetas\ncon notas pasan a ser las tablas del mapa de relaciones. [] desactiva la detección. Los valores\nantiguos \"vault\" y \"git\" se leen igual, con un aviso."
## 設定の項目 `git.auto` の説明(行の区切りは --print-config のコメントの行)。
CfgGitAuto = "Hasta dónde llega mdgrid con git después de escribir notas en un repositorio git: \"off\" no hace\nnada, \"add\" prepara (stage) las notas que escribió, \"commit\" además hace commit de ellas (solo de\nesas notas, nunca de otros archivos cambiados o preparados), \"push\" además hace push. Las\ncarpetas que no son repositorios git no se tocan. Un fallo de git se informa en una línea y el\nguardado en sí queda hecho."
## 設定の項目 `git.when` の説明(行の区切りは --print-config のコメントの行)。
CfgGitWhen = "Cuándo se ejecuta git.auto: \"save\" tras cada guardado (un commit por guardado), \"quit\" una vez al\nsalir de mdgrid (un commit por sesión). Las notas aún pendientes al salir siempre se procesan."
## 設定の項目 `git.message` の説明(行の区切りは --print-config のコメントの行)。
CfgGitMessage = "El mensaje del commit: \"auto\" escribe \"mdgrid: actualizar N notas\" y las rutas; \"ask\" abre un\ncampo de una línea tras cada guardado (vacío usa el mensaje automático; Esc deja las notas para el\ncommit al salir)."
## 設定の項目 `look.theme` の説明(行の区切りは --print-config のコメントの行)。
CfgLookTheme = "Tema de colores de la pantalla. \"default\" mantiene los colores propios del terminal. Una tabla\n{ light = ..., dark = ... } elige según el fondo del terminal; \"auto\" es\n{ light = \"saas\", dark = \"sumi\" }. Se ignora sin colores; los terminales de 256 colores reciben\nlos colores más cercanos."
## 設定の項目 `look.preset` の説明(行の区切りは --print-config のコメントの行)。
CfgLookPreset = "Un conjunto completo de formas de piezas. [look.style] sustituye piezas sueltas. Un preset\nescrito en un lugar más estrecho descarta las formas de piezas escritas en lugares más amplios."
## 設定の項目 `look.mode` の説明(行の区切りは --print-config のコメントの行)。
CfgLookMode = "El aspecto con colores: \"modern\" (al estilo de lazygit: selección tintada, bordes y teclas en\ncolor de acento, etiquetas atenuadas) o \"classic\" (vídeo inverso). El texto en pantalla es el\nmismo; sin colores ambos se ven como classic."
## 設定の項目 `look.cells` の説明(行の区切りは --print-config のコメントの行)。
CfgLookCells = "Cómo se ven las celdas de la tabla con colores: \"rich\" (booleanos, listas, valores cortos\nrepetidos, enlaces y marcas de tipo de columna dibujados como piezas con las formas de\n[look.style]) o \"plain\" (el texto tal cual). Sin colores las celdas son siempre plain."
## 設定の項目 `look.style` の説明(行の区切りは --print-config のコメントの行)。
CfgLookStyle = "Sustituye formas sueltas de piezas del preset: status (\"dot\", \"shape\", \"text\", \"pill\", \"tint\",\n\"solid\", \"soft\", \"chip\", \"plain\"), tags (\"dots\", \"hash\", \"brackets\", \"pill\", \"tint\",\n\"solid\", \"soft\", \"chip\", \"plain\"), check (\"box\", \"tick\", \"bracket\", \"text\"), select\n(\"bar\", \"cross\", \"tint\", \"outline\", \"fill\", \"reverse\"), rules (\"none\", \"header\",\n\"columns\", \"grid\"), tabs (\"underline\", \"pill\", \"segment\", \"brackets\", \"dim\"), frames\n(\"rounded\", \"square\", \"heavy\", \"ascii\", \"none\"), band (\"keys\", \"boxed\", \"quiet\"), links\n(\"accent\", \"plain\") e icons (true o false). \"plain\" (\"text\" en check) deja esa pieza como\ntexto. docs/catalog/index.html muestra todas las opciones y escribe esta tabla por usted."
## 設定の項目 `look.columns` の説明(行の区切りは --print-config のコメントの行)。
CfgLookColumns = "Cómo se ven columnas concretas: \"rich\", \"plain\" o \"chip\" (chips aunque la columna no se\ndetecte como tal). Un ajuste de columna prevalece sobre las formas de las piezas."
## 設定の項目 `look.colors` の説明(行の区切りは --print-config のコメントの行)。
CfgLookColors = "Sustituye los colores del tema por función: background, text, header, selection,\nselection_text, band, band_text, accent, strong, zebra, zebra_text, mark, added, removed, pending\ny highlight. [look.colors.values] fija un color por valor (sin distinguir mayúsculas), que usan\ntodas las formas de piezas. Los colores son \"#rrggbb\", \"#rgb\" o un nombre (black, white, gray,\nred, orange, yellow, green, teal, cyan, blue, purple, magenta, pink, brown). Con\ntheme = \"default\", solo se usan accent, selection y los colores por valor. Un tema escrito en un\nlugar más estrecho descarta los colores por función escritos en lugares más amplios."
## 設定の項目 `display.row_numbers` の説明(行の区切りは --print-config のコメントの行)。
CfgDisplayRowNumbers = "Números 1, 2, 3... a la izquierda de cada fila, en el orden mostrado."
## 設定の項目 `display.zebra` の説明(行の区切りは --print-config のコメントの行)。
CfgDisplayZebra = "Sombrear filas alternas (no sin colores)."
## 設定の項目 `display.column_lines` の説明(行の区切りは --print-config のコメントの行)。
CfgDisplayColumnLines = "Dibujar │ entre las columnas."
## 設定の項目 `display.group_gap` の説明(行の区切りは --print-config のコメントの行)。
CfgDisplayGroupGap = "Una línea vacía encima de cada encabezado de grupo salvo el primero."
## 設定の項目 `display.tabs` の説明(行の区切りは --print-config のコメントの行)。
CfgDisplayTabs = "La fila de pestañas de vista: \"always\", \"auto\" (solo con dos o más vistas; con una vista, la\ntabla ocupa esa fila) o \"never\". Las teclas de las pestañas funcionan en ambos casos."
## 設定の項目 `display.search_bar` の説明(行の区切りは --print-config のコメントの行)。
CfgDisplaySearchBar = "Mostrar una barra de búsqueda sobre la tabla. false la oculta; la búsqueda rápida se escribe\nentonces en la línea inferior."
## 設定の項目 `display.chips` の説明(行の区切りは --print-config のコメントの行)。
CfgDisplayChips = "Mostrar la franja de ajustes de vista activos. f elige sus elementos aunque esté oculta."
## 設定の項目 `display.buttons` の説明(行の区切りは --print-config のコメントの行)。
CfgDisplayButtons = "Cómo se dibujan la barra de búsqueda y los botones Filtrar y Ordenar de la barra de vista: \"plain\"\n(se distinguen por su fondo) o \"box\" (cada uno en un recuadro de líneas sobre las líneas de margen\nde la barra de vista, sin relleno). Sin margen (display.bar_padding = 0) no se dibujan líneas."
## 設定の項目 `display.bar_padding` の説明(行の区切りは --print-config のコメントの行)。
CfgDisplayBarPadding = "Margen encima y debajo de la barra de vista, en líneas: 0, 0.5, 1, 1.5 o 2 (valen 1 y 1.0).\n0 dibuja la barra de vista en una línea. Una media línea toma el color de fondo de la barra de\nvista con su mitad exterior cubierta por medios bloques (▀ arriba, ▄ abajo) del color de fondo\nde la pantalla (el del tema o el del terminal, consultado una vez al iniciar); cuando no se\nconoce, sin colores y con terminal.ambiguous_wide = true, se redondea a una línea vacía.\nLos terminales de menos de 16 líneas, y una barra de búsqueda oculta, usan siempre 0. Con otros\nvalores se avisa y se usa el valor por defecto."
## 設定の項目 `display.top_padding` の説明(行の区切りは --print-config のコメントの行)。
CfgDisplayTopPadding = "Margen encima de la cabecera, en líneas: 0, 0.5, 1, 1.5 o 2. Una media línea se dibuja como\nen display.bar_padding (▀ encima de la cabecera, que toma entonces el color de fondo de la barra\nde vista). Los terminales de menos de 16 líneas usan siempre 0."
## 設定の項目 `display.row_extra_lines` の説明(行の区切りは --print-config のコメントの行)。
CfgDisplayRowExtraLines = "Cuántas líneas de más puede crecer una fila de la tabla: una fila con un valor largo o con saltos\nde línea lo ajusta al ancho de la columna y crece hasta 1 + este número de líneas (cada fila solo\ntan alta como necesite). Lo que no cabe termina en …. 0 mantiene cada fila en una línea, con los\nsaltos de línea mostrados como …⏎. Con otros valores se avisa y se usa el valor por defecto."
## 設定の項目 `display.note_path` の説明(行の区切りは --print-config のコメントの行)。
CfgDisplayNotePath = "Cómo muestra cada nota la columna de notas de la izquierda: \"common\" quita la carpeta común a\ntodas las filas, \"name\" muestra solo el nombre, \"full\" la ruta desde la raíz y \"off\" ningún\nnombre (solo las marcas de fila). Con otros valores se avisa y se usa el valor por defecto."
## 設定の項目 `display.tab_wrap` の説明(行の区切りは --print-config のコメントの行)。
CfgDisplayTabWrap = "Si las pestañas de vista no caben en la fila de la barra de vista, las pasa todas a filas bajo el\ncuadro de búsqueda y los botones, tantas como necesiten, para que todas sigan visibles (la tabla\nbaja esas filas). false mantiene una fila y deja fuera otras pestañas si la pantalla es estrecha."
## 設定の項目 `display.tab_wrap_gap` の説明(行の区切りは --print-config のコメントの行)。
CfgDisplayTabWrapGap = "Con tab_wrap, deja una fila vacía entre la fila del cuadro de búsqueda y las pestañas de debajo."
## 設定の項目 `display.note_name` の説明(行の区切りは --print-config のコメントの行)。
CfgDisplayNoteName = "Una expresión regular que se aplica al nombre en la columna de notas (tras note_path; con\ncarpetas, solo a la última parte). Si coincide, muestra el grupo llamado name, si no el primer\ngrupo, y si no el nombre sin la coincidencia. Un nombre que no coincide, o que quedaría vacío, se\nmuestra tal cual. \"\" no fija nada. Una expresión que no se puede leer se avisa y no se usa."
## 設定の項目 `dates.format` の説明(行の区切りは --print-config のコメントの行)。
CfgDatesFormat = "Cómo se muestran y se escriben las fechas en la tabla. Partes: YYYY, YY, MM, M, DD, D, ddd\n(día de la semana) y separadores no alfanuméricos. Las notas siempre se escriben como YYYY-MM-DD."
## 設定の項目 `dates.week_start` の説明(行の区切りは --print-config のコメントの行)。
CfgDatesWeekStart = "Primer día de la semana en el calendario de fechas."
## 設定の項目 `edit.candidates` の説明(行の区切りは --print-config のコメントの行)。
CfgEditCandidates = "Número máximo de valores candidatos que se ofrecen al editar una celda de texto.\nLas columnas con más valores distintos no ofrecen candidatos."
## 設定の項目 `edit.add_frontmatter` の説明(行の区切りは --print-config のコメントの行)。
CfgEditAddFrontmatter = "Permite escribir en notas sin front matter o con uno vacío (se añade un front matter o una\nlínea de clave). false deja esas notas en solo lectura."
## 設定の項目 `new_note` の説明(行の区切りは --print-config のコメントの行)。
CfgNewNote = "Cómo se crea una nota nueva desde la tabla: mode (\"form\": un formulario con todos los campos,\no \"editor\": crear y abrir en el editor), folder (relativa a la carpeta abierta), name\n(plantilla del nombre), ask (las columnas del formulario; por defecto: las columnas visibles),\nrequired (columnas que hay que rellenar), hidden (columnas que se escriben sin campo), body (un\narchivo de plantilla del cuerpo) y [new_note.set] (columna = valor). Las plantillas pueden usar\n{date}, {date+7}, {date:YYYY/MM/DD}, {time}, {now}, {weekday}, {name} y {folder}. Los valores\ndel filtro de la vista van primero.\nLa tabla es un solo elemento: un lugar más estrecho que la escribe la sustituye entera."
## 設定の項目 `keys` の説明(行の区切りは --print-config のコメントの行)。
CfgKeys = "Reasignación de teclas por modo: bajo [keys.<modo>], escriba tecla = nombre de la acción.\n\"none\" quita la tecla. Modos: table, edit, review, quit, help, palette, search, filter, detail,\nsettings, settings_input, chips, list_select, menu, freq, sorts, relations, drawer, filter_window,\nfilter_input, screen_menu, column_type, tree, gantt, kanban, chart, notice, switch, input_normal\n(modo vim). Los nombres de las acciones se muestran en la paleta de comandos (:)."
## 設定の項目 `keys.vim` の説明(行の区切りは --print-config のコメントの行)。
CfgKeysVim = "Modo vim: las entradas empiezan en modo inserción y Esc las pasa a modo normal (h l 0 $ w b e,\ni a I A, x X dw db d$ D dd, cw c$ C cc, u). La tabla recibe dd (borrar la nota), p (pegar el valor\ncopiado con y o Y) y . (repetir el último valor). false deja todas las teclas como están."
## 設定の項目 `search.across` の説明(行の区切りは --print-config のコメントの行)。
CfgSearchAcross = "Añade \"Buscar en todo el espacio de trabajo\" a la paleta de comandos: busca una palabra en\ntodas las filas de todas las tablas del espacio de trabajo actual (o de las tablas registradas) y\nlista por tabla las filas que coinciden. false (por defecto) deja la paleta como está."
## 設定の項目 `templates` の説明(行の区切りは --print-config のコメントの行)。
CfgTemplates = "Partes con nombre de un perfil ([look], [display], [dates], [edit], [new_note]).\nuse = \"<nombre>\" en cualquier lugar pone una debajo de los valores de ese lugar. La plantilla de\nui.toml prevalece sobre la de config.toml con el mismo nombre."
## 設定の項目 `conditions` の説明(行の区切りは --print-config のコメントの行)。
CfgConditions = "Condiciones con nombre: una expresión (expr) escrita una vez y usada por su nombre.\ncond(\"<nombre>\") en cualquier expresión, una tecla numérica (key = 1-9) que muestra solo las\nfilas que coinciden, la sección de filtros de los ajustes de vista, y hide = true para ocultar\nlas filas que coinciden en todas las tablas. label es el nombre que se muestra."
## 設定の項目 `notices` の説明(行の区切りは --print-config のコメントの行)。
CfgNotices = "El cuadro de avisos sobre la cabecera, que solo se muestra cuando hay elementos escritos. Un\nelemento de recuento cuenta las filas que cumplen una condición con nombre ([conditions]) en la\ntabla, en el espacio de trabajo o en tablas con nombre; un elemento de nota muestra las primeras\nlíneas del cuerpo de una nota. mdgrid --notices imprime las mismas líneas."
## 設定の項目 `notify` の説明(行の区切りは --print-config のコメントの行)。
CfgNotify = "Avisa cuando una fila empieza a cumplir una condición con nombre ([conditions]), un aviso por fila,\nen la terminal, el escritorio o un comando propio. Las filas que ya cumplen al añadir el elemento se\nrecuerdan en silencio; más filas nuevas que group_over en una comprobación forman un solo aviso. Se\ncomprueba mientras mdgrid está abierto; mdgrid --notify comprueba una vez para una tarea programada."


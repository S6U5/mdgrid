StackMax = "dá para empilhar até {0} tabelas"
StackNoRoom = "o terminal é baixo demais para empilhar outra tabela (cada tabela precisa do título e de 3 linhas)"
StackNoTables = "nenhuma outra tabela para empilhar (as tabelas deste escopo já estão empilhadas)"
StackCloseOnly = "só uma tabela está aberta, então ela não pode ser fechada"
StackSingle = "nenhuma tabela está empilhada"
StackGrowLimit = "esta tabela não pode ficar mais alta (as outras tabelas mantêm o título e 3 linhas)"
StackShrinkLimit = "esta tabela não pode ficar mais baixa (ela mantém o título e 3 linhas)"
StackCollapsed = "o terminal é baixo demais para mudar as alturas"

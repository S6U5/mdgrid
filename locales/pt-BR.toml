KeyStackUp = "Tabela acima"
KeyStackClose = "Fechar esta tabela"
KeyStackGrow = "Aumentar esta tabela em uma linha"
KeyStackShrink = "Diminuir esta tabela em uma linha"
KeyStackCloseSave = "Salvar e fechar"
KeyStackCloseDiscard = "Descartar e fechar"
CmdStackAdd = "Empilhar uma tabela abaixo"
CmdPageSave = "Salvar o arranjo como página"

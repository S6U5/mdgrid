## 設定の項目 `language` の説明(行の区切りは --print-config のコメントの行)。
CfgLanguage = "Idioma da tela, das mensagens de início e destas descrições: \"auto\" ou um código de idioma\n(en, ja, de, es, fr, ko, pt-BR, zh-CN, zh-TW). \"auto\" segue LC_ALL, LC_MESSAGES e LANG (o\nprimeiro não vazio): o idioma e a região que batem, senão o idioma, senão o inglês."
## 設定の項目 `editor` の説明(行の区切りは --print-config のコメントの行)。
CfgEditor = "Editor que abre a nota selecionada (aceita argumentos, ex.: \"code -w\"; executado sem\nshell). Sem valor ou em branco: $VISUAL, depois $EDITOR, depois vi (notepad no Windows)."
## 設定の項目 `poll_ms` の説明(行の区切りは --print-config のコメントの行)。
CfgPollMs = "Intervalo em milissegundos para reler notas alteradas fora do mdgrid."
## 設定の項目 `use` の説明(行の区切りは --print-config のコメントの行)。
CfgUse = "Põe o modelo [templates.<name>] por baixo dos valores escritos neste lugar."
## 設定の項目 `types` の説明(行の区切りは --print-config のコメントの行)。
CfgTypes = "O tipo de colunas individuais. Vale sobre as configurações de tipo da pasta raiz\n(.obsidian/types.json) e sobre a dedução pelos valores; \"auto\" volta à dedução (um escopo mais\nestreito pode desfazer um mais amplo). O tipo define a entrada da célula, a marca ! nos valores\nque não se encaixam, a ordenação e a marca de tipo do cabeçalho da coluna. As notas não são\nalteradas. Clicar na marca de tipo de um cabeçalho, ou column_type na paleta ou no menu de ações,\nescolhe um tipo e o grava na tabela em views.toml."
## 設定の項目 `rules` の説明(行の区切りは --print-config のコメントの行)。
CfgRules = "Regras para colunas individuais, verificadas junto com o tipo da coluna. required = true torna\num problema a chave ausente, null, uma string vazia ou uma lista vazia; values lista os valores\npermitidos (cada item de uma lista deve ser um deles, diferenciando maiúsculas). Um escopo mais\nestreito vence item a item. Problemas recebem a marca !, a faixa de baixo os conta, ! e @ saltam\nentre eles, e mdgrid --check os lista. Verificar uma regra nunca altera uma nota nem impede gravar\num valor; uma coluna com values os oferece na entrada da célula. then preenche outras colunas da\nmesma linha quando você põe a coluna num valor (value = { column = text }; variáveis de modelo\ncomo {date} funcionam, um texto vazio limpa a coluna); isso entra junto com a sua edição e é\ndesfeito com ela. Colunas calculadas (file.*, formula.*) não podem ter regras.\nAgrupar por uma coluna com values ordena os grupos nessa ordem (invertida na ordem\ndecrescente). icons e labels (valor = texto) mostram um símbolo e um nome para um valor nos\ncabeçalhos de grupo e nas raias do kanban; células, filtros, busca e --print mantêm o valor."
## 設定の項目 `format` の説明(行の区切りは --print-config のコメントの行)。
CfgFormat = "Como os números de colunas individuais são mostrados. thousands = true agrupa a parte inteira\nde três em três dígitos; decimals é o número de casas decimais (0 a 10; as que faltam são\npreenchidas com 0 e as que sobram são arredondadas); prefix e suffix vão antes e depois do\nnúmero (um número negativo põe - antes do prefix). Os separadores seguem o idioma da tela. Vale\npara células, a vista de detalhes, a linha de resumo, os subtotais nos cabeçalhos de grupo e os\nvalores dos gráficos, mas não para resumos que contam nem gráficos de contagem. Só muda o que\nse vê: notas, ordenação, filtros, fórmulas, a entrada da célula e --print mantêm o número.\nColunas calculadas (formula.*) também podem ter. Um escopo mais estreito vence item a item."
## 設定の項目 `terminal.color` の説明(行の区切りは --print-config のコメントの行)。
CfgTerminalColor = "Usar cores. false desenha sem cores (o mesmo que NO_COLOR ou --no-color)."
## 設定の項目 `terminal.ambiguous_wide` の説明(行の区切りは --print-config のコメントの行)。
CfgTerminalAmbiguousWide = "Tratar caracteres East Asian Ambiguous (como ○ e ※) como de duas colunas de largura.\nUse true se o seu terminal os desenha largos. As molduras das janelas passam a ser sempre ASCII."
## 設定の項目 `terminal.nerd_font` の説明(行の区切りは --print-config のコメントの行)。
CfgTerminalNerdFont = "Se as pontas redondas das pílulas (glifos Nerd Font) podem ser desenhadas. true: a fonte do\nseu terminal é uma Nerd Font. \"auto\": só em terminais que desenham esses glifos por conta\nprópria (Ghostty, WezTerm), para nada quebrar nos outros. Sem pontas redondas, \"pill\" é\ndesenhado como \"soft\"."
## 設定の項目 `terminal.nerd_icons` の説明(行の区切りは --print-config のコメントの行)。
CfgTerminalNerdIcons = "Usar glifos de ícone de uma Nerd Font no botão de ajustes, no botão e no menu de tipo de tela,\nnas marcas de tipo dos cabeçalhos de coluna e das caixas do mapa de relações e no título do\ncalendário. Use true só se a fonte do seu terminal for uma Nerd Font; por padrão usam-se\ncaracteres simples (⚙, ▦, ◇, #, ◷, ⋮, ◉, ✓, ↪). Emojis nunca são usados."
## 設定の項目 `terminal.herdr` の説明(行の区切りは --print-config のコメントの行)。
CfgTerminalHerdr = "Dentro de um painel do Herdr, informa ao Herdr o comando que reabre a tabela e a visão atuais,\npara que o Herdr as abra de novo depois que o servidor dele reiniciar. false nunca chama o Herdr."
## 設定の項目 `workspace.detect` の説明(行の区切りは --print-config のコメントの行)。
CfgWorkspaceDetect = "Quando a tabela que você abre não está em nenhum espaço de trabalho escrito, trata como espaço\nde trabalho (a pasta raiz) a pasta mais próxima acima dela que tenha uma destas pastas de\nmarcação: \".obsidian\" (uma pasta com .obsidian/) ou \".git\" (um repositório git). As pastas\ndela com notas viram as tabelas do mapa de relações. [] desliga a detecção. Os valores antigos\n\"vault\" e \"git\" são lidos do mesmo jeito, com um aviso."
## 設定の項目 `git.auto` の説明(行の区切りは --print-config のコメントの行)。
CfgGitAuto = "Até onde o mdgrid vai com o git depois de gravar notas num repositório git: \"off\" não faz\nnada, \"add\" põe no stage as notas que gravou, \"commit\" também faz commit delas (só dessas\nnotas, nunca de outros arquivos alterados ou no stage), \"push\" também faz push. Pastas que não\nsão repositórios git ficam como estão. Uma falha do git é informada numa linha e o salvamento em\nsi continua feito."
## 設定の項目 `git.when` の説明(行の区切りは --print-config のコメントの行)。
CfgGitWhen = "Quando git.auto roda: \"save\" após cada salvamento (um commit por salvamento), \"quit\" uma vez\nquando o mdgrid sai (um commit pela sessão). Notas ainda pendentes na saída são sempre tratadas\nnesse momento."
## 設定の項目 `git.message` の説明(行の区切りは --print-config のコメントの行)。
CfgGitMessage = "A mensagem do commit: \"auto\" escreve \"mdgrid: atualiza N notas\" e os caminhos; \"ask\" abre\num campo de uma linha após cada salvamento (vazio usa a mensagem automática, Esc deixa as notas\npara o commit na saída)."
## 設定の項目 `look.theme` の説明(行の区切りは --print-config のコメントの行)。
CfgLookTheme = "Tema de cores da tela. \"default\" mantém as cores do próprio terminal. Uma tabela\n{ light = ..., dark = ... } escolhe pelo fundo do terminal; \"auto\" é\n{ light = \"saas\", dark = \"sumi\" }. Ignorado sem cores; terminais de 256 cores recebem\nas cores mais próximas."
## 設定の項目 `look.preset` の説明(行の区切りは --print-config のコメントの行)。
CfgLookPreset = "Um conjunto inteiro de formatos de partes. [look.style] substitui partes individuais. Um preset\nescrito num lugar mais estreito descarta os formatos de partes escritos em lugares mais amplos."
## 設定の項目 `look.mode` の説明(行の区切りは --print-config のコメントの行)。
CfgLookMode = "A aparência quando as cores estão ligadas: \"modern\" (como o lazygit: seleção tingida, bordas e\nteclas em destaque, rótulos esmaecidos) ou \"classic\" (vídeo inverso). O texto na tela é o mesmo;\nsem cores, os dois ficam como classic."
## 設定の項目 `look.cells` の説明(行の区切りは --print-config のコメントの行)。
CfgLookCells = "Como as células da tabela aparecem quando as cores estão ligadas: \"rich\" (booleanos, listas,\nvalores curtos repetidos, links e marcas de tipo de coluna desenhados como partes nos formatos\nde [look.style]) ou \"plain\" (o texto como está). Sem cores, as células são sempre plain."
## 設定の項目 `look.style` の説明(行の区切りは --print-config のコメントの行)。
CfgLookStyle = "Substitui formatos de partes individuais do preset: status (\"dot\", \"shape\", \"text\", \"pill\",\n\"tint\", \"solid\", \"soft\", \"chip\", \"plain\"), tags (\"dots\", \"hash\", \"brackets\", \"pill\", \"tint\",\n\"solid\", \"soft\", \"chip\", \"plain\"), check (\"box\", \"tick\", \"bracket\", \"text\"), select\n(\"bar\", \"cross\", \"tint\", \"outline\", \"fill\", \"reverse\"), rules (\"none\", \"header\",\n\"columns\", \"grid\"), tabs (\"underline\", \"pill\", \"segment\", \"brackets\", \"dim\"), frames\n(\"rounded\", \"square\", \"heavy\", \"ascii\", \"none\"), band (\"keys\", \"boxed\", \"quiet\"), links\n(\"accent\", \"plain\") e icons (true ou false). \"plain\" (\"text\" para check) mantém essa parte\ncomo texto. docs/catalog/index.html mostra todas as opções e escreve esta tabela para você."
## 設定の項目 `look.columns` の説明(行の区切りは --print-config のコメントの行)。
CfgLookColumns = "Como colunas individuais aparecem: \"rich\", \"plain\" ou \"chip\" (chips mesmo que a coluna não\nseja detectada como tal). O ajuste de uma coluna vence os formatos de partes."
## 設定の項目 `look.colors` の説明(行の区切りは --print-config のコメントの行)。
CfgLookColors = "Substitui as cores do tema por papel: background, text, header, selection, selection_text,\nband, band_text, accent, strong, zebra, zebra_text, mark, added, removed, pending e\nhighlight. [look.colors.values] define uma cor por valor (sem diferenciar maiúsculas), usada\npor todos os formatos de partes. As cores são \"#rrggbb\", \"#rgb\" ou um nome (black, white, gray,\nred, orange, yellow, green, teal, cyan, blue, purple, magenta, pink, brown). Com\ntheme = \"default\", só as cores accent, selection e por valor são usadas. Um tema escrito num\nlugar mais estreito descarta as cores de papel escritas em lugares mais amplos."
## 設定の項目 `display.row_numbers` の説明(行の区切りは --print-config のコメントの行)。
CfgDisplayRowNumbers = "Números 1, 2, 3... à esquerda de cada linha, na ordem mostrada."
## 設定の項目 `display.zebra` の説明(行の区切りは --print-config のコメントの行)。
CfgDisplayZebra = "Sombreia linhas alternadas (não sem cores)."
## 設定の項目 `display.column_lines` の説明(行の区切りは --print-config のコメントの行)。
CfgDisplayColumnLines = "Desenha │ entre as colunas."
## 設定の項目 `display.group_gap` の説明(行の区切りは --print-config のコメントの行)。
CfgDisplayGroupGap = "Uma linha vazia acima de cada cabeçalho de grupo, exceto o primeiro."
## 設定の項目 `display.tabs` の説明(行の区切りは --print-config のコメントの行)。
CfgDisplayTabs = "A linha de abas das visões: \"always\", \"auto\" (só com duas ou mais visões; com uma visão, a\ntabela fica com essa linha) ou \"never\". As teclas de aba funcionam de qualquer forma."
## 設定の項目 `display.search_bar` の説明(行の区切りは --print-config のコメントの行)。
CfgDisplaySearchBar = "Mostra uma barra de busca acima da tabela. false a oculta; a busca rápida passa a ser digitada\nna linha de baixo."
## 設定の項目 `display.chips` の説明(行の区切りは --print-config のコメントの行)。
CfgDisplayChips = "Mostra a faixa dos ajustes ativos da visão. f ainda escolhe os itens dela quando oculta."
## 設定の項目 `display.buttons` の説明(行の区切りは --print-config のコメントの行)。
CfgDisplayButtons = "Como a barra de busca e os botões Filtrar e Ordenar da barra de visões são desenhados: \"plain\"\n(mostrados pelo fundo) ou \"box\" (cada um numa caixa desenhada com linhas nas linhas de margem\nda barra de visões, sem preenchimento). Sem margem (display.bar_padding = 0) nenhuma linha é\ndesenhada."
## 設定の項目 `display.bar_padding` の説明(行の区切りは --print-config のコメントの行)。
CfgDisplayBarPadding = "Margem acima e abaixo da barra de visões, em linhas: 0, 0.5, 1, 1.5 ou 2 (1 e 1.0 funcionam).\n0 desenha a barra de visões numa linha. Uma meia linha recebe a cor de fundo da barra de visões,\ncom a metade externa coberta por meios blocos (▀ acima, ▄ abaixo) na cor de fundo da tela (a do\ntema, ou a do terminal, consultada uma vez no início); quando ela é desconhecida, sem cores, e\ncom terminal.ambiguous_wide = true, é arredondada para uma linha vazia.\nTerminais com menos de 16 linhas, e uma barra de busca oculta, usam sempre 0. Outros valores\ngeram aviso e o padrão é usado."
## 設定の項目 `display.top_padding` の説明(行の区切りは --print-config のコメントの行)。
CfgDisplayTopPadding = "Margem acima do cabeçalho, em linhas: 0, 0.5, 1, 1.5 ou 2. Uma meia linha é desenhada como em\ndisplay.bar_padding (▀ acima do cabeçalho, que então recebe a cor de fundo da barra de visões).\nTerminais com menos de 16 linhas usam sempre 0."
## 設定の項目 `display.row_extra_lines` の説明(行の区切りは --print-config のコメントの行)。
CfgDisplayRowExtraLines = "Quantas linhas de texto a mais uma linha da tabela pode ocupar: uma linha com um valor longo ou\ncom quebras de linha o quebra na largura da coluna e cresce até 1 + esse número de linhas (cada\nlinha só fica tão alta quanto precisa). O que não cabe termina com …. 0 mantém cada linha da\ntabela numa só linha de texto, com as quebras mostradas como …⏎. Outros valores geram aviso e o\npadrão é usado."
## 設定の項目 `display.note_path` の説明(行の区切りは --print-config のコメントの行)。
CfgDisplayNotePath = "Como a coluna de nota à esquerda mostra cada nota: \"common\" tira a pasta comum a todas as\nlinhas, \"name\" mostra só o nome, \"full\" o caminho desde a raiz, e \"off\" nenhum nome (só as\nmarcas de linha). Outros valores geram aviso e o padrão é usado."
## 設定の項目 `display.tab_wrap` の説明(行の区切りは --print-config のコメントの行)。
CfgDisplayTabWrap = "Quando as abas das visões não cabem na linha da barra de visões, move todas para linhas abaixo\nda caixa de busca e dos botões, quantas forem precisas, para que todas as abas fiquem visíveis\n(a tabela desce essas linhas). false mantém uma linha e deixa de fora outras abas quando a tela\né estreita."
## 設定の項目 `display.tab_wrap_gap` の説明(行の区切りは --print-config のコメントの行)。
CfgDisplayTabWrapGap = "Com tab_wrap, põe uma linha vazia entre a linha da caixa de busca e as linhas de abas abaixo dela."
## 設定の項目 `display.note_name` の説明(行の区切りは --print-config のコメントの行)。
CfgDisplayNoteName = "Uma expressão regular aplicada ao nome na coluna de nota (após note_path; com pastas, só à\núltima parte). Quando bate, mostra o grupo chamado name, senão o primeiro grupo, senão o nome\nsem o trecho que bateu. Um nome que não bate, ou que ficaria vazio, é mostrado como está. \"\"\nnão define nada. Uma expressão que não pode ser lida gera aviso e não é usada."
## 設定の項目 `dates.format` の説明(行の区切りは --print-config のコメントの行)。
CfgDatesFormat = "Como as datas são mostradas e digitadas na tabela. Partes: YYYY, YY, MM, M, DD, D, ddd\n(dia da semana) e separadores não alfanuméricos. As notas são sempre gravadas como YYYY-MM-DD."
## 設定の項目 `dates.week_start` の説明(行の区切りは --print-config のコメントの行)。
CfgDatesWeekStart = "Primeiro dia da semana, usado pelo calendário de datas, pelas palavras de data (esta semana, a próxima), pelas semanas dos gráficos e pelas semanas e \"esta semana\" do gráfico de Gantt."
## 設定の項目 `edit.candidates` の説明(行の区切りは --print-config のコメントの行)。
CfgEditCandidates = "Número máximo de valores sugeridos ao editar uma célula de texto.\nColunas com mais valores distintos não oferecem sugestões."
## 設定の項目 `edit.add_frontmatter` の説明(行の区切りは --print-config のコメントの行)。
CfgEditAddFrontmatter = "Permite gravar em notas sem front matter ou com um vazio (um front matter ou uma linha de\nchave é adicionado). false torna essas notas somente leitura."
## 設定の項目 `new_note` の説明(行の区切りは --print-config のコメントの行)。
CfgNewNote = "Como uma nota nova é criada pela tabela: mode (\"form\": um formulário com todos os campos, ou\n\"editor\": cria e abre no editor), folder (relativo à pasta aberta), name (modelo de nome),\nask (as colunas do formulário; padrão: as colunas visíveis), required (colunas que devem ser\npreenchidas), hidden (colunas gravadas sem campo), body (um arquivo de modelo de corpo) e\n[new_note.set] (coluna = valor). Os modelos podem usar {date}, {date+7}, {date:YYYY/MM/DD},\n{time}, {now}, {weekday}, {name} e {folder}. Os valores do filtro da visão vêm primeiro.\nA tabela é um item só: um lugar mais estreito que a escreve a substitui inteira. name_head (\"show\": o modelo preenchido aparece no campo do nome; \"hide\": não aparece e é colocado antes do nome digitado)."
## 設定の項目 `keys` の説明(行の区切りは --print-config のコメントの行)。
CfgKeys = "Reatribuição de teclas por modo: em [keys.<mode>], escreva tecla = nome da ação.\n\"none\" remove a tecla. Modos: table, edit, review, quit, help, palette, search,\nfilter, detail, settings, settings_input, chips, list_select, menu, freq, sorts, relations, drawer, filter_window, filter_input, screen_menu, column_type, tree, gantt, kanban, chart, notice, switch,\ninput_normal (modo vim). Os nomes das ações aparecem na paleta de comandos (:)."
## 設定の項目 `keys.vim` の説明(行の区切りは --print-config のコメントの行)。
CfgKeysVim = "Modo vim: os campos de entrada começam no modo de inserção e Esc os passa ao modo normal\n(h l 0 $ w b e, i a I A, x X dw db d$ D dd, cw c$ C cc, u). A tabela ganha dd (apagar a nota),\np (colar o valor copiado com y ou Y) e . (repetir o último valor). false mantém todas as teclas\ncomo estão."
## 設定の項目 `search.across` の説明(行の区切りは --print-config のコメントの行)。
CfgSearchAcross = "Adiciona \"Buscar em todo o espaço de trabalho\" à paleta de comandos: busca uma palavra em todas\nas linhas de todas as tabelas do espaço de trabalho atual (ou das tabelas registradas) e lista\nas linhas que batem, por tabela. false (o padrão) deixa a paleta como está."
## 設定の項目 `templates` の説明(行の区切りは --print-config のコメントの行)。
CfgTemplates = "Peças nomeadas de um perfil ([look], [display], [dates], [edit], [new_note]). use = \"<name>\"\nem qualquer lugar põe uma por baixo dos valores desse lugar. O modelo do ui.toml vence o do\nconfig.toml com o mesmo nome."
## 設定の項目 `conditions` の説明(行の区切りは --print-config のコメントの行)。
CfgConditions = "Condições nomeadas: uma expressão (expr) escrita uma vez e usada pelo nome. cond(\"<name>\") em\nqualquer expressão, uma tecla de dígito (key = 1-9) que mostra só as linhas que batem, a seção\nde filtros dos ajustes da visão, e hide = true para ocultar as linhas que batem em todas as\ntabelas. label é o nome mostrado."
## 設定の項目 `notices` の説明(行の区切りは --print-config のコメントの行)。
CfgNotices = "O quadro de avisos acima do cabeçalho, mostrado só quando há itens escritos. Um item de contagem\nconta as linhas que atendem a uma condição nomeada ([conditions]) na tabela, no espaço de\ntrabalho ou em tabelas nomeadas; um item de nota mostra as primeiras linhas do corpo de uma\nnota. mdgrid --notices imprime as mesmas linhas."
## 設定の項目 `notify` の説明(行の区切りは --print-config のコメントの行)。
CfgNotify = "Avisa quando uma linha passa a atender uma condição nomeada ([conditions]), um aviso por linha, no\nterminal, na área de trabalho ou por um comando seu. Linhas que já atendem ao adicionar o item são\nmemorizadas em silêncio; mais linhas novas que group_over em uma verificação viram um só aviso.\nVerifica enquanto o mdgrid está aberto; mdgrid --notify verifica uma vez para uma execução agendada."


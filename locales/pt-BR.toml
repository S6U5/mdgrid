# mdgrid の画面と起動の文言の台帳: 英語(SR-23)。文言の名前と並びの正本。
# 1行に1つ `名前 = "文"`(TOML の基本の文字列)。`##` の行は次の文言の説明(コードの文書になる)、`#` の行は区切り。
# 差し込みは `{0}`・`{1}` の番号。ほかの言語の台帳は同じ名前を全部持ち、同じ番号を使う(欠け・余り・空・番号の
# 食い違いはビルドで落ちる。build.rs・src/ledger.rs)。


# ---- main: 使い方(CLI-2) ----
Usage = "Uso: mdgrid [<.base | pasta | .md | .csv> ...] [--view <nome>] [-w <nome>] [--page <nome>] [--table <nome>] [--raw] [--readonly] [--no-color] [--config <caminho>]\n        mdgrid [<.base | pasta | .md> ...] --print [--format csv|tsv|json|md] [--with-path] [--view <nome>]\n                 [--filter <expressão>]... [--sort <coluna>[:desc]]...\n        mdgrid [<.base | pasta | .md> ...] --pick path|<coluna> [--view <nome>]\n        mdgrid [<.base | pasta | .md> ...] --check [--view <nome>]\n        mdgrid [<.base | pasta | .md> ...] --count [--view <nome>] [--filter <expressão>]...\n        mdgrid [<.base | pasta> ...] --notices\n        mdgrid [<.base | pasta> ...] --notify\n        mdgrid [<.base | pasta> ...] --runs\n        mdgrid [<.base | pasta> ...] --apply <caminho> [--yes]\n        mdgrid [<pasta | .base> ...] --add-to <nome> [--as <nome da tabela>] | --remove-from <nome>\n        mdgrid [<pasta> ...] --init-workspace [--starter <nome> [--with-samples]]\n        mdgrid [<pasta>] --new-note <nome> [--set <coluna>=<valor>]...\n        mdgrid --continue [--readonly] [--no-color] [--config <caminho>]\n        mdgrid -s <nome> [--readonly] [--no-color] [--config <caminho>]\n        mdgrid --sessions\n        mdgrid --recent\n        mdgrid --starters\n        mdgrid --workspaces | --remove-workspace <nome>\n        mdgrid --print-config\n        mdgrid --completions <shell>\n        mdgrid --man\n\n  Abre uma tabela das notas Markdown de uma pasta: uma linha por nota, uma coluna por\n  chave do front matter. Com um .base, abre a visão de tabela dele (as notas são buscadas\n  na pasta raiz). Com um arquivo .md, abre a pasta dele com essa nota selecionada.\n  Com um arquivo .csv ou .tsv, abre-o como tabela: uma linha por linha do arquivo, e a\n  primeira linha dá os nomes das colunas.\n  Sem argumentos, abre a pasta atual (com a lista de tabelas registradas em places.toml\n  por cima, se houver). Uma pasta com o marcador .mdgrid/workspace.toml que indica uma\n  tabela em \"open\" abre essa tabela.\n\n  --view <nome>           abre essa visão do .base (a primeira, se omitida;\n                          --print também busca as visões do mdgrid)\n  -w, --workspace <nome>  usa esse espaço de trabalho (workspaces.toml) para links e o mapa de\n                          relações; sem caminho, abre a primeira tabela dele\n  --page <nome>           abre a página ([[page]]) do espaço de trabalho, com as tabelas empilhadas\n  --table <nome>          abre a tabela com esse nome do marcador .mdgrid/workspace.toml (com -w, do espaço de\n                          trabalho) no lugar da tabela open; vale também para --print, --check, --new-note\n  --raw                   abre a própria pasta, não a tabela indicada em \"open\" do marcador\n  --readonly              abre somente leitura (sem editar nem salvar)\n  --no-color              desenha sem cores\n  --config <caminho>      lê este arquivo de configuração\n                          (padrão: $XDG_CONFIG_HOME/mdgrid/config.toml)\n  --continue              abre a tabela e a visão mostradas por último nesta pasta (como sem\n                          argumentos se não houver; para restaurar janelas no tmux e afins)\n  -s, --session <nome>    abre a sessão salva com esse nome (tabela, visão, filtros, ordenação\n                          e colunas; salve uma com \"Salvar sessão\" na paleta)\n  --sessions              lista as sessões salvas (sessions.toml): nome e pasta, uma por linha\n  --recent                imprime as tabelas abertas recentemente na tela, as mais novas primeiro,\n                          uma por linha como \"caminho<TAB>nome da visão<TAB>última abertura\"\n                          (até 20)\n  --print                 imprime a tabela da visão na saída padrão, sem a tela\n                          (as notas não são alteradas)\n  --format <formato>      formato do --print (csv, tsv, json, md; padrão csv)\n  --with-path             adiciona ao --print uma primeira coluna \"path\" com o caminho da nota\n                          de cada linha (o mesmo caminho de --pick path)\n  --filter <expressão>    mantém só as linhas em que a expressão do .base é verdadeira\n                          (repetível; com uma visão do .base, combina com os filtros dela)\n  --sort <coluna>[:desc]  ordena o --print por esta coluna (repetível; substitui a ordenação\n                          da visão)\n  --count                 imprime o número de linhas da visão (após --filter), sem a tela\n  --show-hidden           com --print, --pick ou --count, mantém as linhas ocultas por condições\n                          com hide = true ([conditions])\n  --notices               imprime os itens do quadro de avisos ([[notices]]), um por linha, sem a\n                          tela (para a linha de status do tmux ou o prompt do shell)\n  --notify                verifica uma vez os itens de [[notify]], sem a tela, e avisa as linhas que\n                          passam a atender (para execução agendada; código 1 se um aviso falhar)\n  --runs                  cria sem a tela as notas das ocorrências de rotina pendentes (runs de [[table]] no marcador)\n                          e imprime seus caminhos (para execução agendada; código 1 se alguma não pôde ser criada)\n  --pick <path|coluna>    mostra a tela somente leitura no terminal; Enter imprime o caminho\n                          ou o valor da coluna das linhas marcadas (ou da linha selecionada),\n                          um por linha, na saída padrão e sai\n                          (q ou Esc cancela com código de saída 1)\n  --check                 imprime os valores que não se encaixam no tipo da coluna ou numa regra\n                          ([rules]), um por linha (caminho:linha: coluna: motivo; código de\n                          saída 1 se houver algum)\n  --apply <caminho>       lê um CSV ou JSON no formato de --print --with-path (- para stdin)\n                          e altera as células diferentes; só mostra as diferenças\n  --yes                   com --apply, grava as alterações\n  --workspaces            lista os espaços de trabalho (workspaces.toml)\n  --add-to <nome>         adiciona as tabelas dadas (padrão: esta pasta) a esse espaço de\n                          trabalho, criando-o se preciso; --as <nome> dá nome à tabela\n  --remove-from <nome>    remove as tabelas dadas (padrão: esta pasta) desse espaço de trabalho\n  --remove-workspace <nome>  apaga esse espaço de trabalho (as notas não são tocadas)\n  --init-workspace        põe um marcador de espaço de trabalho .mdgrid/workspace.toml na pasta\n                          (padrão: esta pasta)\n  --starter <nome>        com --init-workspace, cria um registro (marcador, modelos de nota) a\n                          partir desse kit inicial: um embutido, ou starters/<nome> na pasta de\n                          configuração\n  --with-samples          com --starter, adiciona também as notas de exemplo do kit inicial\n  --starters              lista os kits iniciais, um por linha (nome e descrição de uma linha)\n  --new-note <nome>       cria uma nota nova <nome>.md na pasta (padrão: esta pasta), sem a tela,\n                          usando [new_note] (folder, set, template); imprime o caminho criado\n                          e nunca sobrescreve\n  --set <coluna>=<valor>  com --new-note, põe esse valor na coluna (repetível; separe os itens\n                          de lista com vírgulas; um valor vazio não grava nada)\n  --print-config          imprime todos os itens de configuração como TOML, com o valor padrão\n                          e uma descrição (docs/config.md)\n  --completions <shell>   imprime os completamentos do shell (bash, zsh, fish, elvish, powershell)\n  --man                   imprime a página de manual (roff)\n  --help                  imprime esta ajuda\n  --version               imprime a versão"


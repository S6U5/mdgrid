# mdgrid の画面と起動の文言の台帳: 日本語(SR-23)。名前と並びは英語の台帳(en.toml)に合わせる。
# 1行に1つ `名前 = "文"`。`##` と `#` の行は英語の台帳の説明と区切りの写し(訳す手がかり。ビルドは読まない)。
# 差し込みの番号(`{0}` など)は英語の文と同じ組にする。


# ---- main: 使い方(CLI-2) ----
Usage = "使い方: mdgrid [<.base | フォルダ | .md | .csv> …] [--view <名前>] [-w <名前>] [--page <名前>] [--raw] [--readonly] [--no-color] [--config <パス>]\n        mdgrid [<.base | フォルダ | .md> …] --print [--format csv|tsv|json|md] [--with-path] [--view <名前>]\n                 [--filter <式>]… [--sort <列>[:desc]]…\n        mdgrid [<.base | フォルダ | .md> …] --pick path|<列の名前> [--view <名前>]\n        mdgrid [<.base | フォルダ | .md> …] --check [--view <名前>]\n        mdgrid [<.base | フォルダ | .md> …] --count [--view <名前>] [--filter <式>]…\n        mdgrid [<.base | フォルダ> …] --notices\n        mdgrid [<.base | フォルダ> …] --apply <パス> [--yes]\n        mdgrid [<フォルダ | .base> …] --add-to <名前> [--as <表の名前>] | --remove-from <名前>\n        mdgrid [<フォルダ> …] --init-workspace [--starter <名前> [--with-samples]]\n        mdgrid [<フォルダ>] --new-note <名前> [--set <列>=<値>]…\n        mdgrid --continue [--readonly] [--no-color] [--config <パス>]\n        mdgrid -s <名前> [--readonly] [--no-color] [--config <パス>]\n        mdgrid --sessions\n        mdgrid --recent\n        mdgrid --starters\n        mdgrid --workspaces | --remove-workspace <名前>\n        mdgrid --print-config\n        mdgrid --completions <シェル>\n        mdgrid --man\n\n  フォルダの中の Markdown のノートを行、フロントマターのキーを列にした表を開く。\n  .base を渡すと、その table ビューで開く(ノートはルートフォルダの下から探す)。\n  .md のファイルを渡すと、そのフォルダを開いてその行を選ぶ。\n  .csv・.tsv のファイルを渡すと、1行目を列の名前にした表として開く。\n  引数が無ければ今のフォルダを開く(places.toml に登録した表があれば、その一覧を重ねる)。\n  印 .mdgrid/workspace.toml の open に表を書いたフォルダは、その表を開く。\n\n  --view <名前>           .base のそのビューで開く(無ければ先頭のビュー。--print では mdgrid のビューも探す)\n  -w, --workspace <名前>  そのワークスペース(workspaces.toml)をリンクと関係マップの範囲にする\n                          (パスが無ければその最初の表を開く)\n  --page <名前>           そのワークスペースのページ([[page]])を、表を縦に並べた形で開く\n  --raw                   印の open の表ではなく、フォルダそのものを開く\n  --readonly              読むだけで開く(編集も保存もしない)\n  --no-color              色なしで出す\n  --config <パス>         この設定ファイルを読む(既定は $XDG_CONFIG_HOME/mdgrid/config.toml)\n  --continue              今のフォルダで最後に開いていた表とビューで開く(無ければ引数なしと同じ。\n                          tmux などで窓を立て直すときに使う)\n  -s, --session <名前>    その名前で保存したセッションの表示(表・ビュー・絞り込み・並び・列)で開く\n                          (パレットの「セッションを保存」で作る)\n  --sessions              保存したセッション(sessions.toml)の名前と開くフォルダを1行ずつ出す\n  --recent                画面で開いた表を新しい順に「パス(タブ)ビューの名前(タブ)最後に開いた日時」の\n                          1件1行で出す(最大 20 件)\n  --print                 画面を出さずに、ビューの表を標準出力に出す(ノートは書き換えない)\n  --format <形>           --print の形(csv・tsv・json・md。既定は csv)\n  --with-path             --print の表の先頭に、各行のノートのパスの列 path を足す(--pick path と同じ形)\n  --filter <式>           .base の式が真の行だけを --print に出す(何度でも。.base のビューでは、その絞り込みと両方)\n  --sort <列>[:desc]      --print をこの列で並べる(何度でも。ビューの並べ替えの代わり)\n  --count                 画面を出さずに、ビューの行の数(--filter のあと)を出す\n  --show-hidden           --print・--pick・--count で、hide = true の名前の条件([conditions])で隠す行も出す\n  --pick <path|列>        画面を端末に読むだけで出し、Enter で印の行(無ければ選んでいる行)のパスか\n  --notices               画面を出さずに、通知の欄([[notices]])の項目を1行ずつ出す(tmux の帯や\n                          シェルのプロンプトに)\n                          列の値を1行ずつ標準出力に出して終わる(q・Esc で取りやめ、終了コード 1)\n  --check                 画面を出さずに、ビューの行の型と決まり([rules])に合わない値を1行ずつ出す\n                          (パス:行: 列: 理由。あれば終了コード 1)\n  --apply <パス>          --print --with-path の形の CSV・JSON(- で標準入力)を読み、違うセルを変える(差分だけ出す)\n  --yes                   --apply で、差分を出すだけでなく書く\n  --workspaces            ワークスペース(workspaces.toml)の一覧を出す\n  --add-to <名前>         渡した表(無ければ今のフォルダ)をそのワークスペースに足す(無ければ作る。\n                          --as <名前> で表の名前)\n  --remove-from <名前>    渡した表(無ければ今のフォルダ)をそのワークスペースから外す\n  --remove-workspace <名前>  そのワークスペースを消す(ノートには触らない)\n  --init-workspace        フォルダ(無ければ今のフォルダ)にワークスペースの印 .mdgrid/workspace.toml を作る\n  --starter <名前>        --init-workspace で、そのスターター(組み込みか、設定のフォルダの starters/<名前>)から\n                          台帳(印とノートの雛形)を作る\n  --with-samples          --starter で、見本のノートも入れる\n  --starters              スターターの一覧(名前と1行の説明)を1行ずつ出す\n  --new-note <名前>       画面を出さずに、フォルダ(無ければ今のフォルダ)に新しいノート <名前>.md を作る\n                          (設定の [new_note] の folder・set・雛形を使い、作ったパスを1行出す。上書きしない)\n  --set <列>=<値>         --new-note で、その列の値を入れる(何度でも。リストの列は , で区切る。空の値は書かない)\n  --print-config          設定の全項目を既定値と説明付きの TOML で出す(docs/config.md)\n  --completions <シェル>  シェルの補完の定義を出す(bash・zsh・fish・elvish・powershell)\n  --man                   man ページ(roff)を出す\n  --help                  この案内を出す\n  --version               版を出す"


# ---- schema: 設定の項目の説明(--print-config のコメント。screen.locales-all-in-ledger) ----
## --print-config の頭の説明(行ごとに "# " を付けて出す)。
CfgPrintHead = "mdgrid の設定。全部の項目を既定の値で書いたもの。\n置き場: $XDG_CONFIG_HOME/mdgrid/config.toml(無ければ ~/.config/mdgrid/config.toml。\nWindows では %APPDATA%\\mdgrid\\config.toml)。\n「全体だけ」の項目はアプリ全体のもの。ほかは表のプロファイルで、ワークスペース・表・ビューごとにも\n書ける。\n起動のオプション: mdgrid --help。全部の説明: mdgrid のリポの docs/config.ja.md。"
## --print-config の書ける範囲の行。{0} は範囲の名前(CfgScopeGlobal・CfgScopeProfile)。
CfgScopeLine = "範囲: {0}。"
CfgScopeGlobal = "全体だけ"
CfgScopeProfile = "全体・ワークスペース・表・ビュー"
## --print-config の例の見出し。
CfgExampleLine = "例:"
## 設定の項目 `language` の説明(行の区切りは --print-config のコメントの行)。
CfgLanguage = "画面と起動の文言とこの説明の言語。\"auto\" か言語の符号(en・ja・de・es・fr・ko・pt-BR・zh-CN・zh-TW)。\n\"auto\" は LC_ALL・LC_MESSAGES・LANG の順で最初の空でない値から、言語と地域が合う台帳、無ければ言語が\n合う台帳を選び、どれも合わなければ英語。"
## 設定の項目 `editor` の説明(行の区切りは --print-config のコメントの行)。
CfgEditor = "選んだノートを開くエディタ(引数つきでよい。例 \"code -w\"。シェルは通さない)。無いか空(空白だけも)なら $VISUAL、$EDITOR、vi(Windows は notepad)の順。"
## 設定の項目 `poll_ms` の説明(行の区切りは --print-config のコメントの行)。
CfgPollMs = "mdgrid の外で変わったノートを読み直す間隔(ミリ秒)。"
## 設定の項目 `use` の説明(行の区切りは --print-config のコメントの行)。
CfgUse = "テンプレート [templates.<名前>] を、この場所に書いた値の下に敷く。"
## 設定の項目 `types` の説明(行の区切りは --print-config のコメントの行)。
CfgTypes = "列ごとの型。ルートフォルダの型の設定(.obsidian/types.json)と、値からの推定より優先する。\"auto\" は推定に戻す(狭い範囲で広い範囲の型を外せる)。型はセルの入力・合わない値の ! の印・並べ替え・列の見出しの型の印に効く。ノートは書き換えない。見出しの型の印のクリック、パレットか操作の一覧の column_type で型を選ぶと、views.toml の表に書く。"
## 設定の項目 `rules` の説明(行の区切りは --print-config のコメントの行)。
CfgRules = "列ごとの決まり。列の型と合わせて確かめる。required = true は、キーが無い・null・空の文字列・空のリストを問題にする。values は選べる値の並び(リストは各要素がこのどれか。大文字小文字を区別する)。狭い範囲が項目ごとに勝つ。問題には ! の印が付き、下の帯に数が出て、! と @ で跳べ、mdgrid --check で並べて出せる。決まりの確かめはノートを書き換えず、値を書くことも止めない。values のある列は、セルの入力の候補にその値を並べる。then は、その列をある値に直したとき、同じ行のほかの列にも値を入れる(値 = { 列 = 入れる文字 }。{date} などの雛形の変数を書け、空の文字はその列を空にする)。直した値と同じ変更としてたまり、一緒に取り消せる。計算の列(file.*・formula.*)には書けない。"
## 設定の項目 `terminal.color` の説明(行の区切りは --print-config のコメントの行)。
CfgTerminalColor = "色を使う。false で色なし(NO_COLOR・--no-color と同じ)。"
## 設定の項目 `terminal.ambiguous_wide` の説明(行の区切りは --print-config のコメントの行)。
CfgTerminalAmbiguousWide = "East Asian Ambiguous の文字(○・※ など)を幅2として扱う。端末が幅2で描くなら true。このとき窓の枠はいつも ASCII。"
## 設定の項目 `terminal.nerd_font` の説明(行の区切りは --print-config のコメントの行)。
CfgTerminalNerdFont = "丸い札の端(Nerd Font の字)を描いてよいか。true は端末の字形が Nerd Font。\"auto\" は、その字を字体に頼らず自分で描く端末(Ghostty・WezTerm)のときだけ(ほかの端末で字が化けないように)。描けなければ \"pill\" は \"soft\" で描く。"
## 設定の項目 `terminal.nerd_icons` の説明(行の区切りは --print-config のコメントの行)。
CfgTerminalNerdIcons = "設定のボタン・画面の型のボタンと窓・列の見出しの型の印・カレンダーの題に、アイコン用のフォント(Nerd Font)の記号を使う。端末の字形が Nerd Font のときだけ true にする。既定は字の記号(⚙・▦・◇・#・◷・⋮・◉・✓)。絵文字は使わない。"
## 設定の項目 `terminal.herdr` の説明(行の区切りは --print-config のコメントの行)。
CfgTerminalHerdr = "Herdr の窓で、今の表とビューで開き直す命令を Herdr に伝え、Herdr のサーバーを立て直したときに開き直してもらう。false で Herdr を呼ばない。"
## 設定の項目 `workspace.detect` の説明(行の区切りは --print-config のコメントの行)。
CfgWorkspaceDetect = "書いたワークスペースに入らない表を開いたとき、上にたどって、この目印のフォルダを持つ最寄りのフォルダ(ルートフォルダ)をワークスペースとみなす: \".obsidian\"(.obsidian/ のあるフォルダ)か \".git\"(git のリポ)。直下の、ノートのあるフォルダが関係マップの表になる。[] で検知しない。旧い値 \"vault\"・\"git\" も同じ意味で読み、警告する。"
## 設定の項目 `git.auto` の説明(行の区切りは --print-config のコメントの行)。
CfgGitAuto = "git のリポの中のノートを書いたあと、git をどこまで進めるか: \"off\" は何もしない、\"add\" は書いたノートをステージする、\"commit\" はさらにコミットする(書いたノートだけ。ほかの変更中のファイルやステージ済みのファイルは入れない)、\"push\" はさらに push する。git のリポでないフォルダでは何もしない。git が失敗したら1行で知らせ、保存そのものは済んだままにする。"
## 設定の項目 `git.when` の説明(行の区切りは --print-config のコメントの行)。
CfgGitWhen = "git.auto をいつ走らせるか: \"save\" は保存のたび(保存1回が1つのコミット)、\"quit\" は終了のときに1回(その起動の分をまとめて1つのコミット)。終了のときに残っているノートは、どちらでもそこで流す。"
## 設定の項目 `git.message` の説明(行の区切りは --print-config のコメントの行)。
CfgGitMessage = "コミットの文: \"auto\" は「mdgrid: N 件のノートを更新」とパスの一覧を書く。\"ask\" は保存のたびに1行の欄を出す(空なら自動の文。Esc はコミットせず、終了のときのコミットに回す)。"
## 設定の項目 `look.theme` の説明(行の区切りは --print-config のコメントの行)。
CfgLookTheme = "画面の色のテーマ。\"default\" は端末の色のまま。表 { light = …, dark = … } は端末の地の明るさで選び、\"auto\" は { light = \"saas\", dark = \"sumi\" } と同じ。色なしでは効かない。256 色の端末では近い色で塗る。"
## 設定の項目 `look.preset` の説明(行の区切りは --print-config のコメントの行)。
CfgLookPreset = "部品の形の組。[look.style] で部品を1つずつ上書きする。狭い範囲に書いた組は、広い範囲の部品の形を使わない。"
## 設定の項目 `look.mode` の説明(行の区切りは --print-config のコメントの行)。
CfgLookMode = "色を使うときの見た目: \"modern\"(lazygit のように、選びは背景の色、枠とキーはアクセントの色、説明は薄い色)か \"classic\"(反転)。画面の文字は同じ。色なしではどちらも classic。"
## 設定の項目 `look.cells` の説明(行の区切りは --print-config のコメントの行)。
CfgLookCells = "色を使うときの表のセルの見せ方: \"rich\"(真偽・リスト・くり返す短い値・リンク・列の型の印を [look.style] の形の部品で見せる)か \"plain\"(文字のまま)。色を使わない表示ではいつも文字のまま。"
## 設定の項目 `look.style` の説明(行の区切りは --print-config のコメントの行)。
CfgLookStyle = "組の部品の形を1つずつ上書きする: status(\"dot\"・\"shape\"・\"text\"・\"pill\"・\"tint\"・\"solid\"・\"soft\"・\"chip\"・\"plain\")・tags(\"dots\"・\"hash\"・\"brackets\"・\"pill\"・\"tint\"・\"solid\"・\"soft\"・\"chip\"・\"plain\")・check(\"box\"・\"tick\"・\"bracket\"・\"text\")・select(\"bar\"・\"cross\"・\"tint\"・\"outline\"・\"fill\"・\"reverse\")・rules(\"none\"・\"header\"・\"columns\"・\"grid\")・tabs(\"underline\"・\"pill\"・\"segment\"・\"brackets\"・\"dim\")・frames(\"rounded\"・\"square\"・\"heavy\"・\"ascii\"・\"none\")・band(\"keys\"・\"boxed\"・\"quiet\")・links(\"accent\"・\"plain\")・icons(true か false)。\"plain\"(check は \"text\")はその部品を文字のままにする。docs/catalog/index.html で全部の形を見比べ、この表を作れる。"
## 設定の項目 `look.columns` の説明(行の区切りは --print-config のコメントの行)。
CfgLookColumns = "列ごとの見せ方: \"rich\"・\"plain\"・\"chip\"(自動で札にならない列も札に)。列の設定は部品の形より優先。"
## 設定の項目 `look.colors` の説明(行の区切りは --print-config のコメントの行)。
CfgLookColors = "テーマの色を役割ごとに上書きする: background・text・header・selection・selection_text・band・band_text・accent・strong・zebra・zebra_text・mark・added・removed・pending・highlight。[look.colors.values] は値ごとの色(大文字・小文字によらない)で、部品のどの形でも使う。色は \"#rrggbb\"・\"#rgb\" か名前(black・white・gray・red・orange・yellow・green・teal・cyan・blue・purple・magenta・pink・brown)。theme = \"default\" では accent・selection と値の色だけを使う。狭い範囲に書いたテーマは、広い範囲の役割の色を使わない。"
## 設定の項目 `display.row_numbers` の説明(行の区切りは --print-config のコメントの行)。
CfgDisplayRowNumbers = "各行の左に、今の表示の並びの 1・2・3… の行番号。"
## 設定の項目 `display.zebra` の説明(行の区切りは --print-config のコメントの行)。
CfgDisplayZebra = "一行おきに背景の色を付ける(色を使わない表示では付けない)。"
## 設定の項目 `display.column_lines` の説明(行の区切りは --print-config のコメントの行)。
CfgDisplayColumnLines = "列の間に │ を引く。"
## 設定の項目 `display.group_gap` の説明(行の区切りは --print-config のコメントの行)。
CfgDisplayGroupGap = "2つ目からのまとまりの見出しの上に空きの行を1つ入れる。"
## 設定の項目 `display.tabs` の説明(行の区切りは --print-config のコメントの行)。
CfgDisplayTabs = "ビューのタブの行: \"always\"(いつも)・\"auto\"(ビューが2つ以上のときだけ。1つなら、その行も表に使う)・\"never\"(出さない)。どれでもタブの切り替えのキーは効く。"
## 設定の項目 `display.search_bar` の説明(行の区切りは --print-config のコメントの行)。
CfgDisplaySearchBar = "表の上に検索の欄を出す。false なら出さず、簡易の絞り込みは最下行で打つ。"
## 設定の項目 `display.chips` の説明(行の区切りは --print-config のコメントの行)。
CfgDisplayChips = "効いているビューの設定の帯を出す。隠しても f で帯の項目を選べる。"
## 設定の項目 `display.buttons` の説明(行の区切りは --print-config のコメントの行)。
CfgDisplayButtons = "ビューの帯の検索の欄と絞り込み・並べ替えのボタンの描き方: \"plain\"(地の色で示す)か \"box\"(それぞれを帯の上下の余白の行に引いた線で四角く囲む。中は塗らない)。余白が無い(display.bar_padding = 0)と線は描かない。"
## 設定の項目 `display.bar_padding` の説明(行の区切りは --print-config のコメントの行)。
CfgDisplayBarPadding = "ビューの帯の上下の余白の行の数: 0・0.5・1・1.5・2(1 と 1.0 のどちらも書ける)。0 なら帯は余白なしの1行。0.5 の端数は、帯の地の色で塗り外側の半分を画面の地の色の半分の塗りの字(上は ▀、下は ▄)で消した行で描き、帯の行に地の色を敷く。画面の地の色が分からない(テーマが画面の地を塗らず、端末も答えない)ときと、色を使わない表示と terminal.ambiguous_wide = true では、端数を1行の空き行に切り上げる。端末の高さが16行に満たないときと、検索の欄を出さないときは、いつも 0。ほかの値は警告して既定にする。"
## 設定の項目 `display.top_padding` の説明(行の区切りは --print-config のコメントの行)。
CfgDisplayTopPadding = "ヘッダーの上の余白の行の数: 0・0.5・1・1.5・2。端数は display.bar_padding と同じく描く(ヘッダーの上に ▀ の行、ヘッダーの行に帯の地の色)。端末の高さが16行に満たないときは、いつも 0。"
## 設定の項目 `display.row_extra_lines` の説明(行の区切りは --print-config のコメントの行)。
CfgDisplayRowExtraLines = "表の行を伸ばす行の数: 長い値や改行のある値は列の幅で折り返し、行を最大で「1 + この数」の行の高さまで伸ばす(行ごとに要るだけの高さ)。入りきらない分は最後に …。0 ならどの行も1行で、改行は …⏎ で示す。ほかの値は警告して既定にする。"
## 設定の項目 `display.note_path` の説明(行の区切りは --print-config のコメントの行)。
CfgDisplayNotePath = "左のノートの欄の出し方: \"common\" は全部の行に共通のフォルダを除き、\"name\" は名前だけ、\"full\" は根からのパス、\"off\" は名前を出さない(行の印だけ)。ほかの値は警告して既定にする。"
## 設定の項目 `display.tab_wrap` の説明(行の区切りは --print-config のコメントの行)。
CfgDisplayTabWrap = "ビューのタブがビューの帯の行に入らないとき、タブを全部、検索の欄とボタンの行の下に要る行の数だけ並べ、全部のタブを見せる(足した行のぶん表は下がる)。false なら1行のままで、狭い画面では今のでないタブを省く。"
## 設定の項目 `display.tab_wrap_gap` の説明(行の区切りは --print-config のコメントの行)。
CfgDisplayTabWrapGap = "tab_wrap でタブを下に並べたとき、検索の欄の行とその下のタブの行の間に空き行を1つ入れる。"
## 設定の項目 `display.note_name` の説明(行の区切りは --print-config のコメントの行)。
CfgDisplayNoteName = "ノートの欄の名前に当てる正規表現(note_path のあと。フォルダがあれば最後の名前の部分だけ)。一致したら、名前の付いた組 name、無ければ1つ目の組、組が無ければ一致した部分を除いた残りを出す。一致しない名前と、空になる名前はそのまま。\"\" は何もしない。読めない正規表現は警告して使わない。"
## 設定の項目 `dates.format` の説明(行の区切りは --print-config のコメントの行)。
CfgDatesFormat = "表の日付の見せ方と打ち込みの形。部品は YYYY・YY・MM・M・DD・D・ddd(曜日)と英数字でない区切り。ノートにはいつも YYYY-MM-DD で書く。"
## 設定の項目 `dates.week_start` の説明(行の区切りは --print-config のコメントの行)。
CfgDatesWeekStart = "日付のカレンダーの週の始まり。"
## 設定の項目 `edit.candidates` の説明(行の区切りは --print-config のコメントの行)。
CfgEditCandidates = "テキストのセルの編集で出す値の候補の上限。異なる値がこれより多い列は候補を出さない。"
## 設定の項目 `edit.add_frontmatter` の説明(行の区切りは --print-config のコメントの行)。
CfgEditAddFrontmatter = "フロントマターの無いノートと空のフロントマターのノートにも書く(フロントマターかキーの行を足す)。false ならこの2つは読むだけ。"
## 設定の項目 `new_note` の説明(行の区切りは --print-config のコメントの行)。
CfgNewNote = "表から新しいノートを作るときの決まり。mode(\"form\" は全部の欄を並べた窓、\"editor\" は作ってすぐエディタで開く)・folder(開いたフォルダからの相対)・name(名前の雛形)・ask(窓に出す列。既定は見えている列)・required(空では作らない列)・hidden(欄を出さずに値だけ入れる列)・body(本文の雛形のファイル)・[new_note.set](列 = 値)。雛形には {date}・{date+7}・{date:YYYY/MM/DD}・{time}・{now}・{weekday}・{name}・{folder} を書ける。ビューの絞り込みの値が先。この表は1つの項目で、狭い範囲に書けば丸ごと代わる。"
## 設定の項目 `keys` の説明(行の区切りは --print-config のコメントの行)。
CfgKeys = "モードごとのキーの割り当て直し。[keys.<モード>] の下に キー = 動作の名前。\"none\" でそのキーを外す。モードは table・edit・review・quit・help・palette・search・filter・detail・settings・settings_input・chips・list_select・menu・freq・sorts・relations・drawer・filter_window・filter_input・screen_menu・column_type・tree・gantt・kanban・chart・notice・switch・input_normal(vim モード)。動作の名前はコマンドのパレット(:)に出る。"
## 設定の項目 `keys.vim` の説明(行の区切りは --print-config のコメントの行)。
CfgKeysVim = "vim モード。入力の欄を挿入のモードで始め、Esc でノーマルのモードにする(h l 0 $ w b e・i a I A・x X dw db d$ D dd・cw c$ C cc・u)。表には dd(ノートを消す)・p(y・Y で写した値を入れる)・.(直前の値をもう一度)を足す。false ではキーを今のまま変えない。"
## 設定の項目 `search.across` の説明(行の区切りは --print-config のコメントの行)。
CfgSearchAcross = "コマンドのパレットに「ワークスペースを横断して探す」を足す。今のワークスペース(か登録した表)の全部の表の全部の行から語を探し、当たった行を表ごとに並べる。false(既定)ではパレットは今のまま。"
## 設定の項目 `templates` の説明(行の区切りは --print-config のコメントの行)。
CfgTemplates = "名前を付けたプロファイルの断片([look]・[display]・[dates]・[edit]・[new_note])。どの範囲でもuse = \"<名前>\" で、その範囲の値の下に敷く。同じ名前は ui.toml のものが config.toml より先。"
## 設定の項目 `conditions` の説明(行の区切りは --print-config のコメントの行)。
CfgConditions = "名前を付けた条件: 1回書いた式(expr)を名前で使う。どの式でも cond(\"<名前>\")、数字のキー(key = 1〜9)で当たる行だけにする、ビューの設定のフィルターの区画、hide = true でどの表でも当たる行を隠す。label は見せる名前。"
## 設定の項目 `notices` の説明(行の区切りは --print-config のコメントの行)。
CfgNotices = "ヘッダーの上の通知の欄(項目を書いたときだけ出す)。件数の項目は、名前の条件([conditions])に当たる行を今の表・ワークスペース・名前を挙げた表で数える。連絡の項目は、ノートの本文の頭の行を出す。mdgrid --notices も同じ行を出す。"


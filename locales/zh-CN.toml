# mdgrid の画面と起動の文言の台帳: 中国語(簡体字)(SR-23)。名前と並びは英語の台帳(en.toml)に合わせる。
# 1行に1つ `名前 = "文"`。`##` と `#` の行は英語の台帳の説明と区切りの写し(訳す手がかり。ビルドは読まない)。
# 差し込みの番号(`{0}` など)は英語の文と同じ組にする。


# ---- main: 使い方(CLI-2) ----
Usage = "用法：  mdgrid [<.base | 文件夹 | .md | .csv> ...] [--view <名称>] [-w <名称>] [--page <名称>] [--raw] [--readonly] [--no-color] [--config <路径>]\n        mdgrid [<.base | 文件夹 | .md> ...] --print [--format csv|tsv|json|md] [--with-path] [--view <名称>]\n                 [--filter <表达式>]... [--sort <列>[:desc]]...\n        mdgrid [<.base | 文件夹 | .md> ...] --pick path|<列> [--view <名称>]\n        mdgrid [<.base | 文件夹 | .md> ...] --check [--view <名称>]\n        mdgrid [<.base | 文件夹 | .md> ...] --count [--view <名称>] [--filter <表达式>]...\n        mdgrid [<.base | 文件夹> ...] --notices\n        mdgrid [<.base | 文件夹> ...] --notify\n        mdgrid [<.base | 文件夹> ...] --runs\n        mdgrid [<.base | 文件夹> ...] --apply <路径> [--yes]\n        mdgrid [<文件夹 | .base> ...] --add-to <名称> [--as <表名>] | --remove-from <名称>\n        mdgrid [<文件夹> ...] --init-workspace [--starter <名称> [--with-samples]]\n        mdgrid [<文件夹>] --new-note <名称> [--set <列>=<值>]...\n        mdgrid --continue [--readonly] [--no-color] [--config <路径>]\n        mdgrid -s <名称> [--readonly] [--no-color] [--config <路径>]\n        mdgrid --sessions\n        mdgrid --recent\n        mdgrid --starters\n        mdgrid --workspaces | --remove-workspace <名称>\n        mdgrid --print-config\n        mdgrid --completions <shell>\n        mdgrid --man\n\n  打开文件夹中 Markdown 笔记的表格：每篇笔记一行，每个 front matter 键\n  一列。给出 .base 时，打开它的 table 视图（在根文件夹下查找笔记）。\n  给出 .md 文件时，打开其所在文件夹并选中该笔记。\n  给出 .csv 或 .tsv 文件时，将其作为表格打开：文件的每一行为表格的一行，\n  第一行为列名。\n  不带参数时打开当前文件夹（若 places.toml 中登记了表格，则在上面叠加显示\n  其列表）。若文件夹中有标记 .mdgrid/workspace.toml 且其 \"open\" 指定了\n  表格，则改为打开该表格。\n\n  --view <名称>           以 .base 的该视图打开（省略时为第一个视图；\n                          --print 也会查找 mdgrid 视图）\n  -w, --workspace <名称>  以该工作区（workspaces.toml）作为链接和关系图的范围；\n                          未给出路径时打开其第一个表格\n  --page <名称>           打开工作区的该页面（[[page]]），其中的表格上下排列\n  --raw                   打开文件夹本身，而不是其标记的 \"open\" 所指定的表格\n  --readonly              以只读方式打开（不编辑、不保存）\n  --no-color              不使用颜色绘制\n  --config <路径>         读取此配置文件\n                          （默认：$XDG_CONFIG_HOME/mdgrid/config.toml）\n  --continue              打开此文件夹中上次显示的表格和视图（若没有，则与不带\n                          参数相同；用于 tmux 等恢复窗口）\n  -s, --session <名称>    打开以该名称保存的会话（其表格、视图、筛选、\n                          排序和列；在命令面板中用 \"保存会话\" 保存）\n  --sessions              逐行列出已保存的会话（sessions.toml）：名称和文件夹\n  --recent                按从新到旧逐行输出最近在界面中打开的表格，\n                          格式为 \"路径<TAB>视图名<TAB>最后打开时间\"（最多 20 个）\n  --print                 不显示界面，将视图的表格输出到标准输出\n                          （不修改笔记）\n  --format <格式>         --print 的格式（csv、tsv、json、md；默认 csv）\n  --with-path             在 --print 的开头加一列 \"path\"，内容为每行的笔记路径\n                          （与 --pick path 的路径相同）\n  --filter <表达式>       只保留 .base 表达式为真的行\n                          （可重复；用于 .base 视图时与其筛选同时生效）\n  --sort <列>[:desc]      按此列对 --print 排序（可重复；取代视图的\n                          排序）\n  --count                 不显示界面，输出视图的行数（--filter 之后）\n  --show-hidden           与 --print、--pick 或 --count 一起用时，保留被 hide = true 的\n                          条件（[conditions]）隐藏的行\n  --notices               不显示界面，逐行输出通知栏（[[notices]]）的项目\n                          （用于 tmux 状态栏或 shell 提示符）\n  --notify                不显示界面，检查一次 [[notify]] 的项目，通知新匹配的行\n                          （供定时任务调用；有通知未送达时退出码为 1）\n  --runs                  不显示界面，创建到期的例行事项（标记中 [[table]] 的 runs）的笔记，逐行输出创建的路径\n                          （从系统的定时任务调用；有未能创建的则退出码为 1）\n  --pick <path|列>        在终端上以只读方式显示界面；按 Enter 将标记的行\n                          （无标记时为选中的行）的路径或该列的值\n                          逐行输出到标准输出并退出\n                          （q 或 Esc 取消，退出码为 1）\n  --check                 逐行输出不符合列类型或规则（[rules]）的值\n                          （格式为 路径:行号: 列: 原因；若有这样的值，\n                          退出码为 1）\n  --apply <路径>          读取 --print --with-path 格式的 CSV 或 JSON（- 表示标准输入），\n                          修改不同的单元格；只显示差异\n  --yes                   与 --apply 一起用时，写入更改\n  --workspaces            列出工作区（workspaces.toml）\n  --add-to <名称>         将给出的表格（默认：当前文件夹）加入该工作区，\n                          必要时新建工作区；--as <名称> 指定表格名称\n  --remove-from <名称>    从该工作区移除给出的表格（默认：当前文件夹）\n  --remove-workspace <名称>  删除该工作区（不改动笔记）\n  --init-workspace        在文件夹中放置工作区标记 .mdgrid/workspace.toml\n                          （默认：当前文件夹）\n  --starter <名称>        与 --init-workspace 一起用时，从该预设创建台账（标记、笔记模板）：\n                          内置的预设，或配置文件夹中的 starters/<名称>\n  --with-samples          与 --starter 一起用时，同时加入预设的示例笔记\n  --starters              逐行列出预设（名称和一行说明）\n  --new-note <名称>       不显示界面，在文件夹（默认：当前文件夹）中新建笔记 <名称>.md，\n                          使用 [new_note]（folder、set、template）；输出所建的路径，\n                          绝不覆盖已有文件\n  --set <列>=<值>         与 --new-note 一起用时，在该列填入该值（可重复；列表的项\n                          用逗号分隔；空值不写入）\n  --print-config          以 TOML 输出全部配置项及其默认值\n                          和说明（docs/config.md）\n  --completions <shell>   输出 shell 补全脚本（bash、zsh、fish、elvish、powershell）\n  --man                   输出 man 手册页（roff）\n  --help                  显示此帮助\n  --version               显示版本"


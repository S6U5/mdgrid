SessionsBadToml = "无法读取 {0}（第 {1} 行）：{2}"
## {0} is the item that is needed.
RsnSessionNeeds = "已忽略：需要 {0}"
SessionNameEmpty = "会话名称为空"
SessionNameBad = "会话名称不能含有制表符、换行或其他控制字符"
## {0} is the name, {1} the saved names.
SessionUnknown = "没有会话 {0}（现有会话：{1}）"
## {0} is the name.
SessionNoneSaved = "没有会话 {0}（还没有保存任何会话；可在命令面板中用 \"保存会话\" 保存）"
## {0} is the session, {1} the path.
SessionMissingPath = "会话 {0} 要打开的 {1} 不存在"
## {0} is the session.
SessionNoPaths = "会话 {0} 没有要打开的文件夹（folders）"
SessionWithPaths = "-s（--session）不能与路径一起使用（由会话决定打开什么）"
CmdSaveSession = "保存会话"
AskSessionName = "会话名称："
## {0} is the session.
AskSessionOverwrite = "会话 {0} 已存在。要替换吗？(y/n) "
## {0} is the session.
SessionSaved = "已保存会话 {0}（用 mdgrid -s {0} 打开）"
## {0} is the reason.
SessionSaveError = "无法写入 sessions.toml：{0}"
SessionNoConfigDir = "无法保存会话：没有配置文件夹"
## {0} is the list of columns.
SessionMissingColumns = "会话的列 {0} 不在此表格中，因此跳过"
## {0} is the reason.
SessionBadExpr = "不使用会话的表达式筛选：{0}"
## {0} is the condition.
SessionNoCond = "会话的命名条件 {0} 不在配置中，因此不使用"

# ---- schema: 設定の項目の説明(--print-config のコメント。screen.locales-all-in-ledger) ----
## --print-config の頭の説明(行ごとに "# " を付けて出す)。
CfgPrintHead = "包含所有配置项及其默认值的 mdgrid 配置。\n位置：$XDG_CONFIG_HOME/mdgrid/config.toml（或 ~/.config/mdgrid/config.toml；\nWindows 上为 %APPDATA%\\mdgrid\\config.toml）。\n标为 \"仅全局\" 的项属于整个应用；其他项构成表格配置集，也可以\n按工作区、表格和视图分别写。\n选项：mdgrid --help。完整参考：mdgrid 仓库中的 docs/config.md。"
## --print-config の書ける範囲の行。{0} は範囲の名前(CfgScopeGlobal・CfgScopeProfile)。
CfgScopeLine = "范围：{0}。"
CfgScopeGlobal = "仅全局"
CfgScopeProfile = "全局、工作区、表格、视图"
## --print-config の例の見出し。
CfgExampleLine = "示例："
## 設定の項目 `language` の説明(行の区切りは --print-config のコメントの行)。
CfgLanguage = "界面、启动消息和这些说明的语言：\"auto\" 或语言代码\n(en, ja, de, es, fr, ko, pt-BR, zh-CN, zh-TW)。\"auto\" 依次查看 LC_ALL、LC_MESSAGES 和 LANG（取\n第一个非空值）：使用语言和地区都匹配的语言，否则使用语言匹配的，再否则使用英语。"
## 設定の項目 `editor` の説明(行の区切りは --print-config のコメントの行)。
CfgEditor = "打开选中笔记的编辑器（可带参数，例如 \"code -w\"；不经过\nshell 运行）。未设置或为空时：依次使用 $VISUAL、$EDITOR、vi（Windows 上为 notepad）。"
## 設定の項目 `poll_ms` の説明(行の区切りは --print-config のコメントの行)。
CfgPollMs = "重新读取在 mdgrid 之外被修改的笔记的间隔（毫秒）。"
## 設定の項目 `use` の説明(行の区切りは --print-config のコメントの行)。
CfgUse = "将模板 [templates.<名称>] 垫在此处所写的值之下。"
## 設定の項目 `types` の説明(行の区切りは --print-config のコメントの行)。
CfgTypes = "单个列的类型。优先于根文件夹的类型设置（.obsidian/types.json）\n和根据值的推断；\"auto\" 回到推断（较窄的范围可以撤销\n较宽范围的设置）。类型决定单元格的输入、不符合的值上的 ! 标记、排序和\n列标题的类型标记。不修改笔记。点击标题的类型标记，或\n在命令面板或操作菜单中使用 column_type，即可选择类型并将其写入\nviews.toml 中的表。"
## 設定の項目 `rules` の説明(行の区切りは --print-config のコメントの行)。
CfgRules = "单个列的规则，与列类型一起检查。required = true 会把\n缺少键、null、空字符串或空列表视为问题；values 列出允许的值\n（列表的每一项都必须是其中之一，区分大小写）。较窄的范围逐项优先。\n问题会带 ! 标记，底部栏显示其数量，! 和 @ 在问题之间跳转，\nmdgrid --check 会列出它们。检查规则从不修改笔记，也不会阻止你写入值；\n有 values 的列会在单元格输入中提供这些值。then 会在你把该列设为某个值时\n填写同一行的其他列（值 = { 列 = 文本 }；可以使用 {date} 等模板变量，\n空文本会清空该列）；它会与你的编辑一起暂存，并一起撤销。\n计算列（file.*、formula.*）不能有规则。\n按带 values 的列分组时，分组按其顺序排列（降序时相反）。icons 和 labels（值 = 文字）\n在分组标题和看板泳道标题中显示值的符号和名称（单元格、筛选、搜索和 --print 保持原值）。"
## 設定の項目 `terminal.color` の説明(行の区切りは --print-config のコメントの行)。
CfgTerminalColor = "使用颜色。false 则不使用颜色绘制（与 NO_COLOR 或 --no-color 相同）。"
## 設定の項目 `terminal.ambiguous_wide` の説明(行の区切りは --print-config のコメントの行)。
CfgTerminalAmbiguousWide = "将东亚宽度不明确（East Asian Ambiguous）的字符（如 ○ 和 ※）视为两列宽。\n如果终端将它们绘制为宽字符，请设为 true。此时窗口边框始终使用 ASCII。"
## 設定の項目 `terminal.nerd_font` の説明(行の区切りは --print-config のコメントの行)。
CfgTerminalNerdFont = "是否可以绘制圆头标签（Nerd Font 字形）。true：终端字体是 Nerd\nFont。\"auto\"：仅在自行绘制这些字形的终端（Ghostty、WezTerm）中绘制，\n以免在其他终端中显示错乱。没有圆头时，\"pill\" 按 \"soft\" 绘制。"
## 設定の項目 `terminal.nerd_icons` の説明(行の区切りは --print-config のコメントの行)。
CfgTerminalNerdIcons = "在设置按钮、界面类型按钮和菜单、列标题与关系图方框的类型标记和日历标题中\n使用 Nerd Font 的图标字形。仅当终端字体是 Nerd Font 时才设为 true；\n默认使用普通字符（⚙、▦、◇、#、◷、⋮、◉、✓、↪）。从不使用 emoji。"
## 設定の項目 `terminal.herdr` の説明(行の区切りは --print-config のコメントの行)。
CfgTerminalHerdr = "在 Herdr 窗格中，把重新打开当前表格和视图的命令告诉 Herdr，以便\nHerdr 在其服务器重启后重新打开它。false 则从不调用 Herdr。"
## 設定の項目 `workspace.detect` の説明(行の区切りは --print-config のコメントの行)。
CfgWorkspaceDetect = "当打开的表格不在任何已写的工作区中时，把其上层最近的、含有以下\n标记文件夹之一的文件夹视为工作区（根文件夹）：\".obsidian\"（含\n.obsidian/ 的文件夹）或 \".git\"（git 仓库）。其中含有笔记的文件夹成为\n关系图的表格。[] 关闭检测。旧值 \"vault\" 和 \"git\" 按同样方式\n读取，并给出警告。"
## 設定の項目 `git.auto` の説明(行の区切りは --print-config のコメントの行)。
CfgGitAuto = "mdgrid 在 git 仓库中写入笔记后对 git 执行到哪一步：\"off\" 什么都不做，\n\"add\" 暂存它写入的笔记，\"commit\" 还会提交它们（只提交这些笔记，从不提交其他\n已修改或已暂存的文件），\"push\" 还会推送。不是 git 仓库的文件夹\n不受影响。git 失败时用一行报告，保存本身仍然完成。"
## 設定の項目 `git.when` の説明(行の区切りは --print-config のコメントの行)。
CfgGitWhen = "git.auto 何时运行：\"save\" 在每次保存后（每次保存一个提交），\"quit\" 在 mdgrid\n退出时运行一次（整个会话一个提交）。退出时仍在等待的笔记总会在那时处理。"
## 設定の項目 `git.message` の説明(行の区切りは --print-config のコメントの行)。
CfgGitMessage = "提交信息：\"auto\" 写入 \"mdgrid: 更新 N 篇笔记\" 和路径；\"ask\" 在每次保存后\n打开一行输入框（留空则使用自动生成的信息，Esc 则把这些笔记留到\n退出时提交）。"
## 設定の項目 `look.theme` の説明(行の区切りは --print-config のコメントの行)。
CfgLookTheme = "界面的颜色主题。\"default\" 保留终端自身的颜色。表\n{ light = ..., dark = ... } 按终端的背景选择；\"auto\" 即\n{ light = \"saas\", dark = \"sumi\" }。不使用颜色时忽略；256 色终端使用\n最接近的颜色。"
## 設定の項目 `look.preset` の説明(行の区切りは --print-config のコメントの行)。
CfgLookPreset = "一整套部件形状。[look.style] 覆盖单个部件。写在\n较窄范围中的套组会丢弃写在较宽范围中的部件形状。"
## 設定の項目 `look.mode` の説明(行の区切りは --print-config のコメントの行)。
CfgLookMode = "使用颜色时的外观：\"modern\"（类似 lazygit：着色的选中项、强调色的边框和键、\n暗淡的说明）或 \"classic\"（反色显示）。屏幕上的文字相同；不使用颜色时两者\n看起来都像 classic。"
## 設定の項目 `look.cells` の説明(行の区切りは --print-config のコメントの行)。
CfgLookCells = "使用颜色时表格单元格的外观：\"rich\"（布尔值、列表、重复的短值、\n链接和列类型标记按 [look.style] 的形状绘制为部件）或 \"plain\"（按原样\n显示文本）。不使用颜色时单元格始终为 plain。"
## 設定の項目 `look.style` の説明(行の区切りは --print-config のコメントの行)。
CfgLookStyle = "覆盖套组中单个部件的形状：status（\"dot\", \"shape\", \"text\", \"pill\", \"tint\",\n\"solid\", \"soft\", \"chip\", \"plain\"）、tags（\"dots\", \"hash\", \"brackets\", \"pill\", \"tint\",\n\"solid\", \"soft\", \"chip\", \"plain\"）、check（\"box\", \"tick\", \"bracket\", \"text\"）、select\n（\"bar\", \"cross\", \"tint\", \"outline\", \"fill\", \"reverse\"）、rules（\"none\", \"header\",\n\"columns\", \"grid\"）、tabs（\"underline\", \"pill\", \"segment\", \"brackets\", \"dim\"）、frames\n（\"rounded\", \"square\", \"heavy\", \"ascii\", \"none\"）、band（\"keys\", \"boxed\", \"quiet\"）、links\n（\"accent\", \"plain\"）和 icons（true 或 false）。\"plain\"（check 为 \"text\"）让该部件保持为\n文本。docs/catalog/index.html 展示所有选项，并为你写出这个表。"
## 設定の項目 `look.columns` の説明(行の区切りは --print-config のコメントの行)。
CfgLookColumns = "单个列的外观：\"rich\"、\"plain\" 或 \"chip\"（即使该列未被识别为标签块，\n也显示为标签块）。列的设置优先于部件形状。"
## 設定の項目 `look.colors` の説明(行の区切りは --print-config のコメントの行)。
CfgLookColors = "按角色覆盖主题的颜色：background, text, header, selection, selection_text,\nband, band_text, accent, strong, zebra, zebra_text, mark, added, removed, pending 和\nhighlight。[look.colors.values] 为每个值设置颜色（不区分大小写），所有部件\n形状都会使用。颜色为 \"#rrggbb\"、\"#rgb\" 或名称（black, white, gray, red, orange,\nyellow, green, teal, cyan, blue, purple, magenta, pink, brown）。theme = \"default\" 时\n只使用 accent、selection 和值的颜色。写在较窄范围中的主题会丢弃\n写在较宽范围中的角色颜色。"
## 設定の項目 `display.row_numbers` の説明(行の区切りは --print-config のコメントの行)。
CfgDisplayRowNumbers = "在每行左侧按显示顺序编号 1、2、3..."
## 設定の項目 `display.zebra` の説明(行の区切りは --print-config のコメントの行)。
CfgDisplayZebra = "隔行加底色（不使用颜色时不加）。"
## 設定の項目 `display.column_lines` の説明(行の区切りは --print-config のコメントの行)。
CfgDisplayColumnLines = "在列之间画 │。"
## 設定の項目 `display.group_gap` の説明(行の区切りは --print-config のコメントの行)。
CfgDisplayGroupGap = "除第一个外，每个分组标题上方空一行。"
## 設定の項目 `display.tabs` の説明(行の区切りは --print-config のコメントの行)。
CfgDisplayTabs = "视图标签页那一行：\"always\"、\"auto\"（仅在有两个或以上视图时显示；只有一个视图时\n该行给表格使用）或 \"never\"。无论哪种，标签页的按键都有效。"
## 設定の項目 `display.search_bar` の説明(行の区切りは --print-config のコメントの行)。
CfgDisplaySearchBar = "在表格上方显示搜索栏。false 则隐藏；此时快速筛选在\n最底行输入。"
## 設定の項目 `display.chips` の説明(行の区切りは --print-config のコメントの行)。
CfgDisplayChips = "显示生效中的视图设置栏。隐藏时仍可用 f 选择其中的项。"
## 設定の項目 `display.buttons` の説明(行の区切りは --print-config のコメントの行)。
CfgDisplayButtons = "视图栏中搜索栏以及筛选和排序按钮的绘制方式：\"plain\"\n（用背景色表示）或 \"box\"（各自用线条框在视图栏的上下边距行中，\n不填充）。没有边距时（display.bar_padding = 0）不画线。"
## 設定の項目 `display.bar_padding` の説明(行の区切りは --print-config のコメントの行)。
CfgDisplayBarPadding = "视图栏上下的边距，以行为单位：0、0.5、1、1.5 或 2（1 和 1.0 都可以）。\n0 时视图栏占一行。半行用视图栏的背景色绘制，其外侧一半\n用屏幕背景色（主题的，或启动时向终端查询一次的）的半块字符（上方 ▀，下方 ▄）\n覆盖；当背景色未知、不使用颜色，或\nterminal.ambiguous_wide = true 时，向上取整为一个空行。\n终端低于 16 行，以及隐藏搜索栏时，始终使用 0。其他值会\n给出警告并使用默认值。"
## 設定の項目 `display.top_padding` の説明(行の区切りは --print-config のコメントの行)。
CfgDisplayTopPadding = "标题栏上方的边距，以行为单位：0、0.5、1、1.5 或 2。半行的绘制方式同\ndisplay.bar_padding（标题栏上方为 ▀，标题栏随之使用视图栏的背景色）。\n终端低于 16 行时始终使用 0。"
## 設定の項目 `display.row_extra_lines` の説明(行の区切りは --print-config のコメントの行)。
CfgDisplayRowExtraLines = "表格行最多可以增加的行数：含长值或含换行的值的行会\n按列宽折行，最多增高到 1 + 此数行（每行只取所需的高度）。\n放不下的部分以 … 结尾。0 让每行保持一行，换行\n显示为 …⏎。其他值会给出警告并使用默认值。"
## 設定の項目 `display.note_path` の説明(行の区切りは --print-config のコメントの行)。
CfgDisplayNotePath = "左侧笔记列显示每篇笔记的方式：\"common\" 去掉所有行共有的文件夹，\n\"name\" 只显示名称，\"full\" 显示从根开始的路径，\"off\" 不显示名称（只显示行标记）。\n其他值会给出警告并使用默认值。"
## 設定の項目 `display.tab_wrap` の説明(行の区切りは --print-config のコメントの行)。
CfgDisplayTabWrap = "视图标签页在视图栏那一行放不下时，把它们全部移到搜索框和按钮下方的行中，\n需要几行就用几行，使所有标签页都保持可见（表格随之下移相应的\n行数）。false 则保持一行，屏幕较窄时省略其他标签页。"
## 設定の項目 `display.tab_wrap_gap` の説明(行の区切りは --print-config のコメントの行)。
CfgDisplayTabWrapGap = "启用 tab_wrap 时，在搜索框那一行和其下方的标签页行之间空一行。"
## 設定の項目 `display.note_name` の説明(行の区切りは --print-config のコメントの行)。
CfgDisplayNoteName = "应用于笔记列中名称的正则表达式（在 note_path 之后；有文件夹时只作用于最后\n一部分）。匹配时，显示名为 name 的分组，否则显示第一个分组，否则显示\n去掉匹配部分后的名称。不匹配或会变为空的名称按原样显示。\"\" 不做\n任何设置。无法读取的表达式会给出警告且不使用。"
## 設定の項目 `dates.format` の説明(行の区切りは --print-config のコメントの行)。
CfgDatesFormat = "表格中日期的显示和输入格式。组成部分：YYYY、YY、MM、M、DD、D、ddd\n（星期）和非字母数字的分隔符。笔记中始终写作 YYYY-MM-DD。"
## 設定の項目 `dates.week_start` の説明(行の区切りは --print-config のコメントの行)。
CfgDatesWeekStart = "日期日历中每周的第一天。"
## 設定の項目 `edit.candidates` の説明(行の区切りは --print-config のコメントの行)。
CfgEditCandidates = "编辑文本单元格时提供的候选值的最大数量。\n不同值多于此数的列不提供候选。"
## 設定の項目 `edit.add_frontmatter` の説明(行の区切りは --print-config のコメントの行)。
CfgEditAddFrontmatter = "允许写入没有 front matter 或 front matter 为空的笔记（会添加 front matter 或键\n行）。false 则这些笔记为只读。"
## 設定の項目 `new_note` の説明(行の区切りは --print-config のコメントの行)。
CfgNewNote = "从表格新建笔记的方式：mode（\"form\"：包含所有字段的表单，或\n\"editor\"：创建后在编辑器中打开）、folder（相对于打开的文件夹）、name（名称\n模板）、ask（表单中的列；默认：可见的列）、required（必须\n填写的列）、hidden（不显示字段而直接写入的列）、body（正文模板文件）和\n[new_note.set]（列 = 值）。模板中可以使用 {date}、{date+7}、{date:YYYY/MM/DD}、\n{time}、{now}、{weekday}、{name} 和 {folder}。视图筛选中的值优先。\n此表是一个整体：在较窄范围中写入它会整体替换。 name_head（\"show\"：把填好的模板放进名称栏；\"hide\"：不显示，并加在输入的名称前面）。"
## 設定の項目 `keys` の説明(行の区切りは --print-config のコメントの行)。
CfgKeys = "按模式重新绑定按键：在 [keys.<模式>] 下写 键 = 操作名称。\n\"none\" 移除该键。模式：table, edit, review, quit, help, palette, search,\nfilter, detail, settings, settings_input, chips, list_select, menu, freq, sorts, relations, drawer, filter_window, filter_input, screen_menu, column_type, tree, gantt, kanban, chart, notice, switch,\ninput_normal（vim 模式）。操作名称显示在命令面板（:）中。"
## 設定の項目 `keys.vim` の説明(行の区切りは --print-config のコメントの行)。
CfgKeysVim = "vim 模式：输入框以插入模式开始，Esc 切换到普通模式（h l 0 $ w b e、\ni a I A、x X dw db d$ D dd、cw c$ C cc、u）。表格增加 dd（删除笔记）、p（放入\n用 y 或 Y 复制的值）和 .（重复上一个值）。false 则保持所有按键不变。"
## 設定の項目 `search.across` の説明(行の区切りは --print-config のコメントの行)。
CfgSearchAcross = "在命令面板中加入 \"跨工作区搜索\"：在当前工作区（或登记的表格）中每个\n表格的每一行中查找一个词，并按表格列出匹配的行。\nfalse（默认）则命令面板保持不变。"
## 設定の項目 `templates` の説明(行の区切りは --print-config のコメントの行)。
CfgTemplates = "配置集的命名片段（[look]、[display]、[dates]、[edit]、[new_note]）。在任何范围写\nuse = \"<名称>\" 即可将其垫在该范围的值之下。ui.toml 中的模板优先于 config.toml 中\n同名的模板。"
## 設定の項目 `conditions` の説明(行の区切りは --print-config のコメントの行)。
CfgConditions = "命名条件：写一次表达式（expr），按名称使用。可在任何表达式中用 cond(\"<名称>\")，\n用数字键（key = 1-9）只显示匹配的行，用于视图设置的筛选部分，\n以及用 hide = true 在所有表格中隐藏匹配的行。label 是显示的名称。"
## 設定の項目 `notices` の説明(行の区切りは --print-config のコメントの行)。
CfgNotices = "标题栏上方的通知栏，只在写了项目时显示。计数项统计表格、工作区或指定表格中\n匹配某个命名条件（[conditions]）的行数；笔记项显示\n笔记正文的前几行。mdgrid --notices 输出相同的行。"
## 設定の項目 `notify` の説明(行の区切りは --print-config のコメントの行)。
CfgNotify = "当某行新匹配命名条件（[conditions]）时，逐行通知到终端、桌面或你自己的命令。\n添加项目时已匹配的行会被静默记住；一次检查中新匹配的行超过 group_over 时合并为一条。\nmdgrid 打开期间由界面检查；mdgrid --notify 供定时任务检查一次。"


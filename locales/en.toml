PageSaved = "saved page \"{0}\" to {1}"
PageSaveError = "could not save the page: {0}"
PageSaveUnsure = "the file read back differently after the edit, so nothing was written (check the hand-written parts)"
PageNotWorkspace = "the current scope is not a workspace, so the page cannot be saved (create one with :workspace_new)"
PageNoStack = "no tables are stacked, so there is nothing to save as a page (stack one with :stack_add)"

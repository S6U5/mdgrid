PageUnknown = "no page \"{0}\" (pages: {1})"
PageNone = "no page \"{0}\" (this workspace has no pages)"
## {0} is the page, {1} the reasons.
PageOpenFailed = "some tables of page \"{0}\" could not be opened: {1}"
DrawerPage = "page"

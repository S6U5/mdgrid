# ---- schema: 設定の項目の説明(--print-config のコメント。screen.locales-all-in-ledger) ----
## --print-config の頭の説明(行ごとに "# " を付けて出す)。
CfgPrintHead = "mdgrid configuration with every item at its default value.\nLocation: $XDG_CONFIG_HOME/mdgrid/config.toml (or ~/.config/mdgrid/config.toml;\non Windows %APPDATA%\\mdgrid\\config.toml).\nItems marked \"global only\" belong to the whole app; the others form the table profile and can\nalso be written per workspace, table and view.\nOptions: mdgrid --help. Full reference: docs/config.md in the mdgrid repository."
## --print-config の書ける範囲の行。{0} は範囲の名前(CfgScopeGlobal・CfgScopeProfile)。
CfgScopeLine = "Scope: {0}."
CfgScopeGlobal = "global only"
CfgScopeProfile = "global, workspace, table, view"
## --print-config の例の見出し。
CfgExampleLine = "Example:"
## 設定の項目 `language` の説明(行の区切りは --print-config のコメントの行)。
CfgLanguage = "Language of the screen, startup messages and these descriptions: \"auto\" or a language code\n(en, ja, de, es, fr, ko, pt-BR, zh-CN, zh-TW). \"auto\" follows LC_ALL, LC_MESSAGES and LANG (the\nfirst non-empty one): the language and region that match, else the language, otherwise English."
## 設定の項目 `editor` の説明(行の区切りは --print-config のコメントの行)。
CfgEditor = "Editor that opens the selected note (arguments allowed, e.g. \"code -w\"; run without\na shell). Unset or blank: $VISUAL, then $EDITOR, then vi (notepad on Windows)."
## 設定の項目 `poll_ms` の説明(行の区切りは --print-config のコメントの行)。
CfgPollMs = "Interval in milliseconds for re-reading notes changed outside mdgrid."
## 設定の項目 `use` の説明(行の区切りは --print-config のコメントの行)。
CfgUse = "Lay the template [templates.<name>] under the values written in this place."
## 設定の項目 `types` の説明(行の区切りは --print-config のコメントの行)。
CfgTypes = "The type of single columns. It wins over the root folder's type settings (.obsidian/types.json)\nand over guessing from the values; \"auto\" goes back to guessing (a narrower scope can undo a\nwider one). The type sets the cell input, the ! mark on values that do not fit, sorting and the\ntype mark of the column heading. Notes are not changed. Clicking the type mark of a heading, or\ncolumn_type in the palette or the action menu, picks a type and writes it to the table in\nviews.toml."
## 設定の項目 `rules` の説明(行の区切りは --print-config のコメントの行)。
CfgRules = "Rules for single columns, checked together with the column type. required = true makes a\nmissing key, null, an empty string or an empty list a problem; values lists the allowed values\n(each item of a list must be one of them, case-sensitive). A narrower scope wins item by item.\nProblems get the ! mark, the bottom band counts them, ! and @ jump between them, and\nmdgrid --check lists them. Checking a rule never changes a note or stops you writing a value; a\ncolumn with values offers them in the cell input. then fills other columns of the same row when\nyou set the column to a value (value = { column = text }; template variables such as {date}\nwork, an empty text clears the column); it is staged with your edit and undone with it.\nComputed columns (file.*, formula.*) cannot have rules.\nGrouping by a column with values puts the groups in that order (reversed when descending). icons\nand labels (value = text) show a glyph and a name for a value in group headings and kanban lanes;\ncells, filters, search and --print keep the value."
## 設定の項目 `terminal.color` の説明(行の区切りは --print-config のコメントの行)。
CfgTerminalColor = "Use colors. false draws without colors (same as NO_COLOR or --no-color)."
## 設定の項目 `terminal.ambiguous_wide` の説明(行の区切りは --print-config のコメントの行)。
CfgTerminalAmbiguousWide = "Treat East Asian Ambiguous characters (such as ○ and ※) as two columns wide.\nSet true if your terminal draws them wide. Window frames are then always ASCII."
## 設定の項目 `terminal.nerd_font` の説明(行の区切りは --print-config のコメントの行)。
CfgTerminalNerdFont = "Whether round pill ends (Nerd Font glyphs) can be drawn. true: your terminal font is a Nerd\nFont. \"auto\": only in terminals that draw these glyphs themselves (Ghostty, WezTerm), so\nnothing breaks elsewhere. Without round ends, \"pill\" is drawn as \"soft\"."
## 設定の項目 `terminal.nerd_icons` の説明(行の区切りは --print-config のコメントの行)。
CfgTerminalNerdIcons = "Use icon glyphs from a Nerd Font for the settings button, the screen type button and menu, the\ntype marks of column headings and relation map boxes, and the calendar title. Set true only if\nyour terminal font is a Nerd Font; by default plain characters are used (⚙, ▦, ◇, #, ◷, ⋮, ◉, ✓,\n↪). Emoji are never used."
## 設定の項目 `terminal.herdr` の説明(行の区切りは --print-config のコメントの行)。
CfgTerminalHerdr = "Inside a Herdr pane, tell Herdr the command that reopens the current table and view, so that\nHerdr opens it again after its server restarts. false never calls Herdr."
## 設定の項目 `workspace.detect` の説明(行の区切りは --print-config のコメントの行)。
CfgWorkspaceDetect = "When the table you open is in no written workspace, treat the nearest folder above it that\nhas one of these marker folders as a workspace (the root folder): \".obsidian\" (a folder with\n.obsidian/) or \".git\" (a git repository). Its folders with notes become the tables of the\nrelation map. [] turns detection off. The old values \"vault\" and \"git\" are read the same\nway, with a warning."
## 設定の項目 `git.auto` の説明(行の区切りは --print-config のコメントの行)。
CfgGitAuto = "How far mdgrid goes with git after it writes notes in a git repository: \"off\" does nothing,\n\"add\" stages the notes it wrote, \"commit\" also commits them (only those notes, never other\nchanged or staged files), \"push\" also pushes. Folders that are not git repositories are\nleft alone. A git failure is reported in one line and the save itself stays done."
## 設定の項目 `git.when` の説明(行の区切りは --print-config のコメントの行)。
CfgGitWhen = "When git.auto runs: \"save\" after every save (one commit per save), \"quit\" once when mdgrid\nexits (one commit for the session). Notes still waiting at exit are always handled then."
## 設定の項目 `git.message` の説明(行の区切りは --print-config のコメントの行)。
CfgGitMessage = "The commit message: \"auto\" writes \"mdgrid: update N notes\" and the paths; \"ask\" opens a\none-line field after each save (empty uses the automatic message, Esc leaves the notes for\nthe commit at exit)."
## 設定の項目 `look.theme` の説明(行の区切りは --print-config のコメントの行)。
CfgLookTheme = "Color theme of the screen. \"default\" keeps the terminal's own colors. A table\n{ light = ..., dark = ... } picks by the terminal's background; \"auto\" is\n{ light = \"saas\", dark = \"sumi\" }. Ignored without colors; 256-color terminals get\nthe nearest colors."
## 設定の項目 `look.preset` の説明(行の区切りは --print-config のコメントの行)。
CfgLookPreset = "A whole set of part shapes. [look.style] overrides single parts. A preset written in a\nnarrower place drops the part shapes written in wider places."
## 設定の項目 `look.mode` の説明(行の区切りは --print-config のコメントの行)。
CfgLookMode = "The look when colors are on: \"modern\" (lazygit-like: tinted selection, accent borders and keys,\ndim labels) or \"classic\" (inverse video). The text on screen is the same; without colors both\nlook like classic."
## 設定の項目 `look.cells` の説明(行の区切りは --print-config のコメントの行)。
CfgLookCells = "How table cells look when colors are on: \"rich\" (booleans, lists, short repeated values,\nlinks and column type marks drawn as parts in the shapes of [look.style]) or \"plain\" (the\ntext as it is). Without colors cells are always plain."
## 設定の項目 `look.style` の説明(行の区切りは --print-config のコメントの行)。
CfgLookStyle = "Override single part shapes of the preset: status (\"dot\", \"shape\", \"text\", \"pill\", \"tint\",\n\"solid\", \"soft\", \"chip\", \"plain\"), tags (\"dots\", \"hash\", \"brackets\", \"pill\", \"tint\",\n\"solid\", \"soft\", \"chip\", \"plain\"), check (\"box\", \"tick\", \"bracket\", \"text\"), select\n(\"bar\", \"cross\", \"tint\", \"outline\", \"fill\", \"reverse\"), rules (\"none\", \"header\",\n\"columns\", \"grid\"), tabs (\"underline\", \"pill\", \"segment\", \"brackets\", \"dim\"), frames\n(\"rounded\", \"square\", \"heavy\", \"ascii\", \"none\"), band (\"keys\", \"boxed\", \"quiet\"), links\n(\"accent\", \"plain\") and icons (true or false). \"plain\" (\"text\" for check) keeps that part as\ntext. docs/catalog/index.html shows every choice and writes this table for you."
## 設定の項目 `look.columns` の説明(行の区切りは --print-config のコメントの行)。
CfgLookColumns = "How single columns look: \"rich\", \"plain\" or \"chip\" (chips even if the column is not\ndetected as one). A column setting wins over the part shapes."
## 設定の項目 `look.colors` の説明(行の区切りは --print-config のコメントの行)。
CfgLookColors = "Override the theme's colors by role: background, text, header, selection, selection_text,\nband, band_text, accent, strong, zebra, zebra_text, mark, added, removed, pending and\nhighlight. [look.colors.values] sets a color per value (case-insensitive), used by every part\nshape. Colors are \"#rrggbb\", \"#rgb\" or a name (black, white, gray, red, orange,\nyellow, green, teal, cyan, blue, purple, magenta, pink, brown). With theme = \"default\",\nonly accent, selection and value colors are used. A theme written in a narrower place drops\nthe role colors written in wider places."
## 設定の項目 `display.row_numbers` の説明(行の区切りは --print-config のコメントの行)。
CfgDisplayRowNumbers = "Numbers 1, 2, 3... on the left of each row, in the shown order."
## 設定の項目 `display.zebra` の説明(行の区切りは --print-config のコメントの行)。
CfgDisplayZebra = "Shade every other row (not without colors)."
## 設定の項目 `display.column_lines` の説明(行の区切りは --print-config のコメントの行)。
CfgDisplayColumnLines = "Draw │ between columns."
## 設定の項目 `display.group_gap` の説明(行の区切りは --print-config のコメントの行)。
CfgDisplayGroupGap = "An empty line above every group heading but the first."
## 設定の項目 `display.tabs` の説明(行の区切りは --print-config のコメントの行)。
CfgDisplayTabs = "The row of view tabs: \"always\", \"auto\" (only with two or more views; with one view the\ntable gets that row) or \"never\". The tab keys work either way."
## 設定の項目 `display.search_bar` の説明(行の区切りは --print-config のコメントの行)。
CfgDisplaySearchBar = "Show a search bar above the table. false hides it; the quick filter is then typed\non the bottom line."
## 設定の項目 `display.chips` の説明(行の区切りは --print-config のコメントの行)。
CfgDisplayChips = "Show the band of active view settings. f still picks its items when hidden."
## 設定の項目 `display.buttons` の説明(行の区切りは --print-config のコメントの行)。
CfgDisplayButtons = "How the search bar and the Filter and Sort buttons in the view bar are drawn: \"plain\"\n(shown by their background) or \"box\" (each in a box drawn with lines on the padding lines\nof the view bar, not filled). With no padding (display.bar_padding = 0) no lines are drawn."
## 設定の項目 `display.bar_padding` の説明(行の区切りは --print-config のコメントの行)。
CfgDisplayBarPadding = "Padding above and below the view bar, in lines: 0, 0.5, 1, 1.5 or 2 (1 and 1.0 both work).\n0 draws the view bar on one line. A half line gets the view bar's background color with its\nouter half covered by half blocks (▀ above, ▄ below) in the screen's background color (the\ntheme's, or the terminal's, asked once at startup); when that is unknown, without colors, and\nwith terminal.ambiguous_wide = true, it is rounded up to an empty line.\nTerminals shorter than 16 lines, and a hidden search bar, always use 0. Other values are\nwarned about and the default is used."
## 設定の項目 `display.top_padding` の説明(行の区切りは --print-config のコメントの行)。
CfgDisplayTopPadding = "Padding above the header, in lines: 0, 0.5, 1, 1.5 or 2. A half line is drawn like\ndisplay.bar_padding (▀ above the header, which then gets the view bar's background color).\nTerminals shorter than 16 lines always use 0."
## 設定の項目 `display.row_extra_lines` の説明(行の区切りは --print-config のコメントの行)。
CfgDisplayRowExtraLines = "How many extra lines a table row may grow by: a row holding a long value or a value with\nline breaks wraps it at the column width and grows up to 1 + this many lines (each row only\nas tall as it needs). What does not fit ends with …. 0 keeps every row on one line, with\nline breaks shown as …⏎. Other values are warned about and the default is used."
## 設定の項目 `display.note_path` の説明(行の区切りは --print-config のコメントの行)。
CfgDisplayNotePath = "How the note column on the left shows each note: \"common\" drops the folder shared by every row,\n\"name\" shows only the name, \"full\" the path from the root, and \"off\" no name (only the row marks).\nOther values are warned about and the default is used."
## 設定の項目 `display.tab_wrap` の説明(行の区切りは --print-config のコメントの行)。
CfgDisplayTabWrap = "When the view tabs do not fit on the row of the view bar, move them all to rows below the search box\nand the buttons, as many rows as they need, so every tab stays visible (the table moves down by those\nrows). false keeps one row and leaves out other tabs when the screen is narrow."
## 設定の項目 `display.tab_wrap_gap` の説明(行の区切りは --print-config のコメントの行)。
CfgDisplayTabWrapGap = "With tab_wrap, put one empty row between the row of the search box and the rows of tabs below it."
## 設定の項目 `display.note_name` の説明(行の区切りは --print-config のコメントの行)。
CfgDisplayNoteName = "A regular expression applied to the name in the note column (after note_path; with folders, to the last\npart only). When it matches, show the group named name, or else the first group, or else the name with\nthe match removed. A name that does not match, or would become empty, is shown as it is. \"\" sets\nnothing. An expression that cannot be read is warned about and not used."
## 設定の項目 `dates.format` の説明(行の区切りは --print-config のコメントの行)。
CfgDatesFormat = "How dates are shown and typed in the table. Parts: YYYY, YY, MM, M, DD, D, ddd\n(weekday) and non-alphanumeric separators. Notes are always written as YYYY-MM-DD."
## 設定の項目 `dates.week_start` の説明(行の区切りは --print-config のコメントの行)。
CfgDatesWeekStart = "First day of the week in the date calendar."
## 設定の項目 `edit.candidates` の説明(行の区切りは --print-config のコメントの行)。
CfgEditCandidates = "Maximum number of value candidates offered when editing a text cell.\nColumns with more distinct values offer no candidates."
## 設定の項目 `edit.add_frontmatter` の説明(行の区切りは --print-config のコメントの行)。
CfgEditAddFrontmatter = "Allow writing to notes with no front matter or an empty one (a front matter or a key\nline is added). false makes those notes read-only."
## 設定の項目 `new_note` の説明(行の区切りは --print-config のコメントの行)。
CfgNewNote = "How a new note is made from the table: mode (\"form\": a form with every field, or\n\"editor\": create and open in the editor), folder (relative to the opened folder), name (name\ntemplate), name_head (\"show\": put the filled template in the name field, or \"hide\": keep it\nout of the field and add it before the typed name), ask (the form's columns; default: the visible columns), required (columns that must\nbe filled), hidden (columns written without a field), body (a body template file) and\n[new_note.set] (column = value). Templates may use {date}, {date+7}, {date:YYYY/MM/DD},\n{time}, {now}, {weekday}, {name} and {folder}. Values from the view's filter come first.\nThe table is one item: a narrower place that writes it replaces it whole."
## 設定の項目 `keys` の説明(行の区切りは --print-config のコメントの行)。
CfgKeys = "Key rebinding per mode: under [keys.<mode>], write key = action name.\n\"none\" removes the key. Modes: table, edit, review, quit, help, palette, search,\nfilter, detail, settings, settings_input, chips, list_select, menu, freq, sorts, relations, drawer, filter_window, filter_input, screen_menu, column_type, tree, gantt, kanban, chart, notice, switch,\ninput_normal (vim mode). Action names are shown in the command palette (:)."
## 設定の項目 `keys.vim` の説明(行の区切りは --print-config のコメントの行)。
CfgKeysVim = "vim mode: input boxes start in insert mode and Esc switches them to normal mode (h l 0 $ w b e,\ni a I A, x X dw db d$ D dd, cw c$ C cc, u). The table gets dd (delete the note), p (put the value\ncopied with y or Y) and . (repeat the last value). false keeps every key as it is."
## 設定の項目 `search.across` の説明(行の区切りは --print-config のコメントの行)。
CfgSearchAcross = "Add \"Search across the workspace\" to the command palette: it looks for a word in every row of every\ntable in the current workspace (or the registered tables) and lists the matching rows per table.\nfalse (the default) leaves the palette as it is."
## 設定の項目 `templates` の説明(行の区切りは --print-config のコメントの行)。
CfgTemplates = "Named pieces of a profile ([look], [display], [dates], [edit], [new_note]). use = \"<name>\" in\nany place lays one under that place's values. ui.toml's template wins over config.toml's of\nthe same name."
## 設定の項目 `conditions` の説明(行の区切りは --print-config のコメントの行)。
CfgConditions = "Named conditions: an expression (expr) written once and used by name. cond(\"<name>\") in any\nexpression, a digit key (key = 1-9) that shows only the matching rows, the filter section of the\nview settings, and hide = true to hide the matching rows in every table. label is the name shown."
## 設定の項目 `notices` の説明(行の区切りは --print-config のコメントの行)。
CfgNotices = "The notice box above the header, shown only when items are written. A count item counts the rows that\nmatch a named condition ([conditions]) in the table, the workspace or named tables; a note item shows\nthe first lines of a note's body. mdgrid --notices prints the same lines."
## 設定の項目 `notify` の説明(行の区切りは --print-config のコメントの行)。
CfgNotify = "Notify when a row newly matches a named condition ([conditions]), one notification per row, to the\nterminal, the desktop or your own command. Rows already matching when you add an item are remembered\nsilently; more new rows than group_over in one check become one notification. Checked while mdgrid is\nopen; mdgrid --notify checks once for a scheduled run."


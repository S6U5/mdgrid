# mdgrid の画面と起動の文言の台帳: 英語(SR-23)。文言の名前と並びの正本。
# 1行に1つ `名前 = "文"`(TOML の基本の文字列)。`##` の行は次の文言の説明(コードの文書になる)、`#` の行は区切り。
# 差し込みは `{0}`・`{1}` の番号。ほかの言語の台帳は同じ名前を全部持ち、同じ番号を使う(欠け・余り・空・番号の
# 食い違いはビルドで落ちる。build.rs・src/ledger.rs)。


# ---- main: 使い方(CLI-2) ----
Usage = "Usage: mdgrid [<.base | folder | .md | .csv> ...] [--view <name>] [-w <name>] [--page <name>] [--raw] [--readonly] [--no-color] [--config <path>]\n        mdgrid [<.base | folder | .md> ...] --print [--format csv|tsv|json|md] [--with-path] [--view <name>]\n                 [--filter <expression>]... [--sort <column>[:desc]]...\n        mdgrid [<.base | folder | .md> ...] --pick path|<column> [--view <name>]\n        mdgrid [<.base | folder | .md> ...] --check [--view <name>]\n        mdgrid [<.base | folder | .md> ...] --count [--view <name>] [--filter <expression>]...\n        mdgrid [<.base | folder> ...] --notices\n        mdgrid [<.base | folder> ...] --notify\n        mdgrid [<.base | folder> ...] --runs\n        mdgrid [<.base | folder> ...] --apply <path> [--yes]\n        mdgrid [<folder | .base> ...] --add-to <name> [--as <table name>] | --remove-from <name>\n        mdgrid [<folder> ...] --init-workspace [--starter <name> [--with-samples]]\n        mdgrid [<folder>] --new-note <name> [--set <column>=<value>]...\n        mdgrid --continue [--readonly] [--no-color] [--config <path>]\n        mdgrid -s <name> [--readonly] [--no-color] [--config <path>]\n        mdgrid --sessions\n        mdgrid --recent\n        mdgrid --starters\n        mdgrid --workspaces | --remove-workspace <name>\n        mdgrid --print-config\n        mdgrid --completions <shell>\n        mdgrid --man\n\n  Open a table of the Markdown notes in a folder: one row per note, one column per\n  front matter key. Given a .base, open its table view (notes are looked up under\n  the root folder). Given a .md file, open its folder with that note selected.\n  Given a .csv or .tsv file, open it as a table: one row per line, the first line\n  names the columns.\n  With no arguments, open the current folder (with the list of tables registered in\n  places.toml on top, if any). A folder with a marker .mdgrid/workspace.toml that names\n  a table in \"open\" opens that table instead.\n\n  --view <name>           open that view of the .base (the first view if omitted;\n                          --print also looks up mdgrid views)\n  -w, --workspace <name>  use that workspace (workspaces.toml) for links and the relation map;\n                          with no path, open its first table\n  --page <name>           open that page ([[page]]) of the workspace, with its tables stacked\n  --raw                   open the folder itself, not the table named in its marker's \"open\"\n  --readonly              open read-only (no editing, no saving)\n  --no-color              draw without colors\n  --config <path>         read this configuration file\n                          (default: $XDG_CONFIG_HOME/mdgrid/config.toml)\n  --continue              open the table and view last shown in this folder (as with no\n                          arguments if there is none; for tmux and similar window restores)\n  -s, --session <name>    open the session saved under that name (its table, view, filters,\n                          sort and columns; save one with \"Save session\" in the palette)\n  --sessions              list the saved sessions (sessions.toml): name and folder, one per line\n  --recent                print the tables recently opened on the screen, newest first, one per\n                          line as \"path<TAB>view name<TAB>last opened\" (up to 20)\n  --print                 print the view's table to standard output without the screen\n                          (notes are not changed)\n  --format <format>       format for --print (csv, tsv, json, md; default csv)\n  --with-path             add a first column \"path\" to --print with each row's note path\n                          (the same path as --pick path)\n  --filter <expression>   keep only the rows where the .base expression is true\n                          (repeatable; with a .base view, combined with its filters)\n  --sort <column>[:desc]  sort --print by this column (repeatable; replaces the sort\n                          of the view)\n  --count                 print the number of rows of the view (after --filter) without the screen\n  --show-hidden           with --print, --pick or --count, keep the rows hidden by conditions with\n                          hide = true ([conditions])\n  --notices               print the items of the notice box ([[notices]]) one per line, without the\n                          screen (for a tmux status line or a shell prompt)\n  --notify                check the [[notify]] items once without the screen and notify the rows that\n                          newly match (for a scheduled run; exit code 1 if one could not be sent)\n  --runs                  create the notes of the routine runs that are due ([[table]] runs in the marker) without the\n                          screen and print their paths (for a scheduled run; exit code 1 if one could not be created)\n  --pick <path|column>    show the screen read-only on the terminal; Enter prints the path\n                          or the column value of the marked rows (or the selected row),\n                          one per line, to standard output and exits\n                          (q or Esc cancels with exit code 1)\n  --check                 print the values that do not fit the column type or a rule\n                          ([rules]), one per line (path:line: column: reason; exit code 1\n                          if there are any)\n  --apply <path>          read a CSV or JSON in the --print --with-path form (- for stdin)\n                          and change the cells that differ; shows the diff only\n  --yes                   with --apply, write the changes\n  --workspaces            list the workspaces (workspaces.toml)\n  --add-to <name>         add the given tables (default: this folder) to that workspace,\n                          creating it if needed; --as <name> names the table\n  --remove-from <name>    remove the given tables (default: this folder) from that workspace\n  --remove-workspace <name>  delete that workspace (notes are not touched)\n  --init-workspace        put a workspace marker .mdgrid/workspace.toml in the folder\n                          (default: this folder)\n  --starter <name>        with --init-workspace, create a ledger (marker, note templates) from that\n                          starter: a built-in one, or starters/<name> in the config folder\n  --with-samples          with --starter, add the starter's sample notes too\n  --starters              list the starters, one per line (name and a one-line description)\n  --new-note <name>       create a new note <name>.md in the folder (default: this folder) without the\n                          screen, using [new_note] (folder, set, template); prints the created path\n                          and never overwrites\n  --set <column>=<value>  with --new-note, put that value in the column (repeatable; separate list\n                          items with commas; an empty value writes nothing)\n  --print-config          print every configuration item as TOML with its default value\n                          and a description (docs/config.md)\n  --completions <shell>   print shell completions (bash, zsh, fish, elvish, powershell)\n  --man                   print the man page (roff)\n  --help                  print this help\n  --version               print the version"


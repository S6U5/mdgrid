ReviewTableHead = " ── {0} ──"
WantPageList = "a list of pages ([[page]])"
WantPageTables = "a list of { table = \"<table>\", view = \"<view>\", height = <ratio> } tables"
RsnPageNeedTable = "it needs table (the name of a table), so it was ignored"

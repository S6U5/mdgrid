# mdgrid の画面と起動の文言の台帳: 英語(SR-23)。文言の名前と並びの正本。
# 1行に1つ `名前 = "文"`(TOML の基本の文字列)。`##` の行は次の文言の説明(コードの文書になる)、`#` の行は区切り。
# 差し込みは `{0}`・`{1}` の番号。ほかの言語の台帳は同じ名前を全部持ち、同じ番号を使う(欠け・余り・空・番号の
# 食い違いはビルドで落ちる。build.rs・src/ledger.rs)。


# ---- main: 使い方(CLI-2) ----
Usage = "Usage : mdgrid [<.base | dossier | .md | .csv> ...] [--view <nom>] [-w <nom>] [--page <nom>] [--table <nom>] [--raw] [--readonly] [--no-color] [--config <chemin>]\n        mdgrid [<.base | dossier | .md> ...] --print [--format csv|tsv|json|md] [--with-path] [--view <nom>]\n                 [--filter <expression>]... [--sort <colonne>[:desc]]...\n        mdgrid [<.base | dossier | .md> ...] --pick path|<colonne> [--view <nom>]\n        mdgrid [<.base | dossier | .md> ...] --check [--view <nom>]\n        mdgrid [<.base | dossier | .md> ...] --count [--view <nom>] [--filter <expression>]...\n        mdgrid [<.base | dossier> ...] --notices\n        mdgrid [<.base | dossier> ...] --notify\n        mdgrid [<.base | dossier> ...] --runs\n        mdgrid [<.base | dossier> ...] --apply <chemin> [--yes]\n        mdgrid [<dossier | .base> ...] --add-to <nom> [--as <nom de table>] | --remove-from <nom>\n        mdgrid [<dossier> ...] --init-workspace [--starter <nom> [--with-samples]]\n        mdgrid [<dossier>] --new-note <nom> [--set <colonne>=<valeur>]...\n        mdgrid --continue [--readonly] [--no-color] [--config <chemin>]\n        mdgrid -s <nom> [--readonly] [--no-color] [--config <chemin>]\n        mdgrid --sessions\n        mdgrid --recent\n        mdgrid --starters\n        mdgrid --workspaces | --remove-workspace <nom>\n        mdgrid --print-config\n        mdgrid --completions <shell>\n        mdgrid --man\n\n  Ouvre sous forme de table les notes Markdown d'un dossier : une ligne par note, une colonne\n  par clé du front matter. Avec un .base, ouvre sa vue table (les notes sont cherchées sous le\n  dossier racine). Avec un fichier .md, ouvre son dossier en sélectionnant cette note.\n  Avec un fichier .csv ou .tsv, l'ouvre comme une table : une ligne par ligne du fichier, la\n  première ligne donne les noms des colonnes.\n  Sans argument, ouvre le dossier courant (avec par-dessus la liste des tables inscrites dans\n  places.toml, s'il y en a). Un dossier dont le marqueur .mdgrid/workspace.toml nomme une table\n  dans \"open\" ouvre plutôt cette table.\n\n  --view <nom>              ouvre cette vue du .base (par défaut la première ;\n                            --print cherche aussi les vues mdgrid)\n  -w, --workspace <nom>     utilise cet espace de travail (workspaces.toml) pour les liens et la\n                            carte des relations ; sans chemin, ouvre sa première table\n  --page <nom>              ouvre cette page ([[page]]) de l'espace de travail, tables empilées\n  --table <nom>             ouvre la table de ce nom du marqueur .mdgrid/workspace.toml (avec -w, de l'espace de\n                            travail) au lieu de la table open ; aussi pour --print, --check, --new-note\n  --raw                     ouvre le dossier lui-même, pas la table du \"open\" de son marqueur\n  --readonly                ouvre en lecture seule (ni modification ni enregistrement)\n  --no-color                affiche sans couleurs\n  --config <chemin>         lit ce fichier de configuration\n                            (par défaut : $XDG_CONFIG_HOME/mdgrid/config.toml)\n  --continue                ouvre la table et la vue affichées en dernier dans ce dossier\n                            (comme sans argument s'il n'y en a pas ; pour restaurer des fenêtres\n                            tmux, etc.)\n  -s, --session <nom>       ouvre la session enregistrée sous ce nom (table, vue, filtres, tri et\n                            colonnes ; \"Enregistrer la session\" dans la palette en crée une)\n  --sessions                liste les sessions enregistrées (sessions.toml) : nom et dossier,\n                            une par ligne\n  --recent                  affiche les tables ouvertes récemment à l'écran, de la plus récente à\n                            la plus ancienne, une par ligne : \"chemin<TAB>nom de la\n                            vue<TAB>dernière ouverture\" (20 au plus)\n  --print                   écrit la table de la vue sur la sortie standard, sans écran\n                            (les notes ne sont pas modifiées)\n  --format <format>         format de --print (csv, tsv, json, md ; csv par défaut)\n  --with-path               ajoute à --print une première colonne \"path\" avec le chemin de la note\n                            de chaque ligne (le même chemin que --pick path)\n  --filter <expression>     ne garde que les lignes où l'expression .base est vraie\n                            (répétable ; avec une vue .base, s'ajoute à ses filtres)\n  --sort <colonne>[:desc]   trie --print selon cette colonne (répétable ; remplace le tri\n                            de la vue)\n  --count                   affiche le nombre de lignes de la vue (après --filter), sans écran\n  --show-hidden             avec --print, --pick ou --count, garde les lignes masquées par les\n                            conditions avec hide = true ([conditions])\n  --notices                 affiche les éléments de la zone d'avis ([[notices]]), un par ligne,\n                            sans écran (pour une barre d'état tmux ou une invite de shell)\n  --notify                  vérifie une fois les éléments de [[notify]], sans écran, et notifie les lignes\n                            qui se mettent à correspondre (exécution planifiée ; code 1 en cas d'échec)\n  --runs                    crée sans écran les notes des occurrences de routine à créer (runs de [[table]] dans le marqueur)\n                            et affiche leurs chemins (pour une exécution planifiée ; code 1 si l'une n'a pas pu être créée)\n  --pick <path|colonne>     affiche l'écran en lecture seule ; Enter écrit le chemin ou la valeur\n                            de la colonne des lignes marquées (ou de la ligne sélectionnée),\n                            une par ligne, sur la sortie standard puis quitte\n                            (q ou Esc annule avec le code de sortie 1)\n  --check                   affiche les valeurs non conformes au type de la colonne ou à une règle\n                            ([rules]), une par ligne (chemin:ligne: colonne: raison ; code de\n                            sortie 1 s'il y en a)\n  --apply <chemin>          lit un CSV ou un JSON au format de --print --with-path (- pour stdin)\n                            et modifie les cellules qui diffèrent ; affiche seulement le diff\n  --yes                     avec --apply, écrit les modifications\n  --workspaces              liste les espaces de travail (workspaces.toml)\n  --add-to <nom>            ajoute les tables données (par défaut : ce dossier) à cet espace de\n                            travail, en le créant si besoin ; --as <nom> nomme la table\n  --remove-from <nom>       retire les tables données (par défaut : ce dossier) de cet espace de\n                            travail\n  --remove-workspace <nom>  supprime cet espace de travail (les notes ne sont pas touchées)\n  --init-workspace          place un marqueur d'espace de travail .mdgrid/workspace.toml dans le\n                            dossier (par défaut : ce dossier)\n  --starter <nom>           avec --init-workspace, crée un registre (marqueur, modèles de notes) à\n                            partir de ce kit de démarrage : un kit intégré, ou starters/<nom> dans\n                            le dossier de configuration\n  --with-samples            avec --starter, ajoute aussi les notes d'exemple du kit\n  --starters                liste les kits de démarrage, un par ligne (nom et description courte)\n  --new-note <nom>          crée sans écran une note <nom>.md dans le dossier (par défaut : ce\n                            dossier) selon [new_note] (folder, set, template) ; affiche le chemin\n                            créé et n'écrase jamais\n  --set <colonne>=<valeur>  avec --new-note, met cette valeur dans la colonne (répétable ;\n                            éléments d'une liste séparés par des virgules ; une valeur vide\n                            n'écrit rien)\n  --print-config            affiche chaque élément de configuration en TOML avec sa valeur par\n                            défaut et une description (docs/config.md)\n  --completions <shell>     affiche les complétions du shell (bash, zsh, fish, elvish, powershell)\n  --man                     affiche la page de manuel (roff)\n  --help                    affiche cette aide\n  --version                 affiche la version"


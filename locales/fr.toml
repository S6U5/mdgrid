## 設定の項目 `language` の説明(行の区切りは --print-config のコメントの行)。
CfgLanguage = "Langue de l'écran, des messages de démarrage et de ces descriptions : \"auto\" ou un code de langue\n(en, ja, de, es, fr, ko, pt-BR, zh-CN, zh-TW). \"auto\" suit LC_ALL, LC_MESSAGES et LANG (la\npremière valeur non vide) : la langue et la région qui correspondent, sinon la langue, sinon\nl'anglais."
## 設定の項目 `editor` の説明(行の区切りは --print-config のコメントの行)。
CfgEditor = "Éditeur qui ouvre la note sélectionnée (arguments permis, par ex. \"code -w\" ; lancé sans shell).\nNon défini ou vide : $VISUAL, puis $EDITOR, puis vi (notepad sous Windows)."
## 設定の項目 `poll_ms` の説明(行の区切りは --print-config のコメントの行)。
CfgPollMs = "Intervalle en millisecondes pour relire les notes modifiées hors de mdgrid."
## 設定の項目 `use` の説明(行の区切りは --print-config のコメントの行)。
CfgUse = "Pose le modèle [templates.<nom>] sous les valeurs écrites à cet endroit."
## 設定の項目 `types` の説明(行の区切りは --print-config のコメントの行)。
CfgTypes = "Le type de colonnes particulières. Il l'emporte sur les réglages de type du dossier racine\n(.obsidian/types.json) et sur la déduction à partir des valeurs ; \"auto\" revient à la déduction\n(une portée plus étroite peut annuler une plus large). Le type détermine la saisie de la cellule,\nla marque ! sur les valeurs qui ne correspondent pas, le tri et la marque de type de l'en-tête de\ncolonne. Les notes ne sont pas modifiées. Cliquer sur la marque de type d'un en-tête, ou\ncolumn_type dans la palette ou le menu d'actions, choisit un type et l'écrit dans la table de\nviews.toml."
## 設定の項目 `rules` の説明(行の区切りは --print-config のコメントの行)。
CfgRules = "Règles pour des colonnes particulières, vérifiées avec le type de la colonne. required = true fait\nd'une clé manquante, de null, d'une chaîne vide ou d'une liste vide un problème ; values liste les\nvaleurs autorisées (chaque élément d'une liste doit en faire partie, casse comprise). Une portée\nplus étroite l'emporte élément par élément. Les problèmes reçoivent la marque !, le bandeau du bas\nles compte, ! et @ sautent de l'un à l'autre, et mdgrid --check les liste. Vérifier une règle ne\nmodifie jamais une note et n'empêche jamais d'écrire une valeur ; une colonne avec values les\npropose dans la saisie de la cellule. then remplit d'autres colonnes de la même ligne quand vous\ndonnez une valeur à la colonne (valeur = { colonne = texte } ; les variables de modèle comme\n{date} fonctionnent, un texte vide efface la colonne) ; c'est mis en attente avec votre\nmodification et défait avec elle.\nLes colonnes calculées (file.*, formula.*) ne peuvent pas avoir de règles.\nRegrouper par une colonne avec values range les groupes dans cet ordre (inversé en ordre\ndécroissant). icons et labels (valeur = texte) affichent un symbole et un nom pour une valeur\ndans les en-têtes de groupe et les colonnes du kanban ; les cellules, les filtres, la recherche\net --print gardent la valeur."
## 設定の項目 `format` の説明(行の区切りは --print-config のコメントの行)。
CfgFormat = "Comment les nombres de colonnes particulières sont affichés. thousands = true groupe la partie\nentière par trois chiffres ; decimals est le nombre de décimales (0 à 10 ; celles qui manquent\nsont complétées par 0, celles en trop sont arrondies) ; prefix et suffix sont placés avant et\naprès le nombre (un nombre négatif met - avant le prefix). Les séparateurs suivent la langue de\nl'écran. Cela s'applique aux cellules, à la vue détaillée, à la ligne de résumé, aux sous-totaux\ndes en-têtes de groupe et aux valeurs des graphiques, mais pas aux résumés qui comptent ni aux\ngraphiques de décompte. Seul l'affichage change : les notes, le tri, les filtres, les formules,\nla saisie de la cellule et --print gardent le nombre. Les colonnes calculées (formula.*) peuvent\naussi en avoir. Une portée plus étroite l'emporte élément par élément."
## 設定の項目 `terminal.color` の説明(行の区切りは --print-config のコメントの行)。
CfgTerminalColor = "Utiliser les couleurs. false affiche sans couleurs (comme NO_COLOR ou --no-color)."
## 設定の項目 `terminal.ambiguous_wide` の説明(行の区切りは --print-config のコメントの行)。
CfgTerminalAmbiguousWide = "Traiter les caractères East Asian Ambiguous (comme ○ et ※) comme larges de deux colonnes. Mettre\ntrue si votre terminal les affiche larges. Les cadres des fenêtres sont alors toujours en ASCII."
## 設定の項目 `terminal.nerd_font` の説明(行の区切りは --print-config のコメントの行)。
CfgTerminalNerdFont = "Indique si les bouts ronds des pastilles (glyphes Nerd Font) peuvent être affichés. true : la\npolice de votre terminal est une Nerd Font. \"auto\" : seulement dans les terminaux qui affichent\neux-mêmes ces glyphes (Ghostty, WezTerm), pour que rien ne casse ailleurs. Sans bouts ronds,\n\"pill\" est affiché comme \"soft\"."
## 設定の項目 `terminal.nerd_icons` の説明(行の区切りは --print-config のコメントの行)。
CfgTerminalNerdIcons = "Utiliser des glyphes d'icônes d'une Nerd Font pour le bouton des réglages, le bouton et le menu du\ntype d'écran, les marques de type des en-têtes de colonne et des boîtes de la carte des relations,\net le titre du calendrier. Ne mettre true que si la police de votre terminal est une Nerd Font ;\npar défaut, des caractères simples sont utilisés (⚙, ▦, ◇, #, ◷, ⋮, ◉, ✓, ↪). Les emoji ne sont\njamais utilisés."
## 設定の項目 `terminal.herdr` の説明(行の区切りは --print-config のコメントの行)。
CfgTerminalHerdr = "Dans un panneau Herdr, donner à Herdr la commande qui rouvre la table et la vue actuelles, pour\nque Herdr la rouvre après le redémarrage de son serveur. false n'appelle jamais Herdr."
## 設定の項目 `workspace.detect` の説明(行の区切りは --print-config のコメントの行)。
CfgWorkspaceDetect = "Quand la table ouverte n'est dans aucun espace de travail écrit, traiter comme espace de travail\n(le dossier racine) le dossier le plus proche au-dessus d'elle qui contient l'un de ces dossiers\nmarqueurs : \".obsidian\" (un dossier avec .obsidian/) ou \".git\" (un dépôt git). Ses dossiers\ncontenant des notes deviennent les tables de la carte des relations. [] désactive la détection.\nLes anciennes valeurs \"vault\" et \"git\" sont lues de la même façon, avec un avertissement."
## 設定の項目 `git.auto` の説明(行の区切りは --print-config のコメントの行)。
CfgGitAuto = "Jusqu'où mdgrid va avec git après avoir écrit des notes dans un dépôt git : \"off\" ne fait rien,\n\"add\" indexe les notes écrites, \"commit\" les commite aussi (seulement ces notes, jamais d'autres\nfichiers modifiés ou indexés), \"push\" les pousse aussi. Les dossiers qui ne sont pas des dépôts\ngit ne sont pas touchés. Un échec de git est signalé en une ligne et l'enregistrement reste fait."
## 設定の項目 `git.when` の説明(行の区切りは --print-config のコメントの行)。
CfgGitWhen = "Quand git.auto s'exécute : \"save\" après chaque enregistrement (un commit par enregistrement),\n\"quit\" une fois à la sortie de mdgrid (un commit pour la session). Les notes encore en attente à\nla sortie sont toujours traitées à ce moment-là."
## 設定の項目 `git.message` の説明(行の区切りは --print-config のコメントの行)。
CfgGitMessage = "Le message de commit : \"auto\" écrit \"mdgrid: mise à jour de N notes\" et les chemins ; \"ask\" ouvre\nun champ d'une ligne après chaque enregistrement (vide utilise le message automatique, Esc laisse\nles notes pour le commit à la sortie)."
## 設定の項目 `look.theme` の説明(行の区切りは --print-config のコメントの行)。
CfgLookTheme = "Thème de couleurs de l'écran. \"default\" garde les couleurs du terminal. Une table\n{ light = ..., dark = ... } choisit selon le fond du terminal ; \"auto\" vaut\n{ light = \"saas\", dark = \"sumi\" }. Ignoré sans couleurs ; les terminaux 256 couleurs reçoivent les\ncouleurs les plus proches."
## 設定の項目 `look.preset` の説明(行の区切りは --print-config のコメントの行)。
CfgLookPreset = "Un jeu complet de formes d'éléments. [look.style] remplace des éléments particuliers. Un preset\nécrit à un endroit plus étroit abandonne les formes d'éléments écrites aux endroits plus larges."
## 設定の項目 `look.mode` の説明(行の区切りは --print-config のコメントの行)。
CfgLookMode = "L'apparence quand les couleurs sont activées : \"modern\" (à la lazygit : sélection teintée,\nbordures et touches accentuées, libellés atténués) ou \"classic\" (vidéo inverse). Le texte à\nl'écran est le même ; sans couleurs, les deux ressemblent à classic."
## 設定の項目 `look.cells` の説明(行の区切りは --print-config のコメントの行)。
CfgLookCells = "L'apparence des cellules de la table quand les couleurs sont activées : \"rich\" (booléens, listes,\nvaleurs courtes répétées, liens et marques de type de colonne dessinés comme des éléments aux\nformes de [look.style]) ou \"plain\" (le texte tel quel). Sans couleurs, les cellules sont toujours\nplain."
## 設定の項目 `look.style` の説明(行の区切りは --print-config のコメントの行)。
CfgLookStyle = "Remplace des formes d'éléments particuliers du preset : status (\"dot\", \"shape\", \"text\", \"pill\",\n\"tint\", \"solid\", \"soft\", \"chip\", \"plain\"), tags (\"dots\", \"hash\", \"brackets\", \"pill\", \"tint\",\n\"solid\", \"soft\", \"chip\", \"plain\"), check (\"box\", \"tick\", \"bracket\", \"text\"), select (\"bar\",\n\"cross\", \"tint\", \"outline\", \"fill\", \"reverse\"), rules (\"none\", \"header\", \"columns\", \"grid\"), tabs\n(\"underline\", \"pill\", \"segment\", \"brackets\", \"dim\"), frames (\"rounded\", \"square\", \"heavy\",\n\"ascii\", \"none\"), band (\"keys\", \"boxed\", \"quiet\"), links (\"accent\", \"plain\") et icons (true ou\nfalse). \"plain\" (\"text\" pour check) garde cet élément en texte. docs/catalog/index.html montre\nchaque choix et écrit cette table pour vous."
## 設定の項目 `look.columns` の説明(行の区切りは --print-config のコメントの行)。
CfgLookColumns = "L'apparence de colonnes particulières : \"rich\", \"plain\" ou \"chip\" (des pastilles même si la\ncolonne n'est pas détectée comme telle). Un réglage de colonne l'emporte sur les formes\nd'éléments."
## 設定の項目 `look.colors` の説明(行の区切りは --print-config のコメントの行)。
CfgLookColors = "Remplace les couleurs du thème par rôle : background, text, header, selection, selection_text,\nband, band_text, accent, strong, zebra, zebra_text, mark, added, removed, pending et highlight.\n[look.colors.values] donne une couleur par valeur (sans tenir compte de la casse), utilisée par\ntoutes les formes d'éléments. Les couleurs sont \"#rrggbb\", \"#rgb\" ou un nom (black, white, gray,\nred, orange, yellow, green, teal, cyan, blue, purple, magenta, pink, brown). Avec\ntheme = \"default\", seules les couleurs accent, selection et des valeurs sont utilisées. Un thème\nécrit à un endroit plus étroit abandonne les couleurs de rôle écrites aux endroits plus larges."
## 設定の項目 `display.row_numbers` の説明(行の区切りは --print-config のコメントの行)。
CfgDisplayRowNumbers = "Numéros 1, 2, 3... à gauche de chaque ligne, dans l'ordre affiché."
## 設定の項目 `display.zebra` の説明(行の区切りは --print-config のコメントの行)。
CfgDisplayZebra = "Ombrer une ligne sur deux (pas sans couleurs)."
## 設定の項目 `display.column_lines` の説明(行の区切りは --print-config のコメントの行)。
CfgDisplayColumnLines = "Tracer │ entre les colonnes."
## 設定の項目 `display.group_gap` の説明(行の区切りは --print-config のコメントの行)。
CfgDisplayGroupGap = "Une ligne vide au-dessus de chaque en-tête de groupe sauf le premier."
## 設定の項目 `display.tabs` の説明(行の区切りは --print-config のコメントの行)。
CfgDisplayTabs = "La rangée des onglets de vue : \"always\", \"auto\" (seulement avec deux vues ou plus ; avec une seule\nvue, la table prend cette rangée) ou \"never\". Les touches des onglets fonctionnent dans tous les\ncas."
## 設定の項目 `display.search_bar` の説明(行の区切りは --print-config のコメントの行)。
CfgDisplaySearchBar = "Afficher une barre de recherche au-dessus de la table. false la masque ; le filtre rapide se tape\nalors sur la ligne du bas."
## 設定の項目 `display.chips` の説明(行の区切りは --print-config のコメントの行)。
CfgDisplayChips = "Afficher le bandeau des réglages de vue actifs. f choisit encore ses éléments quand il est masqué."
## 設定の項目 `display.buttons` の説明(行の区切りは --print-config のコメントの行)。
CfgDisplayButtons = "Comment la barre de recherche et les boutons Filtrer et Trier de la barre de vue sont dessinés :\n\"plain\" (montrés par leur fond) ou \"box\" (chacun dans un cadre tracé avec des traits sur les\nlignes de marge de la barre de vue, non rempli). Sans marge (display.bar_padding = 0), aucun trait\nn'est tracé."
## 設定の項目 `display.bar_padding` の説明(行の区切りは --print-config のコメントの行)。
CfgDisplayBarPadding = "Marge au-dessus et au-dessous de la barre de vue, en lignes : 0, 0.5, 1, 1.5 ou 2 (1 et 1.0\nfonctionnent tous deux). 0 dessine la barre de vue sur une seule ligne. Une demi-ligne prend la\ncouleur de fond de la barre de vue, sa moitié extérieure étant couverte de demi-blocs (▀\nau-dessus, ▄ au-dessous) de la couleur de fond de l'écran (celle du thème, ou celle du terminal,\ndemandée une fois au démarrage) ; quand elle est inconnue, sans couleurs, et avec\nterminal.ambiguous_wide = true, elle est arrondie à une ligne vide.\nLes terminaux de moins de 16 lignes, et une barre de recherche masquée, utilisent toujours 0. Les\nautres valeurs donnent un avertissement et la valeur par défaut est utilisée."
## 設定の項目 `display.top_padding` の説明(行の区切りは --print-config のコメントの行)。
CfgDisplayTopPadding = "Marge au-dessus de l'en-tête, en lignes : 0, 0.5, 1, 1.5 ou 2. Une demi-ligne est dessinée comme\npour display.bar_padding (▀ au-dessus de l'en-tête, qui prend alors la couleur de fond de la barre\nde vue).\nLes terminaux de moins de 16 lignes utilisent toujours 0."
## 設定の項目 `display.row_extra_lines` の説明(行の区切りは --print-config のコメントの行)。
CfgDisplayRowExtraLines = "De combien de lignes de texte une ligne de la table peut s'agrandir : une ligne qui contient une\nvaleur longue ou une valeur avec des sauts de ligne la renvoie à la largeur de la colonne et\ngrandit jusqu'à 1 + ce nombre de lignes (chaque ligne seulement aussi haute que nécessaire). Ce\nqui ne tient pas se termine par …. 0 garde chaque ligne sur une seule ligne de texte, les sauts de\nligne étant affichés …⏎. Les autres valeurs donnent un avertissement et la valeur par défaut est\nutilisée."
## 設定の項目 `display.note_path` の説明(行の区切りは --print-config のコメントの行)。
CfgDisplayNotePath = "Comment la colonne des notes à gauche montre chaque note : \"common\" retire le dossier commun à\ntoutes les lignes, \"name\" ne montre que le nom, \"full\" le chemin depuis la racine, et \"off\" aucun\nnom (seulement les marques de ligne).\nLes autres valeurs donnent un avertissement et la valeur par défaut est utilisée."
## 設定の項目 `display.tab_wrap` の説明(行の区切りは --print-config のコメントの行)。
CfgDisplayTabWrap = "Quand les onglets de vue ne tiennent pas sur la rangée de la barre de vue, les déplacer tous sur\ndes rangées sous la zone de recherche et les boutons, autant que nécessaire, pour que chaque\nonglet reste visible (la table descend d'autant de rangées). false garde une seule rangée et\nlaisse de côté d'autres onglets quand l'écran est étroit."
## 設定の項目 `display.tab_wrap_gap` の説明(行の区切りは --print-config のコメントの行)。
CfgDisplayTabWrapGap = "Avec tab_wrap, mettre une rangée vide entre la rangée de la zone de recherche et les rangées\nd'onglets en dessous."
## 設定の項目 `display.note_name` の説明(行の区切りは --print-config のコメントの行)。
CfgDisplayNoteName = "Une expression régulière appliquée au nom dans la colonne des notes (après note_path ; avec des\ndossiers, à la dernière partie seulement). Quand elle correspond, afficher le groupe nommé name,\nsinon le premier groupe, sinon le nom sans la partie correspondante. Un nom qui ne correspond pas,\nou qui deviendrait vide, est affiché tel quel. \"\" ne définit rien. Une expression illisible donne\nun avertissement et n'est pas utilisée."
## 設定の項目 `dates.format` の説明(行の区切りは --print-config のコメントの行)。
CfgDatesFormat = "Comment les dates sont affichées et tapées dans la table. Parties : YYYY, YY, MM, M, DD, D, ddd\n(jour de la semaine) et des séparateurs non alphanumériques. Les notes sont toujours écrites en\nYYYY-MM-DD."
## 設定の項目 `dates.week_start` の説明(行の区切りは --print-config のコメントの行)。
CfgDatesWeekStart = "Premier jour de la semaine, pour le calendrier des dates, les mots de date (cette semaine, la semaine prochaine), les semaines des graphiques, et les semaines et « cette semaine » du diagramme de Gantt."
## 設定の項目 `edit.candidates` の説明(行の区切りは --print-config のコメントの行)。
CfgEditCandidates = "Nombre maximal de valeurs candidates proposées en modifiant une cellule de texte.\nLes colonnes avec plus de valeurs distinctes ne proposent aucun candidat."
## 設定の項目 `edit.add_frontmatter` の説明(行の区切りは --print-config のコメントの行)。
CfgEditAddFrontmatter = "Permettre d'écrire dans les notes sans front matter ou avec un front matter vide (un front matter\nou une ligne de clé est ajouté). false met ces notes en lecture seule."
## 設定の項目 `new_note` の説明(行の区切りは --print-config のコメントの行)。
CfgNewNote = "Comment une nouvelle note est créée depuis la table : mode (\"form\" : un formulaire avec chaque\nchamp, ou \"editor\" : créer et ouvrir dans l'éditeur), folder (relatif au dossier ouvert), name\n(modèle de nom), ask (les colonnes du formulaire ; par défaut : les colonnes visibles), required\n(colonnes à remplir obligatoirement), hidden (colonnes écrites sans champ), body (un fichier\nmodèle de corps) et [new_note.set] (colonne = valeur). Les modèles peuvent utiliser {date},\n{date+7}, {date:YYYY/MM/DD}, {time}, {now}, {weekday}, {name} et {folder}. Les valeurs du filtre\nde la vue passent en premier. La table est un seul élément : un endroit plus étroit qui l'écrit la\nremplace entièrement. name_head (\"show\" : le modèle rempli apparaît dans le champ du nom ; \"hide\" : il n'apparaît pas et est ajouté devant le nom saisi)."
## 設定の項目 `keys` の説明(行の区切りは --print-config のコメントの行)。
CfgKeys = "Réaffectation des touches par mode : sous [keys.<mode>], écrire touche = nom d'action. \"none\"\nretire la touche. Modes : table, edit, review, quit, help, palette, search, filter, detail,\nsettings, settings_input, chips, list_select, menu, freq, sorts, relations, drawer, filter_window,\nfilter_input, screen_menu, column_type, tree, gantt, kanban, chart, notice, switch, input_normal\n(mode vim). Les noms d'action sont affichés dans la palette de commandes (:)."
## 設定の項目 `keys.vim` の説明(行の区切りは --print-config のコメントの行)。
CfgKeysVim = "Mode vim : les zones de saisie démarrent en mode insertion et Esc les passe en mode normal\n(h l 0 $ w b e, i a I A, x X dw db d$ D dd, cw c$ C cc, u). La table reçoit dd (supprimer la\nnote), p (coller la valeur copiée avec y ou Y) et . (répéter la dernière valeur). false garde\nchaque touche telle quelle."
## 設定の項目 `search.across` の説明(行の区切りは --print-config のコメントの行)。
CfgSearchAcross = "Ajoute \"Rechercher dans tout l'espace de travail\" à la palette de commandes : cherche un mot dans\nchaque ligne de chaque table de l'espace de travail actuel (ou des tables inscrites) et liste les\nlignes correspondantes par table. false (par défaut) laisse la palette telle quelle."
## 設定の項目 `templates` の説明(行の区切りは --print-config のコメントの行)。
CfgTemplates = "Morceaux de profil nommés ([look], [display], [dates], [edit], [new_note]). use = \"<nom>\" à\nn'importe quel endroit en pose un sous les valeurs de cet endroit. Le modèle de ui.toml l'emporte\nsur celui de même nom de config.toml."
## 設定の項目 `conditions` の説明(行の区切りは --print-config のコメントの行)。
CfgConditions = "Conditions nommées : une expression (expr) écrite une fois et utilisée par son nom. cond(\"<nom>\")\ndans n'importe quelle expression, une touche chiffre (key = 1-9) qui n'affiche que les lignes\ncorrespondantes, la section des filtres des réglages de vue, et hide = true pour masquer les\nlignes correspondantes dans chaque table. label est le nom affiché."
## 設定の項目 `notices` の説明(行の区切りは --print-config のコメントの行)。
CfgNotices = "La zone d'avis au-dessus de l'en-tête, affichée seulement quand des éléments sont écrits. Un\nélément de compte compte les lignes qui vérifient une condition nommée ([conditions]) dans la\ntable, l'espace de travail ou des tables nommées ; un élément de note affiche les premières lignes\ndu corps d'une note. mdgrid --notices affiche les mêmes lignes."
## 設定の項目 `notify` の説明(行の区切りは --print-config のコメントの行)。
CfgNotify = "Notifie quand une ligne se met à vérifier une condition nommée ([conditions]), une notification par\nligne, dans le terminal, sur le bureau ou via votre propre commande. Les lignes qui correspondent déjà à\nl'ajout de l'élément sont mémorisées en silence ; plus de nouvelles lignes que group_over en une\nvérification donnent une seule notification. Vérifié tant que mdgrid est ouvert ; mdgrid --notify\nvérifie une fois pour une exécution planifiée."

# ---- stack: tables stacked top to bottom and pages (stack.*) ----
SecStack = "Tables empilées"
KeyStackDown = "Table du dessous"
KeyStackUp = "Table du dessus"
KeyStackClose = "Fermer cette table"
KeyStackGrow = "Agrandir cette table d'une ligne"
KeyStackShrink = "Réduire cette table d'une ligne"
KeyStackCloseSave = "Enregistrer et fermer"
KeyStackCloseDiscard = "Abandonner et fermer"
CmdStackAdd = "Empiler une table en dessous"
CmdPageSave = "Enregistrer la disposition comme page"
## {0} is the most tables that can be stacked.
StackMax = "jusqu'à {0} tables peuvent être empilées"
StackNoRoom = "le terminal est trop bas pour empiler une autre table (chaque table a besoin de son titre et de 3 lignes)"
StackNoTables = "aucune autre table à empiler (les tables de cette portée sont déjà empilées)"
StackCloseOnly = "une seule table est ouverte, elle ne peut donc pas être fermée"

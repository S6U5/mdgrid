# mdgrid の画面と起動の文言の台帳: 英語(SR-23)。文言の名前と並びの正本。
# 1行に1つ `名前 = "文"`(TOML の基本の文字列)。`##` の行は次の文言の説明(コードの文書になる)、`#` の行は区切り。
# 差し込みは `{0}`・`{1}` の番号。ほかの言語の台帳は同じ名前を全部持ち、同じ番号を使う(欠け・余り・空・番号の
# 食い違いはビルドで落ちる。build.rs・src/ledger.rs)。


# ---- main: 使い方(CLI-2) ----
Usage = "Aufruf: mdgrid [<.base | Ordner | .md | .csv> ...] [--view <Name>] [-w <Name>] [--page <Name>] [--raw] [--readonly] [--no-color] [--config <Pfad>]\n        mdgrid [<.base | Ordner | .md> ...] --print [--format csv|tsv|json|md] [--with-path] [--view <Name>]\n                 [--filter <Ausdruck>]... [--sort <Spalte>[:desc]]...\n        mdgrid [<.base | Ordner | .md> ...] --pick path|<Spalte> [--view <Name>]\n        mdgrid [<.base | Ordner | .md> ...] --check [--view <Name>]\n        mdgrid [<.base | Ordner | .md> ...] --count [--view <Name>] [--filter <Ausdruck>]...\n        mdgrid [<.base | Ordner> ...] --notices\n        mdgrid [<.base | Ordner> ...] --notify\n        mdgrid [<.base | Ordner> ...] --runs\n        mdgrid [<.base | Ordner> ...] --apply <Pfad> [--yes]\n        mdgrid [<Ordner | .base> ...] --add-to <Name> [--as <Tabellenname>] | --remove-from <Name>\n        mdgrid [<Ordner> ...] --init-workspace [--starter <Name> [--with-samples]]\n        mdgrid [<Ordner>] --new-note <Name> [--set <Spalte>=<Wert>]...\n        mdgrid --continue [--readonly] [--no-color] [--config <Pfad>]\n        mdgrid -s <Name> [--readonly] [--no-color] [--config <Pfad>]\n        mdgrid --sessions\n        mdgrid --recent\n        mdgrid --starters\n        mdgrid --workspaces | --remove-workspace <Name>\n        mdgrid --print-config\n        mdgrid --completions <Shell>\n        mdgrid --man\n\n  Öffnet die Markdown-Notizen eines Ordners als Tabelle: eine Zeile je Notiz, eine Spalte je\n  Front-Matter-Schlüssel. Mit einer .base öffnet mdgrid deren Tabellenansicht (die Notizen werden\n  unter dem Stammordner gesucht). Mit einer .md-Datei öffnet es deren Ordner und wählt diese Notiz\n  aus. Eine .csv- oder .tsv-Datei öffnet es als Tabelle: eine Zeile je Dateizeile, die erste Zeile\n  benennt die Spalten.\n  Ohne Argumente öffnet es den aktuellen Ordner (darüber die Liste der in places.toml registrierten\n  Tabellen, falls vorhanden). Ein Ordner mit einem Marker .mdgrid/workspace.toml, der unter \"open\"\n  eine Tabelle nennt, öffnet stattdessen diese Tabelle.\n\n  --view <Name>           diese Ansicht der .base öffnen (ohne Angabe die erste; --print sucht auch\n                          mdgrid-Ansichten)\n  -w, --workspace <Name>  diesen Workspace (workspaces.toml) für Links und die Beziehungskarte\n                          verwenden; ohne Pfad seine erste Tabelle öffnen\n  --page <Name>           diese Seite ([[page]]) des Workspace öffnen, mit untereinander gestapelten\n                          Tabellen\n  --raw                   den Ordner selbst öffnen, nicht die unter \"open\" im Marker genannte\n                          Tabelle\n  --readonly              schreibgeschützt öffnen (kein Bearbeiten, kein Speichern)\n  --no-color              ohne Farben zeichnen\n  --config <Pfad>         diese Konfigurationsdatei lesen\n                          (Standard: $XDG_CONFIG_HOME/mdgrid/config.toml)\n  --continue              die zuletzt in diesem Ordner gezeigte Tabelle und Ansicht öffnen (sonst\n                          wie ohne Argumente; zum Wiederherstellen von Fenstern mit tmux u. Ä.)\n  -s, --session <Name>    die unter diesem Namen gespeicherte Sitzung öffnen (Tabelle, Ansicht,\n                          Filter, Sortierung und Spalten; speichern mit \"Sitzung speichern\" in der\n                          Palette)\n  --sessions              die gespeicherten Sitzungen (sessions.toml) auflisten: Name und Ordner,\n                          eine pro Zeile\n  --recent                die zuletzt am Bildschirm geöffneten Tabellen ausgeben, neueste zuerst, je\n                          Zeile \"Pfad<TAB>Ansichtsname<TAB>zuletzt geöffnet\" (bis zu 20)\n  --print                 die Tabelle der Ansicht ohne Bildschirm auf die Standardausgabe schreiben\n                          (Notizen bleiben unverändert)\n  --format <Format>       Format für --print (csv, tsv, json, md; Standard csv)\n  --with-path             --print eine erste Spalte \"path\" mit dem Notizpfad jeder Zeile\n                          voranstellen (derselbe Pfad wie bei --pick path)\n  --filter <Ausdruck>     nur Zeilen behalten, für die der .base-Ausdruck wahr ist (wiederholbar;\n                          bei einer .base-Ansicht zusätzlich zu deren Filtern)\n  --sort <Spalte>[:desc]  --print nach dieser Spalte sortieren (wiederholbar; ersetzt die Sortierung\n                          der Ansicht)\n  --count                 die Zeilenzahl der Ansicht (nach --filter) ohne Bildschirm ausgeben\n  --show-hidden           mit --print, --pick oder --count auch die Zeilen behalten, die Bedingungen\n                          mit hide = true ([conditions]) ausblenden\n  --notices               die Einträge des Hinweisfelds ([[notices]]) ohne Bildschirm ausgeben,\n                          einen pro Zeile (für eine tmux-Statuszeile oder einen Shell-Prompt)\n  --notify                die Einträge von [[notify]] einmal ohne Bildschirm prüfen und neu passende\n                          Zeilen melden (für einen geplanten Lauf; Code 1, wenn etwas nicht ankam)\n  --runs                  die fälligen Routine-Durchläufe ([[table]] runs im Marker) ohne Bildschirm als Notizen anlegen\n                          und ihre Pfade ausgeben (für geplante Läufe; Exit-Code 1, wenn einer nicht angelegt werden konnte)\n  --pick <path|Spalte>    den Bildschirm schreibgeschützt im Terminal zeigen; Enter gibt den Pfad\n                          oder den Spaltenwert der markierten Zeilen (oder der gewählten Zeile)\n                          zeilenweise auf die Standardausgabe aus und beendet\n                          (q oder Esc bricht mit Exit-Code 1 ab)\n  --check                 die Werte ausgeben, die nicht zum Spaltentyp oder zu einer Regel ([rules])\n                          passen, einen pro Zeile (Pfad:Zeile: Spalte: Grund; Exit-Code 1, falls es\n                          welche gibt)\n  --apply <Pfad>          eine CSV oder JSON im Format von --print --with-path lesen (- für die\n                          Standardeingabe) und abweichende Zellen ändern; zeigt nur den Diff\n  --yes                   mit --apply die Änderungen schreiben\n  --workspaces            die Workspaces (workspaces.toml) auflisten\n  --add-to <Name>         die angegebenen Tabellen (Standard: dieser Ordner) zu diesem Workspace\n                          hinzufügen, der bei Bedarf angelegt wird; --as <Name> benennt die Tabelle\n  --remove-from <Name>    die angegebenen Tabellen (Standard: dieser Ordner) aus diesem Workspace\n                          entfernen\n  --remove-workspace <Name>  diesen Workspace löschen (Notizen bleiben unberührt)\n  --init-workspace        einen Workspace-Marker .mdgrid/workspace.toml in den Ordner legen\n                          (Standard: dieser Ordner)\n  --starter <Name>        mit --init-workspace eine Ablage (Marker, Notizvorlagen) aus diesem\n                          Starter anlegen: einem eingebauten oder starters/<Name> im\n                          Konfigurationsordner\n  --with-samples          mit --starter auch die Beispielnotizen des Starters hinzufügen\n  --starters              die Starter auflisten, einen pro Zeile (Name und einzeilige Beschreibung)\n  --new-note <Name>       ohne Bildschirm eine neue Notiz <Name>.md im Ordner (Standard: dieser\n                          Ordner) anlegen, mit [new_note] (folder, set, template); gibt den\n                          angelegten Pfad aus und überschreibt nie\n  --set <Spalte>=<Wert>   mit --new-note diesen Wert in die Spalte schreiben (wiederholbar;\n                          Listeneinträge durch Kommas trennen; ein leerer Wert schreibt nichts)\n  --print-config          jeden Konfigurationseintrag als TOML mit Standardwert und Beschreibung\n                          ausgeben (docs/config.md)\n  --completions <Shell>   Shell-Vervollständigungen ausgeben (bash, zsh, fish, elvish, powershell)\n  --man                   die Manpage ausgeben (roff)\n  --help                  diese Hilfe ausgeben\n  --version               die Version ausgeben"


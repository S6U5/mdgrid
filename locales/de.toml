# ---- schema: 設定の項目の説明(--print-config のコメント。screen.locales-all-in-ledger) ----
## --print-config の頭の説明(行ごとに "# " を付けて出す)。
CfgPrintHead = "mdgrid-Konfiguration mit jedem Eintrag auf seinem Standardwert.\nOrt: $XDG_CONFIG_HOME/mdgrid/config.toml (oder ~/.config/mdgrid/config.toml;\nunter Windows %APPDATA%\\mdgrid\\config.toml).\nEinträge mit \"nur global\" gelten für die ganze App; die übrigen bilden das Tabellenprofil und\nlassen sich auch je Workspace, Tabelle und Ansicht schreiben.\nOptionen: mdgrid --help. Vollständige Referenz: docs/config.md im mdgrid-Repository."
## --print-config の書ける範囲の行。{0} は範囲の名前(CfgScopeGlobal・CfgScopeProfile)。
CfgScopeLine = "Bereich: {0}."
CfgScopeGlobal = "nur global"
CfgScopeProfile = "global, Workspace, Tabelle, Ansicht"
## --print-config の例の見出し。
CfgExampleLine = "Beispiel:"
## 設定の項目 `language` の説明(行の区切りは --print-config のコメントの行)。
CfgLanguage = "Sprache des Bildschirms, der Startmeldungen und dieser Beschreibungen: \"auto\" oder ein Sprachcode\n(en, ja, de, es, fr, ko, pt-BR, zh-CN, zh-TW). \"auto\" folgt LC_ALL, LC_MESSAGES und LANG (dem\nersten nicht leeren Wert): passende Sprache und Region, sonst die Sprache, andernfalls Englisch."
## 設定の項目 `editor` の説明(行の区切りは --print-config のコメントの行)。
CfgEditor = "Editor, der die gewählte Notiz öffnet (Argumente erlaubt, z. B. \"code -w\"; ohne Shell ausgeführt).\nNicht gesetzt oder leer: $VISUAL, dann $EDITOR, dann vi (unter Windows notepad)."
## 設定の項目 `poll_ms` の説明(行の区切りは --print-config のコメントの行)。
CfgPollMs = "Intervall in Millisekunden, in dem außerhalb von mdgrid geänderte Notizen neu gelesen werden."
## 設定の項目 `use` の説明(行の区切りは --print-config のコメントの行)。
CfgUse = "Legt die Vorlage [templates.<Name>] unter die an dieser Stelle geschriebenen Werte."
## 設定の項目 `types` の説明(行の区切りは --print-config のコメントの行)。
CfgTypes = "Der Typ einzelner Spalten. Er hat Vorrang vor den Typeinstellungen des Stammordners\n(.obsidian/types.json) und vor dem Erraten aus den Werten; \"auto\" kehrt zum Erraten zurück (ein\nengerer Bereich kann einen weiteren aufheben). Der Typ bestimmt die Zelleingabe, die Markierung !\nbei unpassenden Werten, die Sortierung und das Typsymbol der Spaltenüberschrift. Notizen werden\nnicht geändert. Ein Klick auf das Typsymbol einer Überschrift oder column_type in der Palette oder\nim Aktionsmenü wählt einen Typ und schreibt ihn in die Tabelle in views.toml."
## 設定の項目 `rules` の説明(行の区切りは --print-config のコメントの行)。
CfgRules = "Regeln für einzelne Spalten, zusammen mit dem Spaltentyp geprüft. required = true macht einen\nfehlenden Schlüssel, null, eine leere Zeichenkette oder eine leere Liste zu einem Problem; values\nlistet die erlaubten Werte (jeder Eintrag einer Liste muss einer davon sein, Groß- und\nKleinschreibung zählen). Ein engerer Bereich gewinnt Eintrag für Eintrag. Probleme bekommen die\nMarkierung !, die untere Leiste zählt sie, ! und @ springen zwischen ihnen, und mdgrid --check\nlistet sie. Eine Regelprüfung ändert nie eine Notiz und hindert nie daran, einen Wert zu\nschreiben; eine Spalte mit values bietet sie in der Zelleingabe an. then füllt andere Spalten\nderselben Zeile, wenn die Spalte auf einen Wert gesetzt wird (value = { column = text };\nVorlagenvariablen wie {date} funktionieren, ein leerer Text leert die Spalte); das wird zusammen\nmit der Änderung vorgemerkt und mit ihr rückgängig gemacht. Berechnete Spalten (file.*, formula.*)\nkönnen keine Regeln haben.\nGruppieren nach einer Spalte mit values ordnet die Gruppen in dieser Reihenfolge (absteigend\numgekehrt). icons und labels (Wert = Text) zeigen für einen Wert ein Zeichen und einen Namen in\nGruppenüberschriften und Kanban-Spalten; Zellen, Filter, Suche und --print behalten den Wert."
## 設定の項目 `terminal.color` の説明(行の区切りは --print-config のコメントの行)。
CfgTerminalColor = "Farben verwenden. false zeichnet ohne Farben (wie NO_COLOR oder --no-color)."
## 設定の項目 `terminal.ambiguous_wide` の説明(行の区切りは --print-config のコメントの行)。
CfgTerminalAmbiguousWide = "Zeichen der Klasse East Asian Ambiguous (etwa ○ und ※) als zwei Spalten breit behandeln.\nAuf true setzen, wenn das Terminal sie breit zeichnet. Fensterrahmen sind dann immer ASCII."
## 設定の項目 `terminal.nerd_font` の説明(行の区切りは --print-config のコメントの行)。
CfgTerminalNerdFont = "Ob runde Pillenenden (Nerd-Font-Glyphen) gezeichnet werden können. true: die Terminalschrift ist\neine Nerd Font. \"auto\": nur in Terminals, die diese Glyphen selbst zeichnen (Ghostty, WezTerm),\ndamit anderswo nichts kaputtgeht. Ohne runde Enden wird \"pill\" als \"soft\" gezeichnet."
## 設定の項目 `terminal.nerd_icons` の説明(行の区切りは --print-config のコメントの行)。
CfgTerminalNerdIcons = "Icon-Glyphen aus einer Nerd Font für den Einstellungsknopf, Knopf und Menü der Darstellung, die\nTypsymbole der Spaltenüberschriften und der Kästen der Beziehungskarte und den Kalendertitel\nverwenden. Nur auf true setzen, wenn die Terminalschrift eine Nerd Font ist; standardmäßig werden\neinfache Zeichen verwendet (⚙, ▦, ◇, #, ◷, ⋮, ◉, ✓, ↪). Emoji werden nie verwendet."
## 設定の項目 `terminal.herdr` の説明(行の区切りは --print-config のコメントの行)。
CfgTerminalHerdr = "In einem Herdr-Bereich Herdr den Befehl mitteilen, der die aktuelle Tabelle und Ansicht wieder\nöffnet, damit Herdr sie nach einem Neustart seines Servers erneut öffnet. false ruft Herdr nie\nauf."
## 設定の項目 `workspace.detect` の説明(行の区切りは --print-config のコメントの行)。
CfgWorkspaceDetect = "Liegt die geöffnete Tabelle in keinem eingetragenen Workspace, gilt der nächste darüberliegende\nOrdner mit einem dieser Marker-Ordner als Workspace (der Stammordner): \".obsidian\" (ein Ordner mit\n.obsidian/) oder \".git\" (ein git-Repository). Seine Ordner mit Notizen werden die Tabellen der\nBeziehungskarte. [] schaltet die Erkennung aus. Die alten Werte \"vault\" und \"git\" werden mit einer\nWarnung genauso gelesen."
## 設定の項目 `git.auto` の説明(行の区切りは --print-config のコメントの行)。
CfgGitAuto = "Wie weit mdgrid mit git geht, nachdem es Notizen in einem git-Repository geschrieben hat: \"off\"\ntut nichts, \"add\" merkt die geschriebenen Notizen vor, \"commit\" committet sie auch (nur diese\nNotizen, nie andere geänderte oder vorgemerkte Dateien), \"push\" pusht auch. Ordner, die keine\ngit-Repositorys sind, bleiben unberührt. Ein git-Fehler wird in einer Zeile gemeldet, das\nSpeichern selbst bleibt erledigt."
## 設定の項目 `git.when` の説明(行の区切りは --print-config のコメントの行)。
CfgGitWhen = "Wann git.auto läuft: \"save\" nach jedem Speichern (ein Commit pro Speichern), \"quit\" einmal beim\nBeenden von mdgrid (ein Commit für die Sitzung). Notizen, die beim Beenden noch warten, werden\ndann immer erledigt."
## 設定の項目 `git.message` の説明(行の区切りは --print-config のコメントの行)。
CfgGitMessage = "Die Commit-Nachricht: \"auto\" schreibt \"mdgrid: N Notizen aktualisiert\" und die Pfade; \"ask\" öffnet\nnach jedem Speichern ein einzeiliges Feld (leer nimmt die automatische Nachricht, Esc lässt die\nNotizen für den Commit beim Beenden liegen)."
## 設定の項目 `look.theme` の説明(行の区切りは --print-config のコメントの行)。
CfgLookTheme = "Farbschema des Bildschirms. \"default\" behält die eigenen Farben des Terminals. Eine Tabelle\n{ light = ..., dark = ... } wählt nach dem Hintergrund des Terminals; \"auto\" ist\n{ light = \"saas\", dark = \"sumi\" }. Ohne Farben ignoriert; Terminals mit 256 Farben bekommen die\nnächstliegenden Farben."
## 設定の項目 `look.preset` の説明(行の区切りは --print-config のコメントの行)。
CfgLookPreset = "Ein ganzer Satz von Elementformen. [look.style] überschreibt einzelne Elemente. Ein Preset, das an\neiner engeren Stelle steht, verwirft die an weiteren Stellen geschriebenen Elementformen."
## 設定の項目 `look.mode` の説明(行の区切りは --print-config のコメントの行)。
CfgLookMode = "Das Aussehen bei eingeschalteten Farben: \"modern\" (wie lazygit: getönte Auswahl, Rahmen und Tasten\nin der Akzentfarbe, gedämpfte Beschriftungen) oder \"classic\" (inverse Darstellung). Der Text auf\ndem Bildschirm ist gleich; ohne Farben sehen beide wie classic aus."
## 設定の項目 `look.cells` の説明(行の区切りは --print-config のコメントの行)。
CfgLookCells = "Wie Tabellenzellen bei eingeschalteten Farben aussehen: \"rich\" (Wahrheitswerte, Listen, kurze\nwiederkehrende Werte, Links und Spaltentypsymbole als Elemente in den Formen von [look.style])\noder \"plain\" (der Text, wie er ist). Ohne Farben sind Zellen immer plain."
## 設定の項目 `look.style` の説明(行の区切りは --print-config のコメントの行)。
CfgLookStyle = "Einzelne Elementformen des Presets überschreiben: status (\"dot\", \"shape\", \"text\", \"pill\", \"tint\",\n\"solid\", \"soft\", \"chip\", \"plain\"), tags (\"dots\", \"hash\", \"brackets\", \"pill\", \"tint\", \"solid\",\n\"soft\", \"chip\", \"plain\"), check (\"box\", \"tick\", \"bracket\", \"text\"), select (\"bar\", \"cross\",\n\"tint\", \"outline\", \"fill\", \"reverse\"), rules (\"none\", \"header\", \"columns\", \"grid\"), tabs\n(\"underline\", \"pill\", \"segment\", \"brackets\", \"dim\"), frames (\"rounded\", \"square\", \"heavy\",\n\"ascii\", \"none\"), band (\"keys\", \"boxed\", \"quiet\"), links (\"accent\", \"plain\") und icons (true oder\nfalse). \"plain\" (\"text\" bei check) belässt dieses Element als Text. docs/catalog/index.html zeigt\njede Auswahl und erzeugt diese Tabelle."
## 設定の項目 `look.columns` の説明(行の区切りは --print-config のコメントの行)。
CfgLookColumns = "Wie einzelne Spalten aussehen: \"rich\", \"plain\" oder \"chip\" (Chips, auch wenn die Spalte nicht als\nsolche erkannt wird). Eine Spalteneinstellung gewinnt gegen die Elementformen."
## 設定の項目 `look.colors` の説明(行の区切りは --print-config のコメントの行)。
CfgLookColors = "Die Farben des Themes nach Rolle überschreiben: background, text, header, selection,\nselection_text, band, band_text, accent, strong, zebra, zebra_text, mark, added, removed, pending\nund highlight. [look.colors.values] setzt eine Farbe pro Wert (ohne Unterscheidung von Groß- und\nKleinschreibung), die jede Elementform verwendet. Farben sind \"#rrggbb\", \"#rgb\" oder ein Name\n(black, white, gray, red, orange, yellow, green, teal, cyan, blue, purple, magenta, pink, brown).\nMit theme = \"default\" werden nur accent, selection und die Wertfarben verwendet. Ein an engerer\nStelle geschriebenes Theme verwirft die an weiteren Stellen geschriebenen Rollenfarben."
## 設定の項目 `display.row_numbers` の説明(行の区切りは --print-config のコメントの行)。
CfgDisplayRowNumbers = "Nummern 1, 2, 3 ... links jeder Zeile, in der angezeigten Reihenfolge."
## 設定の項目 `display.zebra` の説明(行の区切りは --print-config のコメントの行)。
CfgDisplayZebra = "Jede zweite Zeile schattieren (nicht ohne Farben)."
## 設定の項目 `display.column_lines` の説明(行の区切りは --print-config のコメントの行)。
CfgDisplayColumnLines = "│ zwischen Spalten zeichnen."
## 設定の項目 `display.group_gap` の説明(行の区切りは --print-config のコメントの行)。
CfgDisplayGroupGap = "Eine Leerzeile über jedem Gruppenkopf außer dem ersten."
## 設定の項目 `display.tabs` の説明(行の区切りは --print-config のコメントの行)。
CfgDisplayTabs = "Die Zeile mit den Ansichtstabs: \"always\", \"auto\" (nur bei zwei oder mehr Ansichten; bei einer\nAnsicht bekommt die Tabelle diese Zeile) oder \"never\". Die Tab-Tasten funktionieren in jedem Fall."
## 設定の項目 `display.search_bar` の説明(行の区切りは --print-config のコメントの行)。
CfgDisplaySearchBar = "Eine Suchleiste über der Tabelle zeigen. false blendet sie aus; die Schnellsuche wird dann in der\nuntersten Zeile getippt."
## 設定の項目 `display.chips` の説明(行の区切りは --print-config のコメントの行)。
CfgDisplayChips = "Die Leiste der aktiven Ansichtseinstellungen zeigen. f wählt ihre Einträge auch, wenn sie\nausgeblendet ist."
## 設定の項目 `display.buttons` の説明(行の区切りは --print-config のコメントの行)。
CfgDisplayButtons = "Wie die Suchleiste und die Knöpfe Filter und Sortieren in der Ansichtsleiste gezeichnet werden:\n\"plain\" (durch ihren Hintergrund erkennbar) oder \"box\" (jeweils in einem Kasten aus Linien auf den\nAbstandszeilen der Ansichtsleiste, nicht gefüllt). Ohne Abstand (display.bar_padding = 0) werden\nkeine Linien gezeichnet."
## 設定の項目 `display.bar_padding` の説明(行の区切りは --print-config のコメントの行)。
CfgDisplayBarPadding = "Abstand über und unter der Ansichtsleiste in Zeilen: 0, 0.5, 1, 1.5 oder 2 (1 und 1.0 gehen\nbeide). 0 zeichnet die Ansichtsleiste in einer Zeile. Eine halbe Zeile bekommt die\nHintergrundfarbe der Ansichtsleiste, deren äußere Hälfte Halbblöcke (▀ oben, ▄ unten) in der\nHintergrundfarbe des Bildschirms verdecken (der des Themes oder des Terminals, einmal beim Start\nabgefragt); ist diese unbekannt, ohne Farben oder mit terminal.ambiguous_wide = true, wird sie zu\neiner ganzen Leerzeile aufgerundet.\nTerminals mit weniger als 16 Zeilen und eine ausgeblendete Suchleiste verwenden immer 0. Bei\nanderen Werten gibt es eine Warnung und der Standard gilt."
## 設定の項目 `display.top_padding` の説明(行の区切りは --print-config のコメントの行)。
CfgDisplayTopPadding = "Abstand über der Kopfzeile in Zeilen: 0, 0.5, 1, 1.5 oder 2. Eine halbe Zeile wird wie bei\ndisplay.bar_padding gezeichnet (▀ über der Kopfzeile, die dann die Hintergrundfarbe der\nAnsichtsleiste bekommt).\nTerminals mit weniger als 16 Zeilen verwenden immer 0."
## 設定の項目 `display.row_extra_lines` の説明(行の区切りは --print-config のコメントの行)。
CfgDisplayRowExtraLines = "Um wie viele Zeilen eine Tabellenzeile wachsen darf: eine Zeile mit einem langen Wert oder einem\nWert mit Zeilenumbrüchen bricht ihn an der Spaltenbreite um und wächst auf bis zu 1 + so viele\nZeilen (jede Zeile nur so hoch wie nötig). Was nicht passt, endet mit …. 0 hält jede Zeile\neinzeilig, Zeilenumbrüche werden als …⏎ gezeigt. Bei anderen Werten gibt es eine Warnung und der\nStandard gilt."
## 設定の項目 `display.note_path` の説明(行の区切りは --print-config のコメントの行)。
CfgDisplayNotePath = "Wie die Notizspalte links jede Notiz zeigt: \"common\" lässt den Ordner weg, den alle Zeilen teilen,\n\"name\" zeigt nur den Namen, \"full\" den Pfad ab dem Stamm und \"off\" keinen Namen (nur die\nZeilensymbole). Bei anderen Werten gibt es eine Warnung und der Standard gilt."
## 設定の項目 `display.tab_wrap` の説明(行の区切りは --print-config のコメントの行)。
CfgDisplayTabWrap = "Passen die Ansichtstabs nicht in die Zeile der Ansichtsleiste, kommen sie alle in Zeilen unter dem\nSuchfeld und den Knöpfen, so viele wie nötig, damit jeder Tab sichtbar bleibt (die Tabelle rückt\num diese Zeilen nach unten). false behält eine Zeile und lässt bei schmalem Bildschirm andere Tabs\nweg."
## 設定の項目 `display.tab_wrap_gap` の説明(行の区切りは --print-config のコメントの行)。
CfgDisplayTabWrapGap = "Mit tab_wrap eine Leerzeile zwischen der Zeile des Suchfelds und den Tab-Zeilen darunter einfügen."
## 設定の項目 `display.note_name` の説明(行の区切りは --print-config のコメントの行)。
CfgDisplayNoteName = "Ein regulärer Ausdruck für den Namen in der Notizspalte (nach note_path; bei Ordnern nur für den\nletzten Teil). Trifft er, wird die Gruppe namens name gezeigt, sonst die erste Gruppe, sonst der\nName ohne den Treffer. Ein Name, der nicht trifft oder leer würde, wird unverändert gezeigt. \"\"\nsetzt nichts. Ein nicht lesbarer Ausdruck wird mit einer Warnung nicht verwendet."
## 設定の項目 `dates.format` の説明(行の区切りは --print-config のコメントの行)。
CfgDatesFormat = "Wie Datumsangaben in der Tabelle gezeigt und eingegeben werden. Teile: YYYY, YY, MM, M, DD, D, ddd\n(Wochentag) und nicht-alphanumerische Trennzeichen. Notizen werden immer als YYYY-MM-DD\ngeschrieben."
## 設定の項目 `dates.week_start` の説明(行の区切りは --print-config のコメントの行)。
CfgDatesWeekStart = "Erster Wochentag im Datumskalender."
## 設定の項目 `edit.candidates` の説明(行の区切りは --print-config のコメントの行)。
CfgEditCandidates = "Höchstzahl der Wertvorschläge beim Bearbeiten einer Textzelle.\nSpalten mit mehr verschiedenen Werten bieten keine Vorschläge."
## 設定の項目 `edit.add_frontmatter` の説明(行の区切りは --print-config のコメントの行)。
CfgEditAddFrontmatter = "Schreiben in Notizen ohne oder mit leerem Front Matter erlauben (ein Front Matter oder eine\nSchlüsselzeile wird ergänzt). false macht diese Notizen schreibgeschützt."
## 設定の項目 `new_note` の説明(行の区切りは --print-config のコメントの行)。
CfgNewNote = "Wie eine neue Notiz aus der Tabelle entsteht: mode (\"form\": ein Formular mit allen Feldern, oder\n\"editor\": anlegen und im Editor öffnen), folder (relativ zum geöffneten Ordner), name\n(Namensvorlage), ask (die Spalten des Formulars; Standard: die sichtbaren Spalten), required\n(Spalten, die ausgefüllt sein müssen), hidden (Spalten, die ohne Feld geschrieben werden), body\n(eine Vorlagendatei für den Inhalt) und [new_note.set] (Spalte = Wert). Vorlagen können {date},\n{date+7}, {date:YYYY/MM/DD}, {time}, {now}, {weekday}, {name} und {folder} verwenden. Werte aus\ndem Filter der Ansicht kommen zuerst. Die Tabelle ist ein Eintrag: eine engere Stelle, die sie\nschreibt, ersetzt sie ganz. name_head (\"show\": die ausgefüllte Vorlage steht im Namensfeld; \"hide\": sie wird nicht gezeigt und vor den getippten Namen gesetzt)."
## 設定の項目 `keys` の説明(行の区切りは --print-config のコメントの行)。
CfgKeys = "Tastenbelegung je Modus: unter [keys.<Modus>] Taste = Aktionsname schreiben.\n\"none\" entfernt die Taste. Modi: table, edit, review, quit, help, palette, search, filter, detail,\nsettings, settings_input, chips, list_select, menu, freq, sorts, relations, drawer, filter_window,\nfilter_input, screen_menu, column_type, tree, gantt, kanban, chart, notice, switch, input_normal\n(vim-Modus). Die Aktionsnamen zeigt die Befehlspalette (:)."
## 設定の項目 `keys.vim` の説明(行の区切りは --print-config のコメントの行)。
CfgKeysVim = "vim-Modus: Eingabefelder starten im Einfügemodus, Esc wechselt in den Normalmodus (h l 0 $ w b e,\ni a I A, x X dw db d$ D dd, cw c$ C cc, u). Die Tabelle bekommt dd (Notiz löschen), p (mit y oder\nY kopierten Wert einfügen) und . (letzten Wert wiederholen). false lässt alle Tasten, wie sie\nsind."
## 設定の項目 `search.across` の説明(行の区切りは --print-config のコメントの行)。
CfgSearchAcross = "\"Im ganzen Workspace suchen\" zur Befehlspalette hinzufügen: sucht ein Wort in jeder Zeile jeder\nTabelle des aktuellen Workspace (oder der registrierten Tabellen) und listet die Treffer je\nTabelle. false (Standard) lässt die Palette, wie sie ist."
## 設定の項目 `templates` の説明(行の区切りは --print-config のコメントの行)。
CfgTemplates = "Benannte Teile eines Profils ([look], [display], [dates], [edit], [new_note]). use = \"<Name>\" legt\nan jeder Stelle eine Vorlage unter die Werte dieser Stelle. Die Vorlage aus ui.toml gewinnt gegen\ndie gleichnamige aus config.toml."
## 設定の項目 `conditions` の説明(行の区切りは --print-config のコメントの行)。
CfgConditions = "Benannte Bedingungen: ein Ausdruck (expr), einmal geschrieben und per Name verwendet:\ncond(\"<Name>\") in jedem Ausdruck, eine Zifferntaste (key = 1-9), die nur passende Zeilen zeigt,\nder Filterabschnitt der Ansichtseinstellungen und hide = true, um passende Zeilen in jeder Tabelle\nauszublenden. label ist der angezeigte Name."
## 設定の項目 `notices` の説明(行の区切りは --print-config のコメントの行)。
CfgNotices = "Das Hinweisfeld über der Kopfzeile, nur sichtbar, wenn Einträge geschrieben sind. Ein Zähleintrag\nzählt die Zeilen, die eine benannte Bedingung ([conditions]) erfüllen, in der Tabelle, dem\nWorkspace oder benannten Tabellen; ein Notizeintrag zeigt die ersten Zeilen des Inhalts einer\nNotiz. mdgrid --notices gibt dieselben Zeilen aus."
## 設定の項目 `notify` の説明(行の区切りは --print-config のコメントの行)。
CfgNotify = "Benachrichtigt, wenn eine Zeile neu eine benannte Bedingung ([conditions]) erfüllt, eine Nachricht pro\nZeile, an das Terminal, den Desktop oder einen eigenen Befehl. Beim Anlegen bereits passende Zeilen\nwerden still gemerkt; mehr neue Zeilen als group_over in einer Prüfung werden eine Nachricht. Geprüft\nwird, solange mdgrid offen ist; mdgrid --notify prüft einmal für einen geplanten Lauf."


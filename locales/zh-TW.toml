# ---- schema: 設定の項目の説明(--print-config のコメント。screen.locales-all-in-ledger) ----
## --print-config の頭の説明(行ごとに "# " を付けて出す)。
CfgPrintHead = "mdgrid 設定，所有項目皆為預設值。\n位置：$XDG_CONFIG_HOME/mdgrid/config.toml（或 ~/.config/mdgrid/config.toml；\nWindows 為 %APPDATA%\\mdgrid\\config.toml）。\n標示「僅全域」的項目屬於整個應用程式；其他項目構成表格設定組，也可以\n依工作區、表格與檢視分別寫入。\n選項：mdgrid --help。完整說明：mdgrid 儲存庫中的 docs/config.md。"
## --print-config の書ける範囲の行。{0} は範囲の名前(CfgScopeGlobal・CfgScopeProfile)。
CfgScopeLine = "範圍：{0}。"
CfgScopeGlobal = "僅全域"
CfgScopeProfile = "全域、工作區、表格、檢視"
## --print-config の例の見出し。
CfgExampleLine = "範例："
## 設定の項目 `language` の説明(行の区切りは --print-config のコメントの行)。
CfgLanguage = "畫面、啟動訊息與這些說明的語言：\"auto\" 或語言代碼\n（en、ja、de、es、fr、ko、pt-BR、zh-CN、zh-TW）。\"auto\" 依循 LC_ALL、LC_MESSAGES 與 LANG\n（第一個非空值）：選擇語言與地區相符者，其次為語言相符者，都不符則為英文。"
## 設定の項目 `editor` の説明(行の区切りは --print-config のコメントの行)。
CfgEditor = "開啟所選筆記的編輯器（可帶引數，例如 \"code -w\"；不經過\nshell 執行）。未設定或空白時：依序為 $VISUAL、$EDITOR、vi（Windows 為 notepad）。"
## 設定の項目 `poll_ms` の説明(行の区切りは --print-config のコメントの行)。
CfgPollMs = "重新讀取在 mdgrid 外變更之筆記的間隔（毫秒）。"
## 設定の項目 `use` の説明(行の区切りは --print-config のコメントの行)。
CfgUse = "將樣板 [templates.<名稱>] 鋪在此處所寫的值之下。"
## 設定の項目 `types` の説明(行の区切りは --print-config のコメントの行)。
CfgTypes = "單一欄位的型別。優先於根資料夾的型別設定（.obsidian/types.json）\n與從值推測的結果；\"auto\" 會回到推測（較窄的範圍可取消較寬範圍的\n設定）。型別決定儲存格的輸入方式、不符合之值的 ! 標示、排序與欄位標題的\n型別標示。不會修改筆記。點擊標題的型別標示，或在命令面板或動作選單使用\ncolumn_type，即可選擇型別並寫入 views.toml 的表。"
## 設定の項目 `rules` の説明(行の区切りは --print-config のコメントの行)。
CfgRules = "單一欄位的規則，與欄位型別一併檢查。required = true 會將缺少鍵、\nnull、空字串或空清單視為問題；values 列出允許的值（清單的每個項目都必須是\n其中之一，區分大小寫）。較窄的範圍逐項優先。\n問題會加上 ! 標示，底部列會計數，以 ! 與 @ 在問題之間跳轉，\nmdgrid --check 會列出問題。檢查規則絕不會修改筆記，也不會阻止你寫入值；\n有 values 的欄位會在儲存格輸入時提供這些值。then 會在你將該欄設為某個值時，\n填入同一列的其他欄位（值 = { 欄位 = 文字 }；可使用 {date} 等範本變數，\n空文字會清除該欄）；它會與你的編輯一起暫存，也一起復原。\n計算欄位（file.*、formula.*）不能設定規則。"
## 設定の項目 `terminal.color` の説明(行の区切りは --print-config のコメントの行)。
CfgTerminalColor = "使用色彩。false 不使用色彩繪製（與 NO_COLOR 或 --no-color 相同）。"
## 設定の項目 `terminal.ambiguous_wide` の説明(行の区切りは --print-config のコメントの行)。
CfgTerminalAmbiguousWide = "將東亞模糊寬度字元（如 ○ 與 ※）視為兩格寬。\n若終端機將它們繪製為寬字元，請設為 true。此時視窗框線一律使用 ASCII。"
## 設定の項目 `terminal.nerd_font` の説明(行の区切りは --print-config のコメントの行)。
CfgTerminalNerdFont = "是否可繪製圓角膠囊（Nerd Font 字符）。true：終端機字型為 Nerd\nFont。\"auto\"：僅在會自行繪製這些字符的終端機（Ghostty、WezTerm）中使用，\n以免在其他終端機中顯示錯亂。無法繪製圓角時，\"pill\" 會以 \"soft\" 繪製。"
## 設定の項目 `terminal.nerd_icons` の説明(行の区切りは --print-config のコメントの行)。
CfgTerminalNerdIcons = "在設定按鈕、畫面類型按鈕與選單、欄位標題的型別標示與行事曆標題中，\n使用 Nerd Font 的圖示字符。僅在終端機字型為 Nerd Font 時設為 true；\n預設使用一般字元（⚙、▦、◇、#、◷、⋮、◉、✓）。絕不使用表情符號。"
## 設定の項目 `terminal.herdr` の説明(行の区切りは --print-config のコメントの行)。
CfgTerminalHerdr = "在 Herdr 窗格中，告知 Herdr 重新開啟目前表格與檢視的指令，\n讓 Herdr 在其伺服器重新啟動後再次開啟。false 則絕不呼叫 Herdr。"
## 設定の項目 `workspace.detect` の説明(行の区切りは --print-config のコメントの行)。
CfgWorkspaceDetect = "當開啟的表格不在任何已寫入的工作區中時，將其上層最近一個含有下列標記\n資料夾的資料夾視為工作區（根資料夾）：\".obsidian\"（含 .obsidian/ 的資料夾）\n或 \".git\"（git 儲存庫）。其中含有筆記的資料夾會成為關聯圖的表格。\n[] 會關閉偵測。舊值 \"vault\" 與 \"git\" 也以相同方式讀取，\n並顯示警告。"
## 設定の項目 `git.auto` の説明(行の区切りは --print-config のコメントの行)。
CfgGitAuto = "mdgrid 在 git 儲存庫中寫入筆記後，要對 git 做到哪一步：\"off\" 不做任何事，\n\"add\" 暫存寫入的筆記，\"commit\" 另外提交（僅限這些筆記，絕不包含其他\n已變更或已暫存的檔案），\"push\" 另外推送。不是 git 儲存庫的資料夾\n不受影響。git 失敗時以一行回報，儲存本身仍然完成。"
## 設定の項目 `git.when` の説明(行の区切りは --print-config のコメントの行)。
CfgGitWhen = "git.auto 的執行時機：\"save\" 每次儲存後（每次儲存一個提交），\"quit\" 在 mdgrid\n結束時執行一次（整個工作階段一個提交）。結束時仍在等待的筆記一律在此時處理。"
## 設定の項目 `git.message` の説明(行の区切りは --print-config のコメントの行)。
CfgGitMessage = "提交訊息：\"auto\" 寫入「mdgrid: 更新 N 則筆記」與路徑；\"ask\" 在每次儲存後\n開啟一行輸入欄（留空則使用自動訊息，按 Esc 則將筆記留到\n結束時的提交）。"
## 設定の項目 `look.theme` の説明(行の区切りは --print-config のコメントの行)。
CfgLookTheme = "畫面的色彩主題。\"default\" 保留終端機本身的色彩。表\n{ light = ..., dark = ... } 依終端機的背景選擇；\"auto\" 即\n{ light = \"saas\", dark = \"sumi\" }。不使用色彩時無效；256 色終端機會使用\n最接近的色彩。"
## 設定の項目 `look.preset` の説明(行の区切りは --print-config のコメントの行)。
CfgLookPreset = "一整組元件樣式。[look.style] 可覆寫個別元件。在較窄範圍寫入的樣式組\n會捨棄在較寬範圍寫入的元件樣式。"
## 設定の項目 `look.mode` の説明(行の区切りは --print-config のコメントの行)。
CfgLookMode = "啟用色彩時的外觀：\"modern\"（類似 lazygit：著色的選取、強調色的框線與按鍵、\n淡色的標籤）或 \"classic\"（反白）。畫面上的文字相同；不使用色彩時兩者\n看起來都像 classic。"
## 設定の項目 `look.cells` の説明(行の区切りは --print-config のコメントの行)。
CfgLookCells = "啟用色彩時表格儲存格的外觀：\"rich\"（布林值、清單、重複的短值、\n連結與欄位型別標示，以 [look.style] 的元件樣式繪製）或 \"plain\"（原樣顯示\n文字）。不使用色彩時，儲存格一律為 plain。"
## 設定の項目 `look.style` の説明(行の区切りは --print-config のコメントの行)。
CfgLookStyle = "覆寫樣式組中的個別元件樣式：status（\"dot\"、\"shape\"、\"text\"、\"pill\"、\"tint\"、\n\"solid\"、\"soft\"、\"chip\"、\"plain\"）、tags（\"dots\"、\"hash\"、\"brackets\"、\"pill\"、\"tint\"、\n\"solid\"、\"soft\"、\"chip\"、\"plain\"）、check（\"box\"、\"tick\"、\"bracket\"、\"text\"）、select\n（\"bar\"、\"cross\"、\"tint\"、\"outline\"、\"fill\"、\"reverse\"）、rules（\"none\"、\"header\"、\n\"columns\"、\"grid\"）、tabs（\"underline\"、\"pill\"、\"segment\"、\"brackets\"、\"dim\"）、frames\n（\"rounded\"、\"square\"、\"heavy\"、\"ascii\"、\"none\"）、band（\"keys\"、\"boxed\"、\"quiet\"）、links\n（\"accent\"、\"plain\"）與 icons（true 或 false）。\"plain\"（check 為 \"text\"）會讓該元件\n保持為文字。docs/catalog/index.html 會展示所有選項，並為你寫出此表。"
## 設定の項目 `look.columns` の説明(行の区切りは --print-config のコメントの行)。
CfgLookColumns = "單一欄位的外觀：\"rich\"、\"plain\" 或 \"chip\"（即使該欄未被偵測為膠囊，\n也以膠囊顯示）。欄位的設定優先於元件樣式。"
## 設定の項目 `look.colors` の説明(行の区切りは --print-config のコメントの行)。
CfgLookColors = "依角色覆寫主題的色彩：background、text、header、selection、selection_text、\nband、band_text、accent、strong、zebra、zebra_text、mark、added、removed、pending 與\nhighlight。[look.colors.values] 依值設定色彩（不分大小寫），所有元件\n樣式都會使用。色彩為 \"#rrggbb\"、\"#rgb\" 或名稱（black、white、gray、red、orange、\nyellow、green、teal、cyan、blue、purple、magenta、pink、brown）。theme = \"default\" 時，\n只使用 accent、selection 與值的色彩。在較窄範圍寫入的主題會捨棄\n在較寬範圍寫入的角色色彩。"
## 設定の項目 `display.row_numbers` の説明(行の区切りは --print-config のコメントの行)。
CfgDisplayRowNumbers = "依顯示順序，在每列左側標上 1、2、3...。"
## 設定の項目 `display.zebra` の説明(行の区切りは --print-config のコメントの行)。
CfgDisplayZebra = "隔列加上底色（不使用色彩時不加）。"
## 設定の項目 `display.column_lines` の説明(行の区切りは --print-config のコメントの行)。
CfgDisplayColumnLines = "在欄位之間繪製 │。"
## 設定の項目 `display.group_gap` の説明(行の区切りは --print-config のコメントの行)。
CfgDisplayGroupGap = "除了第一個以外，每個群組標題上方空一行。"
## 設定の項目 `display.tabs` の説明(行の区切りは --print-config のコメントの行)。
CfgDisplayTabs = "檢視分頁列：\"always\"、\"auto\"（只在有兩個以上的檢視時顯示；只有一個檢視時\n該行給表格使用）或 \"never\"。無論哪一種，分頁按鍵都能使用。"
## 設定の項目 `display.search_bar` の説明(行の区切りは --print-config のコメントの行)。
CfgDisplaySearchBar = "在表格上方顯示搜尋列。false 則隱藏；此時快速篩選改在\n最底行輸入。"
## 設定の項目 `display.chips` の説明(行の区切りは --print-config のコメントの行)。
CfgDisplayChips = "顯示目前生效之檢視設定的設定列。隱藏時仍可用 f 選取其項目。"
## 設定の項目 `display.buttons` の説明(行の区切りは --print-config のコメントの行)。
CfgDisplayButtons = "檢視列中搜尋列與篩選、排序按鈕的繪製方式：\"plain\"\n（以背景色呈現）或 \"box\"（在檢視列的留白行上以線條框起，\n不填色）。沒有留白（display.bar_padding = 0）時不繪製線條。"
## 設定の項目 `display.bar_padding` の説明(行の区切りは --print-config のコメントの行)。
CfgDisplayBarPadding = "檢視列上下的留白行數：0、0.5、1、1.5 或 2（1 與 1.0 皆可）。\n0 會將檢視列繪製在一行內。半行會填上檢視列的背景色，並以畫面背景色\n（主題的，或終端機的，於啟動時詢問一次）的半格方塊（上方 ▀、下方 ▄）蓋住外側一半；\n無法得知背景色時、不使用色彩時，以及 terminal.ambiguous_wide = true 時，\n會進位為一整個空行。\n終端機高度少於 16 行，或隱藏搜尋列時，一律使用 0。其他值會\n顯示警告並改用預設值。"
## 設定の項目 `display.top_padding` の説明(行の区切りは --print-config のコメントの行)。
CfgDisplayTopPadding = "標題列上方的留白行數：0、0.5、1、1.5 或 2。半行的繪製方式與\ndisplay.bar_padding 相同（標題列上方為 ▀，標題列則填上檢視列的背景色）。\n終端機高度少於 16 行時一律使用 0。"
## 設定の項目 `display.row_extra_lines` の説明(行の区切りは --print-config のコメントの行)。
CfgDisplayRowExtraLines = "表格的列最多可額外增加幾行：含有長值或換行的列，會依欄寬折行，\n最多增高到 1 + 此數值的行數（每列只增高到所需的高度）。\n放不下的部分以 … 結尾。0 會讓每列都保持一行，\n換行顯示為 …⏎。其他值會顯示警告並改用預設值。"
## 設定の項目 `display.note_path` の説明(行の区切りは --print-config のコメントの行)。
CfgDisplayNotePath = "左側筆記欄顯示各筆記的方式：\"common\" 省略所有列共用的資料夾，\n\"name\" 只顯示名稱，\"full\" 顯示從根目錄起的路徑，\"off\" 不顯示名稱（只有列標示）。\n其他值會顯示警告並改用預設值。"
## 設定の項目 `display.tab_wrap` の説明(行の区切りは --print-config のコメントの行)。
CfgDisplayTabWrap = "檢視分頁放不進檢視列那一行時，將它們全部移到搜尋框與按鈕下方，\n需要幾行就用幾行，讓每個分頁都看得到（表格會因此往下移）。\nfalse 則維持一行，在畫面較窄時省略其他分頁。"
## 設定の項目 `display.tab_wrap_gap` の説明(行の区切りは --print-config のコメントの行)。
CfgDisplayTabWrapGap = "使用 tab_wrap 時，在搜尋框那一行與其下方的分頁行之間空一行。"
## 設定の項目 `display.note_name` の説明(行の区切りは --print-config のコメントの行)。
CfgDisplayNoteName = "套用到筆記欄名稱的正規表示式（在 note_path 之後；有資料夾時只套用到\n最後一段）。符合時，顯示名為 name 的擷取群組，否則顯示第一個擷取群組，否則顯示\n移除符合部分後的名稱。不符合的名稱，或會變成空白的名稱，維持原樣。\"\" 表示\n不設定。無法讀取的運算式會顯示警告且不使用。"
## 設定の項目 `dates.format` の説明(行の区切りは --print-config のコメントの行)。
CfgDatesFormat = "表格中日期的顯示與輸入格式。部分：YYYY、YY、MM、M、DD、D、ddd\n（星期）與非英數字的分隔字元。筆記中一律寫成 YYYY-MM-DD。"
## 設定の項目 `dates.week_start` の説明(行の区切りは --print-config のコメントの行)。
CfgDatesWeekStart = "日期行事曆中每週的第一天。"
## 設定の項目 `edit.candidates` の説明(行の区切りは --print-config のコメントの行)。
CfgEditCandidates = "編輯文字儲存格時提供的值候選數上限。\n不同值多於此數的欄位不提供候選。"
## 設定の項目 `edit.add_frontmatter` の説明(行の区切りは --print-config のコメントの行)。
CfgEditAddFrontmatter = "允許寫入沒有 front matter 或 front matter 為空的筆記（會新增 front matter 或\n鍵的那一行）。false 會讓這些筆記成為唯讀。"
## 設定の項目 `new_note` の説明(行の区切りは --print-config のコメントの行)。
CfgNewNote = "從表格建立新筆記的方式：mode（\"form\"：含所有欄位的表單，或\n\"editor\"：建立後用編輯器開啟）、folder（相對於開啟的資料夾）、name（名稱\n範本）、ask（表單的欄位；預設：可見的欄位）、required（必須填寫的\n欄位）、hidden（不顯示欄位而直接寫入的欄位）、body（內文範本檔）與\n[new_note.set]（欄位 = 值）。範本可使用 {date}、{date+7}、{date:YYYY/MM/DD}、\n{time}、{now}、{weekday}、{name} 與 {folder}。來自檢視篩選的值優先。\n此表為單一項目：在較窄範圍寫入時會整個取代。 name_head（\"show\"：把填好的範本放進名稱欄；\"hide\"：不顯示，並加在輸入的名稱前面）。"
## 設定の項目 `keys` の説明(行の区切りは --print-config のコメントの行)。
CfgKeys = "依模式重新指派按鍵：在 [keys.<模式>] 下寫 按鍵 = 動作名稱。\n\"none\" 會移除該按鍵。模式：table、edit、review、quit、help、palette、search、\nfilter、detail、settings、settings_input、chips、list_select、menu、freq、sorts、relations、drawer、filter_window、filter_input、screen_menu、column_type、tree、gantt、kanban、chart、notice、switch、\ninput_normal（vim 模式）。動作名稱顯示在命令面板（:）中。"
## 設定の項目 `keys.vim` の説明(行の区切りは --print-config のコメントの行)。
CfgKeysVim = "vim 模式：輸入框以插入模式開始，按 Esc 切換到一般模式（h l 0 $ w b e、\ni a I A、x X dw db d$ D dd、cw c$ C cc、u）。表格可使用 dd（刪除筆記）、p（貼上\n以 y 或 Y 複製的值）與 .（重複上一個值）。false 則所有按鍵維持原樣。"
## 設定の項目 `search.across` の説明(行の区切りは --print-config のコメントの行)。
CfgSearchAcross = "在命令面板中加入「在整個工作區中搜尋」：在目前工作區（或已登錄的表格）中\n每個表格的每一列尋找字詞，並依表格列出符合的列。\nfalse（預設）則命令面板維持原樣。"
## 設定の項目 `templates` の説明(行の区切りは --print-config のコメントの行)。
CfgTemplates = "設定組的具名片段（[look]、[display]、[dates]、[edit]、[new_note]）。在任何範圍\n寫 use = \"<名稱>\" 即可將其鋪在該範圍的值之下。ui.toml 的樣板優先於\nconfig.toml 中同名的樣板。"
## 設定の項目 `conditions` の説明(行の区切りは --print-config のコメントの行)。
CfgConditions = "具名條件：寫一次的運算式（expr），以名稱使用。可用於任何運算式中的\ncond(\"<名稱>\")、只顯示符合列的數字鍵（key = 1-9）、檢視設定的篩選區塊，\n以及用 hide = true 在所有表格中隱藏符合的列。label 是顯示的名稱。"
## 設定の項目 `notices` の説明(行の区切りは --print-config のコメントの行)。
CfgNotices = "標題列上方的通知欄，僅在寫了項目時顯示。計數項目會在目前表格、工作區或指定的表格中，\n計算符合具名條件（[conditions]）的列數；筆記項目會顯示\n筆記內文的開頭幾行。mdgrid --notices 會輸出相同的行。"
## 設定の項目 `notify` の説明(行の区切りは --print-config のコメントの行)。
CfgNotify = "當某列新符合具名條件（[conditions]）時，逐列通知到終端機、桌面或你自己的命令。\n加入項目時已符合的列會被靜默記住；一次檢查中新符合的列超過 group_over 時合併為一則。\nmdgrid 開啟期間由畫面檢查；mdgrid --notify 供排程執行檢查一次。"


# mdgrid の画面と起動の文言の台帳: 英語(SR-23)。文言の名前と並びの正本。
# 1行に1つ `名前 = "文"`(TOML の基本の文字列)。`##` の行は次の文言の説明(コードの文書になる)、`#` の行は区切り。
# 差し込みは `{0}`・`{1}` の番号。ほかの言語の台帳は同じ名前を全部持ち、同じ番号を使う(欠け・余り・空・番号の
# 食い違いはビルドで落ちる。build.rs・src/ledger.rs)。


# ---- main: 使い方(CLI-2) ----
Usage = "用法：  mdgrid [<.base | 資料夾 | .md | .csv> ...] [--view <名稱>] [-w <名稱>] [--page <名稱>] [--raw] [--readonly] [--no-color] [--config <路徑>]\n        mdgrid [<.base | 資料夾 | .md> ...] --print [--format csv|tsv|json|md] [--with-path] [--view <名稱>]\n                 [--filter <運算式>]... [--sort <欄位>[:desc]]...\n        mdgrid [<.base | 資料夾 | .md> ...] --pick path|<欄位> [--view <名稱>]\n        mdgrid [<.base | 資料夾 | .md> ...] --check [--view <名稱>]\n        mdgrid [<.base | 資料夾 | .md> ...] --count [--view <名稱>] [--filter <運算式>]...\n        mdgrid [<.base | 資料夾> ...] --notices\n        mdgrid [<.base | 資料夾> ...] --notify\n        mdgrid [<.base | 資料夾> ...] --apply <路徑> [--yes]\n        mdgrid [<資料夾 | .base> ...] --add-to <名稱> [--as <表格名稱>] | --remove-from <名稱>\n        mdgrid [<資料夾> ...] --init-workspace [--starter <名稱> [--with-samples]]\n        mdgrid [<資料夾>] --new-note <名稱> [--set <欄位>=<值>]...\n        mdgrid --continue [--readonly] [--no-color] [--config <路徑>]\n        mdgrid -s <名稱> [--readonly] [--no-color] [--config <路徑>]\n        mdgrid --sessions\n        mdgrid --recent\n        mdgrid --starters\n        mdgrid --workspaces | --remove-workspace <名稱>\n        mdgrid --print-config\n        mdgrid --completions <shell>\n        mdgrid --man\n\n  開啟由資料夾中 Markdown 筆記組成的表格：每則筆記一列，每個 front matter\n  鍵一欄。指定 .base 時，開啟其表格檢視（筆記從根資料夾下尋找）。\n  指定 .md 檔案時，開啟其所在資料夾並選取該筆記。\n  指定 .csv 或 .tsv 檔案時，將其開啟為表格：每行一列，第一行為\n  欄位名稱。\n  不帶引數時開啟目前的資料夾（若 places.toml 有登錄的表格，會在上方\n  疊加其清單）。若資料夾的標記檔 .mdgrid/workspace.toml 在 \"open\" 指定了\n  表格，則改為開啟該表格。\n\n  --view <名稱>           開啟 .base 的該檢視（省略時為第一個檢視；\n                          --print 也會尋找 mdgrid 的檢視）\n  -w, --workspace <名稱>  以該工作區（workspaces.toml）作為連結與關聯圖的範圍；\n                          未指定路徑時開啟其第一個表格\n  --page <名稱>           開啟工作區的該頁面（[[page]]），其表格上下堆疊\n  --raw                   開啟資料夾本身，而非標記檔 \"open\" 指定的表格\n  --readonly              以唯讀開啟（不編輯、不儲存）\n  --no-color              不使用色彩繪製\n  --config <路徑>         讀取此設定檔\n                          （預設：$XDG_CONFIG_HOME/mdgrid/config.toml）\n  --continue              開啟此資料夾中最後顯示的表格與檢視（若沒有則與\n                          不帶引數相同；用於 tmux 等還原視窗的情境）\n  -s, --session <名稱>    開啟以該名稱儲存的工作階段（表格、檢視、篩選、\n                          排序與欄位；在命令面板以「儲存工作階段」儲存）\n  --sessions              列出已儲存的工作階段（sessions.toml）：名稱與資料夾，每行一筆\n  --recent                依新到舊輸出最近在畫面上開啟的表格，每行一筆，\n                          格式為 \"路徑<TAB>檢視名稱<TAB>最後開啟時間\"（最多 20 筆）\n  --print                 不顯示畫面，將檢視的表格輸出到標準輸出\n                          （不修改筆記）\n  --format <格式>         --print 的格式（csv、tsv、json、md；預設 csv）\n  --with-path             在 --print 前面加上 \"path\" 欄，內容為各列筆記的路徑\n                          （與 --pick path 的路徑相同）\n  --filter <運算式>       只保留 .base 運算式為真的列\n                          （可重複；用於 .base 檢視時與其篩選條件合併）\n  --sort <欄位>[:desc]    依此欄位排序 --print 的輸出（可重複；\n                          取代檢視的排序）\n  --count                 不顯示畫面，輸出檢視的列數（套用 --filter 之後）\n  --show-hidden           搭配 --print、--pick 或 --count 時，保留被 hide = true 的\n                          條件（[conditions]）隱藏的列\n  --notices               不顯示畫面，每行輸出一個通知欄（[[notices]]）的項目\n                          （用於 tmux 狀態列或 shell 提示字元）\n  --notify                不顯示畫面，檢查一次 [[notify]] 的項目，通知新符合的列\n                          （供排程執行呼叫；有通知未送達時結束代碼為 1）\n  --pick <path|欄位>      在終端機以唯讀顯示畫面；按 Enter 會將已標記的列\n                          （或選取的列）的路徑或欄位值，每行一個，\n                          輸出到標準輸出後結束\n                          （按 q 或 Esc 取消，結束碼為 1）\n  --check                 輸出不符合欄位型別或規則（[rules]）的值，\n                          每行一個（路徑:行: 欄位: 原因；若有問題，\n                          結束碼為 1）\n  --apply <路徑>          讀取 --print --with-path 格式的 CSV 或 JSON（- 表示標準輸入）\n                          並修改有差異的儲存格；只顯示差異\n  --yes                   搭配 --apply，寫入變更\n  --workspaces            列出工作區（workspaces.toml）\n  --add-to <名稱>         將指定的表格（預設：此資料夾）加入該工作區，\n                          必要時建立工作區；以 --as <名稱> 指定表格名稱\n  --remove-from <名稱>    從該工作區移除指定的表格（預設：此資料夾）\n  --remove-workspace <名稱>  刪除該工作區（不會動到筆記）\n  --init-workspace        在資料夾中放置工作區標記檔 .mdgrid/workspace.toml\n                          （預設：此資料夾）\n  --starter <名稱>        搭配 --init-workspace，從該起始範本建立帳本（標記檔、筆記範本）：\n                          內建的，或設定資料夾中的 starters/<名稱>\n  --with-samples          搭配 --starter，一併加入起始範本的範例筆記\n  --starters              列出起始範本，每行一個（名稱與一行說明）\n  --new-note <名稱>       不顯示畫面，在資料夾（預設：此資料夾）建立新筆記 <名稱>.md，\n                          依 [new_note]（folder、set、範本）建立；輸出建立的路徑，\n                          絕不覆寫\n  --set <欄位>=<值>       搭配 --new-note，將該值填入欄位（可重複；清單項目以\n                          逗號分隔；空值不寫入）\n  --print-config          以 TOML 輸出所有設定項目，附預設值\n                          與說明（docs/config.md）\n  --completions <shell>   輸出 shell 補全定義（bash、zsh、fish、elvish、powershell）\n  --man                   輸出 man 頁面（roff）\n  --help                  輸出此說明\n  --version               輸出版本"

